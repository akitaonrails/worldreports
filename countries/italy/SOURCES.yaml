  gdp_pc.csv: &curated_international_gdp_pc_csv
    source: World Bank — NY.GDP.PCAP.CD
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Current US$ per person, harmonised across countries. WB 2024-25
      GDP is 0.4% below Eurostat × the ECB mean rate (older national-
      accounts vintage; equal within 0.2% in 2006-2023).
  gdp_pc_from_wb.csv: *curated_international_gdp_pc_csv
  population.csv: &curated_international_population_csv
    source: World Bank — SP.POP.TOTL
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Cross-check only, MID-YEAR (the others are 1 January). The
      population series of record is ISTAT's reconstructed resident
      population at 1 January, carried 2006-2026 by Eurostat demo_gind
      (social/demography_from_estat.csv) on one vintage; ISTAT's own flow
      22_289 holds only the permanent-census years 2019-2026 and equals
      it. WB runs 35-245k above it before 2014 and 13-200k below after.
  population_from_wb.csv: *curated_international_population_csv
  reserves.csv: &curated_international_reserves_csv
    source: World Bank — FI.RES.TOTL.CD (IMF IFS)
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Total reserves including gold, current US$ (units, not bn). The
      2025 jump (US$290.5bn → 434.0bn) is the gold price on Italy's
      ~2,450 t, not a purchase. A eurozone member's
      reserves are a small, semi-dormant number — the ECB holds the
      union's real buffer — and the plate should say why it is small
      rather than let it read as fragility.
  reserves_from_wb.csv: *curated_international_reserves_csv
  openness.csv: &curated_international_openness_csv
    source: World Bank — NE.TRD.GNFS.ZS
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Exports plus imports of goods and services as a share of GDP,
      national-accounts basis — not the customs-value trade the pending
      Coeweb chapter will draw.
  openness_from_wb.csv: *curated_international_openness_csv
  hdi.csv: &curated_international_hdi_csv
    source: UNDP — Human Development Report 2025, composite indices complete time series
    url: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      One file, one vintage, every year (verified 2026-10-22: Italy HDI
      2023 = 0.915). The HDR recomputes the whole back-series at each
      methodology change, so a trend assembled from successive reports is
      partly an artefact of the reports. NOTE: the file is NOT UTF-8
      (Latin-1, a 0xf4 byte trips strict decoding) — the fetcher decodes
      latin-1.
  hdi_from_undp.csv: *curated_international_hdi_csv
