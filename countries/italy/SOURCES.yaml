  gini_from_wb.csv: *curated_social_gini_wb_csv

security:
  homicide_police.csv: &curated_security_homicide_police_csv
    source: ISTAT — flow 73_67 (Delitti denunciati dalle forze di polizia all'autorità giudiziaria; source data Ministero dell'Interno SDI)
    url: https://esploradati.istat.it/SDMXWS/rest/data/73_67/A.IT..INTENHOM..?startPeriod=2006
    refreshed_by: fetch/fetch_istat.py
    notes: >-
      Police-recorded crime, national (REF_AREA=IT; provinces carry the
      bulk — 22MB for two years unkeyed). TYPE_CRIME carries INTENHOM
      (omicidi volontari consumati — completed intentional homicides),
      ATTEMPHOM (attempted), INFANTHOM, MAFIAHOM (mafia homicides — a
      subset drawn as a subset, SOURCING §"a subset drawn as a peer");
      DATA_TYPE CRIMEN = counts, CRIMET = per-100k rates. Verified
      2026-10-22: INTENHOM rate 2022-2024 = 0.6 per 100k. This is the
      Min Interno SDI record via ISTAT (the ministry's own portal has no
      machine endpoint today; meta.pending). The key has SIX parts —
      FREQ.REF_AREA.DATA_TYPE.TYPE_CRIME.Y_KNOWN_OFFENDER_IDEN.
      REFERENCE_PERIOD_CRIME — and the staged cells are offender status 9
      (all) and YRDUR (offences recorded in the year). AS STAGED:
      intenhom (count) and intenhom_per100k (ISTAT's own rate, ONE
      decimal) for 2006-2024; 2024 326 offences, 0.6. The attempted,
      mafia and infant columns are meta.pending (ISTAT throttling).
  homicide_police_from_istat.csv: *curated_security_homicide_police_csv
  homicide_vital.csv: &curated_security_homicide_vital_csv
    source: ISTAT — from causes_of_death (39_494, assault codes X85-Y09 in the European shortlist)
    refreshed_by: fetch/fetch_istat.py
    notes: >-
      The death-certificate count of homicide, counted at the victim's
      residence, against the police count at the place of occurrence —
      the two disagree in both directions and neither is wrong
      (SOURCING §4). Two columns, two lines, both labelled. AS STAGED:
      shortlist code 17_3, counts, 2006-2023 (2024 not yet published).
      Measured: certificates run 15-30% BELOW the police count in every
      year (2006 475 vs 621; 2023 239 vs 341, −30%). See DATA_NOTES.
  homicide_vital_from_istat.csv: *curated_security_homicide_vital_csv

migration:
  immigration.csv: &curated_migration_immigration_csv
    source: Eurostat — migr_imm1ctz (by citizenship) and migr_imm3ctb (by country of birth)
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_imm1ctz?geo=IT&agedef=REACH&age=TOTAL&sex=T&citizen=TOTAL&unit=NR
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      Immigration FLOW, both definitions. ITALY-SPECIFIC FINDING
      (verified 2026-10-22): the TOTALS are identical on the two cuts for
      every year 2008-2024 (e.g. 2024 = 451,583 on both) — Italy
      transmits one flow series under both definitions, and there is NO
      EM/EMCR-style splice like Spain's (no break flags; smooth 2020-21:
      247,526 -> 318,366). The citizenship-vs-birth contrast therefore
      lives in the SPLITS (citizen=IT/EU27_2020_FOR/NEU27_2020_FOR), not
      the totals; the non-EU split is present from 2020 (2024: 352,461).
      Draw the splits; do not promise a totals gap that is not there.
      migr_imm1ctz alone runs back to 1998; migr_imm3ctb starts 2008.
  immigration_from_estat.csv: *curated_migration_immigration_csv
  emigration.csv: &curated_migration_emigration_csv
    source: Eurostat — migr_emi1ctz (by citizenship)
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      Emigration flow, by citizenship (total, national, eu27, non_eu27),
      to 2024 (2024: 188,903); the EU/non-EU split exists from 2020 and
      the national split from 2008. Register-based
      departures are known to be under-measured across Europe (leaving
      needs no paperwork; AIRE registrations lag); published as its own
      series beside immigration, never as a pre-computed net.
  emigration_from_estat.csv: *curated_migration_emigration_csv
  stock.csv: &curated_migration_stock_csv
    source: Eurostat — migr_pop1ctz (by citizenship) and migr_pop3ctb (by country of birth)
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_pop1ctz?geo=IT&age=TOTAL&sex=T&citizen=FOR_STLS&unit=NR
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      Resident population on 1 January on BOTH definitions. ITALY QUIRK
      (verified 2026-10-22): the foreign-citizen aggregate code here is
      FOR_STLS, not FOR — citizen=FOR returns well-formed and EMPTY (the
      endpoint's silent-truncation trap, same shape as Spain's unit=NR).
      FOR_STLS 1-Jan-2025 = 5,371,251, matching ISTAT's 29_7 to the unit;
      EU27_2020_FOR 1,373,870 + NEU27_2020_FOR 3,996,856 + stateless 525.
      The country-of-birth twin DOES use FOR: migr_pop3ctb FOR 1-Jan-2025
      = 6,928,045. Stock by citizenship can fall while arrivals rise —
      the naturalisation gap is the finding (see migr_acq).
  stock_from_estat.csv: *curated_migration_stock_csv
  asylum.csv: &curated_migration_asylum_csv
    source: Eurostat — migr_asyappctza (asylum applicants)
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_asyappctza?geo=IT&sex=T&age=TOTAL&citizen=TOTAL&unit=PER&applicant=TOTAL
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      Applications (unit=PER mandatory — with unit=NR the cube returns
      well-formed and EMPTY, Spain's trap, confirmed for IT). Starts 2008;
      runs THROUGH 2025 already (2024: 158,605; 2025: 135,485).
      Applications are not arrivals, grants or people present — the four
      differ by an order of magnitude at the edges (SOURCING §4a).
  asylum_from_estat.csv: *curated_migration_asylum_csv
  permits.csv: &curated_migration_permits_csv
    source: Eurostat — migr_resfirst (first residence permits, unit=PER)
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      First permits ISSUED in the year — administrative events, not
      arrivals: a status change issues a new first permit without a new
      arrival. Starts 2008; 2024: 346,411; 2025: 433,099 already present.
      unit=PER mandatory (as above).
  permits_from_estat.csv: *curated_migration_permits_csv
  naturalisation.csv: &curated_migration_naturalisation_csv
    source: Eurostat — migr_acq (acquisitions of citizenship)
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_acq?geo=IT&sex=T&age=TOTAL&citizen=TOTAL&agedef=REACH&unit=NR
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      People who became Italian in the year (2024: 217,448; the 2013-2016
      wave peaks at 201,591 in 2016). This is the series that makes the
      citizenship-cut stock fall while arrivals rise; drawn beside the
      stocks, not inside them.
  naturalisation_from_estat.csv: *curated_migration_naturalisation_csv
  migration_flows.csv: &curated_migration_migration_flows_csv
    source: ISTAT — flow 28_185 (Migrazioni / trasferimenti di residenza), subflows DF_DCIS_MIGRAZIONI_2/3 (immigrati) and _5/6 (emigrati)
    url: https://esploradati.istat.it/SDMXWS/rest/data/28_185_DF_DCIS_MIGRAZIONI_2/
    refreshed_by: fetch/fetch_istat.py
    notes: >-
      The national twin of the Eurostat flow files: anagraphic
      registrations for change of residence from/to abroad
      (CHANGE_OF_RESIDENCE=FREIGN), by citizenship, sex, age. Shape
      verified 2026-10-22. Register-based like the harmonised series.
      Keys: immigration A.ITTOT.TREG.FREIGN.TOTAL+IT+FOR.9.TOTAL.ITTOT.
      X1033.X1033 (subflow _2), emigration A.IT.TDEREG.FREIGN... (subflow
      _5) — the national total is REF_AREA=ITTOT in the immigration
      subflow and IT in the emigration one, and X1033 ('world') is the
      geographic total. Columns: immigration, emigration, each split
      italian/foreign (IT+FOR = total, asserted every year), and balance
      (= immigration − emigration, computed). 2006-2025; 2025 is here and
      not yet in Eurostat. Equal to Eurostat migr_imm1ctz/migr_emi1ctz
      to the person in 2006-2007 and 2011-2024; in 2008-2010 Eurostat is
      higher (immigration +40,318 / +21,081 / +11,112; emigration
      +19,276 / +15,676 / +11,270). See DATA_NOTES; never spliced.
  migration_flows_from_istat.csv: *curated_migration_migration_flows_csv
  foreign_residents.csv: &curated_migration_foreign_residents_csv
    source: ISTAT — flow 29_7 (Stranieri residenti al 1° gennaio)
    url: https://esploradati.istat.it/SDMXWS/rest/data/29_7/A.IT...TOTAL?detail=dataonly
    refreshed_by: fetch/fetch_istat.py
    notes: >-
      Foreign-citizen residents at 1 January, national. Key verified
      2026-10-22: dims FREQ.REF_AREA.DATA_TYPE(JAN).SEX.AGE — the wildcard
      form A.IT...TOTAL works; 1-Jan-2025 = 5,371,251 (5,559,527 at
      1-Jan-2026), matching Eurostat's FOR_STLS exactly. AS STAGED: the
      flow carries the permanent-census basis only, 1-Jan-2019 to
      1-Jan-2026, with male/female columns; 2006-2018 are blank. Eurostat
      stock_from_estat.csv carries 2006-2025 and equals it on 2019-2025. The full unkeyed
      flow is too heavy to pull today (province-level) — always key.
      Citizenship detail: 29_317.
  foreign_residents_from_istat.csv: *curated_migration_foreign_residents_csv

