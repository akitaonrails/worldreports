# Data provenance — Israel. Discovery pass complete 2026-10-22;
# fetchers staged sidecars 2026-10-22; curated 2026-10-23 (Phase B).
#
# Written BEFORE any CSV, per SOURCING_A_COUNTRY.md §3. The group entries
# below name curated CSVs under data/, created by diffing what the
# fetch/*.py sidecars pulled (byte-identical diffs — the sidecars' own
# numbers, reviewed and renamed; re-running a fetcher writes the `_from_*`
# sidecar again, never a curated file). Each fetcher is re-runnable:
# online twice and offline-from-cache produce byte-identical output.
# Every endpoint listed was curl'd live on 2026-10-22 with the payload
# shape checked BEFORE caching.
#
# Israel sits IN the international comparables layer (WB ISO3=ISR, IMF
# WEO, UNDP, OECD membership), and the OECD SDMX API carries
# Israel-specific datasets (DSD_LFS@DF_IALFS_*), a harmonised layer the
# way Eurostat is for EU countries.
#
# A continuing finding of the discovery pass: cbs.gov.il and
# data.cbs.gov.il are unreachable from scripted clients on this machine
# (TCP reset after TLS, and error pages served under HTTP 200 — an
# "endpoints that lie" case). CBS-only national layers remain pending,
# but verified OECD/WHO harmonised national data and direct Bank of Israel
# workbooks now fill the slots documented below.

meta:
  pending:
    - "CBS Israel (cbs.gov.il): www.cbs.gov.il and cbs.gov.il reset the
      connection after the TLS handshake completes (real CBS cert,
      DigiCert, TLSv1.2) for every path tried; data.cbs.gov.il answers
      403 at the root, serves a Hebrew 'Oops, something is wrong' error
      page under HTTP 200 on /en/help and /reader, and resets on /api,
      /Query, /en. The API key flow (pilot_api) is only reachable via a
      browser. Re-probe with the key or from a residential/browserside
      route. Everything CBS-only is parked: macro/gdp.csv (national
      accounts — GDP annual + quarterly, the q/q signs the bands need),
      macro/cpi.csv (CPI), the CBS LFS beside social/labour.csv,
      population incl. the Rosh Hashanah release (CBS register of
      record), social/income.csv (CBS household survey income/inequality),
      demography/births_deaths.csv (vital stats), demography/causes.csv
      (CBS-direct causes of death, ICD-10; OECD/WHO harmonised national
      vital-registration mortality is staged separately), security/homicide_cbs.csv
      (death-certificate assault deaths, the §4a second count), and
      trade on the CBS national-accounts basis."
    - "Bank of Israel residual gaps: the redesigned topic pages are a JS SPA
      and can return a Radware loader under HTTP 200, but stable boi_files
      workbooks were verified for the policy rate, benchmark 10-year yield,
      household debt, mortgage rate and banking-system NPL ratio. Those
      series are staged below. The PublicApi remains useful for only the
      current FX snapshot; the advertised daily-history ZIP and CPI composite
      are dead (404). A BoI historical daily FX line, direct CPI line and
      official reserves history remain pending rather than being inferred
      from failed topic-page routes."
    - "Ministry of Finance / Accountant General: agf.gov.il does not
      resolve (NXDOMAIN); no MoF organisation on data.gov.il; budgets.
      gov.il does not resolve. mof.gov.il resolves (gov.il MoF pages)
      but no machine-readable endpoint verified this pass. IMF WEO
      general-government balance/debt is the verified harmonised
      fallback (fiscal/general_government.csv); Israel's own
      D7 debt definition stays parked and gets its own column beside
      the IMF one when it lands — never a splice."
    - "CBS national household-survey income/inequality remains blocked with
      CBS. OECD IDD/WISE is now verified and staged as a separate harmonised
      disposable-income layer, with METH2011/METH2012 and D_CUR/D_INC kept in
      separate columns. WB SI.POV.GINI was rejected because its income concept
      was not verified; it is not used as a substitute for either layer."
    - "PIBA/ASO asylum statistics (applications / decisions / grants /
      persons present) — no dataset under population_authority on
      data.gov.il; ASO (Asylum Seekers Unit) publishes on gov.il,
      endpoint pending. Four numbers, never one line (§4a). PIBA permit
      stocks (permits in force) also parked; only issuance is staged."
    - "Police crime file covers 2021-2025 only; earlier years not on
      data.gov.il this pass (security/crime_by_group.csv is
      the 2021-2025 window; the 2006-2020 half needs either the older
      police releases or the parked CBS count)."
    - "Aliyah 2006-2014: new-olim-by-years starts at the 2015 upload.
      The sibling package olim-1989-2015-year-month exists but its only
      resource is an XLS with no datastore, and the data.gov.il raw-file
      download hosts (aws-e / e .data.gov.il) are CloudFront-walled:
      403 error HTML under every UA tried (2026-10-22). Re-open via the
      parked CBS aliyah tables or a browser-side fetch of that XLS."
    - "data.gov.il route notes (both 'endpoints that lie'):
      datastore_search_sql answers 404 for GET and POST — aggregation
      runs client-side over datastore_search pages or per-filter
      `total` reads; the raw download URLs are CloudFront 403 walls,
      so the fetchers never try them. The datastore also changed
      schemas mid-run: the olim 2024 resource carries Hebrew column
      names while 2015-2023/2025 use transliterated ones — the fetcher
      detects the dialect per resource instead of assuming it."
    - "Credit lens only — debt service ratio (DSR): Israel is absent from BIS
      WS_DSR ('No results for query' for IL, checked 2026-10-22), and no
      compatible BoI household-sector DSR time series was verified. The three
      canonical credit panels are filled below from BoI series (with WDI
      nominal GDP used only as the labelled debt-ratio denominator).
      Mortgage-origination payment-to-income distributions are not a stock
      DSR and are deliberately rejected as a proxy."
    - "TASE TA-35 index symbol: ^TA35.TA is 404 on Yahoo; ^TA125.TA
      verified instead and is the main index anyway. stooq is
      JS-walled from this machine (browser challenge under HTTP 200)."

