markets:
  policy_rate.csv:
    source: "Bank of Israel — bointcre_1 and bointcre_m policy-rate workbooks"
    url: "https://www.boi.org.il/boi_files/Statistics/bointcre_1.xls"
    alt_url: "https://www.boi.org.il/boi_files/Statistics/bointcre_m.xls"
    official: true
    refreshed_by: fetch/fetch_boi_gaps.py
    notes: >-
      VERIFIED 2026-10-23. Nominal percent, complete calendar years
      2006-2025; partial 2026 is excluded. For 2006-2016 the annual value is
      the arithmetic mean of the 12 published monthly liquidity-period
      averages. For 2017-2025 it is the calendar-day-weighted mean of the
      declared nominal rate in force, using each effective Start Date. The
      annual_aggregation column preserves this definition seam: 2006 5.125%,
      2017 0.100%, 2025 4.476027%.
  government_bond_10y.csv:
    source: "Bank of Israel — benchmark 10-year unindexed government-bond yield, shcd05_e"
    url: "https://www.boi.org.il/boi_files/Statistics/shcd05_e.xls"
    official: true
    refreshed_by: fetch/fetch_boi_gaps.py
    notes: >-
      VERIFIED 2026-10-23. Annual arithmetic mean of exactly 12 monthly
      percent yields, 2006-2025; partial 2026 excluded. The publisher defines
      the observation as the longest government bond with 8-11 years of
      remaining maturity. It is a benchmark-bond series, not a constant-
      maturity/model zero-coupon curve or a MAKAM bill yield. Known checks:
      2006 6.314167%, 2020 0.777500%, 2025 4.244167%.
  usdils_boi.csv:
    source: "Bank of Israel — PublicApi representative exchange rates"
    url: "https://www.boi.org.il/currency.xml"
    alt_url: "https://boi.org.il/PublicApi/GetExchangeRates"
    official: true
    refreshed_by: fetch/fetch_boi.py
    notes: >-
      VERIFIED 2026-10-22, live JSON: {exchangeRates:[{key:"USD",
      currentExchangeRate:3.107, currentChange, unit, lastUpdate}]},
      updated intraday (2026-10-22T12:22Z at capture). ILS per 1
      foreign unit; JPY-style rows carry unit:100 (LBP unit:10) — the
      fetcher divides by unit and stages the per-one rate. This is a
      SNAPSHOT of the representative rate, not history; the
      daily-history ZIP is dead (404). Direction on the plate: ILS per
      USD, a RISING line is a weaker sheqel.
  usdils.csv:
    source: "World Bank WDI — PA.NUS.FCRF official annual average FX"
    url: "https://api.worldbank.org/v2/country/ISR/indicator/PA.NUS.FCRF?format=json"
    official: false
    refreshed_by: fetch/fetch_harmonised.py
    notes: >-
      VERIFIED 2026-10-22 (the discovery pass's named stopgap, now
      pulled): 2019 3.5645, 2023 3.6674, 2024 3.6997, 2025 3.4519 ILS
      per US$ annual mean. The FX-history stand-in while the BoI daily
      file is dead; the markets plate converts the shekel to index
      2006=100, rising = stronger.
  ta125.csv:
    source: "Tel Aviv Stock Exchange TA-125 close, redistributed by Yahoo Finance"
    url: "https://query1.finance.yahoo.com/v8/finance/chart/%5ETA125.TA?interval=1mo"
    official: false
    refreshed_by: fetch/fetch_markets.py
    notes: >-
      VERIFIED 2026-10-22 (interval=1y is rejected; range=max is NOT
      safe for every symbol — for ^GSPC it serves coarse bars with
      wrong-month closes — bounded period1/period2 is exact). Yahoo's
      TA-125 history is internally consistent (each monthly bar equals
      its own last daily close) but its LEVELS differ from TASE's
      official year-end closes by a few percent: 2020 1568.1 here vs
      1624.1 TASE, 2024 2426.8 vs 2500.6, 2010 the other way (1224.0
      vs 1203.8). The discovery note's year-ends were TASE's numbers,
      not this payload's; what IS in the payload is what is staged,
      and the fetcher asserts the 2020->2024 growth rate agrees with
      TASE's two published closes (54.8% vs 54.0%). A plate wanting
      official closes needs them hand-curated from TASE. Latest bar
      2026-10-22: 4067.91 (a live reading, labelled as one).
      ^TA35.TA 404 — symbol parked. A market index: official:false.
  sp500.csv:
    source: "S&P 500 close, redistributed by Yahoo Finance"
    url: "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1mo"
    official: false
    refreshed_by: fetch/fetch_markets.py
    notes: >-
      The spine's dashed yardstick for markets slot 4, staged on the
      same route as for the other countries (2008 close 903.25,
      asserted identically in spain's fetcher — cross-country
      consistency of the redistributor).

