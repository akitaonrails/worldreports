    notes: >-
      VERIFIED 2026-10-22. Population 2024 10.0022mn, 2025 10.1228mn —
      Israel crossed 10mn in 2024, so the brief's 9.8-10mn band is
      half a year stale. Fertility 2.85 (2023), crude birth 18.6 /
      death 5.2 per 1,000 (2023). SM.POP.NETM is an estimate and
      small (10.6k, 2024) — aliyah is NOT net migration; the two are
      different objects and the migration plate draws them apart.
      Series of record (CBS register + direct vital stats) parked with CBS;
      the crude-rate columns staged here are the harmonised stand-in
      until it returns, not a substitute. A separate OECD/WHO harmonised
      national vital-registration mortality series is staged below; only the
      CBS-direct cause table remains blocked.

mortality:
  mortality.csv:
    source: "OECD Health Statistics Causes of Mortality — OECD.ELS.HD,DSD_HEALTH_STAT@DF_COM,1.1 (WHO Mortality Database national vital registration)"
    url: "https://sdmx.oecd.org/public/rest/data/OECD.ELS.HD,DSD_HEALTH_STAT@DF_COM,1.1/ISR.A...........?startPeriod=2005&endPeriod=2026"
    official: false
    refreshed_by: fetch/fetch_mortality.py
    notes: >-
      VERIFIED 2026-10-23, annual 2005-2023, both sexes and all ages,
      MEASURE=CSEM. Harmonised redistribution of Israeli national vital-
      registration underlying-cause records, not a model estimate or COVID
      surveillance dashboard. All-cause and CICDCVID counts use DT; crude
      DT_10P5HB rates are per 100,000 (all-cause divided by 100 for the
      per-1,000 column). CICDTUME and CICDCIRC are crude per 100,000; age-
      standardised rows are excluded. Excess = (deaths / mean(2015..2019) -
      1) * 100, baseline 44,673.8, beginning 2015; it is unadjusted. OECD 2021
      checks: 50,772 all deaths, 4,800 COVID, COVID 51.2/100k, cancer
      123.6/100k and circulatory 109.3/100k; CBS independently confirms the
      4,800 COVID count. OECD 2023 has 49,654 deaths and 1,028 COVID deaths.
      No later Israeli observation exists in this vintage.

