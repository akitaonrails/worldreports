social:
  labour.csv:
    source: "OECD SDMX REST — Israel LFS (OECD.SDD.TPS, DSD_LFS@DF_IALFS_INDIC)"
    url: "https://sdmx.oecd.org/public/rest/data/OECD.SDD.TPS,DSD_LFS@DF_IALFS_INDIC,1.0/ISR........?startPeriod=2005"
    official: false
    refreshed_by: fetch/fetch_harmonised.py
    notes: >-
      VERIFIED 2026-10-22, live: 1,059 series for ISR, quarterly
      observations to 2026-Q2 and monthly to 2026-08 in one payload.
      Key quirk: nine key segments (ISR + eight empty dimensions,
      'ISR........'); response_format is NOT a valid parameter — use
      the Accept header; dimensionAtObservation accepts only DSD
      dimensions. Staged: annual UNE_LF (unemployment, 15+, 2006 8.4,
      2020 4.33, 2024 2.97), youth 15-24, and the labour force level
      in thousands. This IS the LFS definition (survey), not the NII
      payroll register — survey-vs-administrative note kept for the
      plate. The CBS LFS beside it is parked. OECD IDD income distribution is
      staged below as the harmonised layer; only the CBS national-survey
      income series remains pending.
  income_distribution.csv:
    source: "OECD Income Distribution Database — OECD.WISE.INE,DSD_WISE_IDD@DF_IDD"
    url: "https://sdmx.oecd.org/public/rest/data/OECD.WISE.INE,DSD_WISE_IDD@DF_IDD,/ISR.A.INC_DISP_GINI+PR_INC_DISP......?startPeriod=2006&dimensionAtObservation=AllDimensions"
    official: false
    refreshed_by: fetch/fetch_spending_people.py
    notes: >-
      VERIFIED 2026-10-23, observations 2008-2023. Disposable household
      income: INC_DISP_GINI on the 0-1 scale and PR_INC_DISP as percent below
      50% of median equivalised disposable income, for total, under-18 and
      over-65 age groups. Segments remain separate: METH2011/D_CUR 2008-2011,
      METH2012/D_INC 2011-2022, and METH2012/D_CUR a 2023 point only. They
      must not be spliced. The 2023 current-definition values are Gini
      0.34154999256134, total poverty 17.1729996800423%, child
      23.2418423092589%, and old age 16.0038828849792%.
  minimum_wage.csv:
    source: "Israel National Insurance Institute (Bituach Leumi) — statutory adult minimum-wage history"
    url: "https://www.btl.gov.il/Mediniyut/GeneralData/Pages/%D7%A9%D7%9B%D7%A8%20%D7%9E%D7%99%D7%A0%D7%99%D7%9E%D7%95%D7%9D.aspx"
    official: true
    refreshed_by: fetch/fetch_spending_people.py
    notes: >-
      VERIFIED 2026-10-23, calendar years 2006-2025. Nominal statutory adult
      monthly wage in ILS, annualised as the mean of the 12 legal monthly
      levels in force. USD equals that annual ILS mean divided by committed
      annual-average ILS/USD; it is nominal, not PPP. Effective-level checks:
      ILS 3,456.58 from 2006-04-01, ILS 5,300 from 2018-04-01, and ILS
      6,247.67 from 2025-04-01. The 2025 annual mean is ILS 6,155.7575 /
