      UNVERIFIED. Survey-based; note the HUC definition and the
      ultra-Orthodox/Arab sampling-frame history if documented.
      Unemployment rate annual averages; LFS vs administrative
      (National Insurance Institute registered unemployed) is a
      survey-vs-administrative pair — two series if both are staged.
  income.csv:
    source: "UNVERIFIED — CBS Income and Expenditure / Household Survey; income distribution tables"
    notes: >-
      UNVERIFIED. Inequality: CBS household survey Gini vs OECD
