      two columns, both labelled, per SOURCING §4.

migration:
  # The §4a chapter. Israel's definition is its own: olim are immigrants
  # under the Law of Return (1950/1952) — a quasi-citizenship category,
  # NOT the same legal object as an ordinary immigrant visa. Name it
  # precisely; never add olim and foreign workers or asylum seekers into
  # one "immigration" line.
  olim.csv:
    source: "UNVERIFIED — CBS (aliyah entries) / Jewish Agency count; stocks from CBS population register"
    notes: >-
      UNVERIFIED. Flow vs stock separated; olim ≠ arrivals of all types;
      olim with children under 15 vs head-of-household definitions
      differ between CBS and the Jewish Agency — pick one publisher per
      row and say which.
  foreign_workers.csv:
    source: "UNVERIFIED — PIBA / Population and Immigration Authority"
    notes: >-
      UNVERIFIED. Permit stock vs permits issued in a year is the
      migr_resfirst vs migr_resvalid confusion — two columns if both
      exist.
  asylum.csv:
    source: "UNVERIFIED — PIBA / ASO (Asylum Seekers' unit): applications, decisions, present"
    notes: >-
      UNVERIFIED. §4a: four numbers, never one line called "asylum".
  population.csv:
    source: "UNVERIFIED — CBS population, incl. the annual Rosh Hashanah press release (preliminary + final)"
    notes: >-
      UNVERIFIED. The Rosh Hashanah release is preliminary; the final
      register number follows. Two vintages of the SAME year differ —
      use one vintage for change within the series and record which.
      Magnitude check: ~10.0-10.1 mn by end-2024 (brief said 9.8-10;
      verify live).

