migration:
  olim_flow.csv:
    source: "Ministry of Aliyah and Integration — new olim PUF, open data"
    url: "https://data.gov.il/api/3/action/package_show?id=new-olim-by-years"
    official: true
    refreshed_by: fetch/fetch_data_gov_il.py
    notes: >-
      VERIFIED 2026-10-22, CKAN datastore live: person-level PUF
      aggregated client-side to year counts with the male/female split
      (male+female must equal the total) and observed-months coverage.
      THIS is the Law-of-Return flow — olim are immigrants by the Law
      of Return (1950/1952), a legal category that is not an ordinary
      visa and must never be summed with the permit counts below or
      with asylum figures into one "immigration" line. 2015 31,877 /
      2022 76,601 (Ukraine wave) / 2023 46,877 / 2024 32,678 / 2025
      22,423 through October (partial, labelled); cross-checks hold
      against Sochnut 2022 (76.8k, 0.3% off) and the CBS-cited 2015
      ~31.5k and 2023 46.0k. 2006-2014 parked (meta.pending: the
      1989-2015 package is XLS-only behind the CloudFront wall). The
      2024 resource switched to Hebrew column names — the fetcher
      detects the schema dialect per resource.
  permits.csv:
    source: "Population and Immigration Authority (PIBA) — visa/permit issuance, stats_rish"
    url: "https://data.gov.il/api/3/action/package_show?id=stats_rish"
    official: true
    refreshed_by: fetch/fetch_data_gov_il.py
    notes: >-
      VERIFIED 2026-10-22, CKAN datastore live: monthly issuance rows
      (2019 onward, the 'מתעדכן' resource; older snapshots on the
      package are padded 2013 text tables with 'קטן מ6' suppression
      cells and are refused by the int() check). Three count columns
      חדשים/הארכות/תיקונים — new vs extensions vs amendments: that is
      the §4a permit-not-person trap made concrete, and only חדשים
      behaves like a flow of first issuances. Even חדשים counts
      permit RECORDS, not people: tourist/visitor classes (ב/2, 927k
      new in 2024) dominate the totals, so the plate picks residence
      classes and says which. Visa classes carried as ASCII codes
