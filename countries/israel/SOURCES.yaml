# Data provenance — Israel. Discovery pass complete 2026-10-22.
#
# Written BEFORE any CSV, per SOURCING_A_COUNTRY.md §3. No CSV is staged
# yet; every entry below names the publisher and the endpoint curl'd
# live TODAY (2026-10-22) with the payload shape, or is parked under
# meta.pending with the reason. The fetch swarm works from this file.
#
# Israel sits IN the international comparables layer (WB ISO3=ISR, IMF
# WEO, UNDP, OECD membership), and the OECD SDMX API carries
# Israel-specific datasets (DSD_LFS@DF_IALFS_*), a harmonised layer the
# way Eurostat is for EU countries.
#
# The blocking finding of this pass: cbs.gov.il and data.cbs.gov.il are
# unreachable from scripted clients on this machine (TCP reset after TLS,
# and error pages served under HTTP 200 — an "endpoints that lie" case).
# The domestic statistical spine therefore goes to the pending list
# whole, and this pass maps every fallback that IS verified.

meta:
  pending:
    - "CBS Israel (cbs.gov.il): www.cbs.gov.il and cbs.gov.il reset the
      connection after the TLS handshake completes (real CBS cert,
      DigiCert, TLSv1.2) for every path tried; data.cbs.gov.il answers
      403 at the root, serves a Hebrew 'Oops, something is wrong' error
      page under HTTP 200 on /en/help and /reader, and resets on /api,
      /Query, /en. The API key flow (pilot_api) is only reachable via a
      browser. Re-probe with the key or from a residential/browserside
      route. Everything CBS-only is parked: national accounts (GDP
      annual + quarterly — the q/q signs the bands need), CPI, LFS,
      population incl. the Rosh Hashanah release, vital stats, causes
      of death, income distribution, trade."
    - "Bank of Israel beyond FX: the redesigned portal is a JS SPA;
      PublicApi is live only for GetExchangeRates (verified).
      GetInterestRates/GetCPI/GetMaccam are 404; several wrong paths
      return a Radware bot-challenge loader under HTTP 200 — another
      lying endpoint. Old BoI file URLs advertised on data.gov.il are
      dead (404): meshulav_luah_heb.xls (CPI composite), yaz0106.zip
      (daily FX history), pribmash/mashfix.xls (mortgage rates), and
      dataset 381 points at the retired www.bankisrael.gov.il/series
      catalogue. Policy rate + FX history + reserves need the BoI MSIB
      portal or hand curation from the monetary-committee pages."
    - "Ministry of Finance / Accountant General: agf.gov.il does not
      resolve (NXDOMAIN); no MoF organisation on data.gov.il; budgets.
      gov.il does not resolve. mof.gov.il resolves (gov.il MoF pages)
      but no machine-readable endpoint verified this pass. IMF WEO
      general-government balance/debt is the verified harmonised
      fallback; Israel's own D7 debt definition stays parked."
    - "OECD inequality (IDD/WISE): REST is live and the data-explorer
      reference is DSD_WISE_IDD@DF_IDD (agency OECD.WISE.INE); the exact
      flow version + key were not resolved this pass."
    - "CBS death-certificate homicide (the §4a second count) — blocked
      with all of CBS."
    - "PIBA/ASO asylum statistics (applications / decisions / persons
      present) — no dataset under population_authority on data.gov.il;
      ASO (Asylum Seekers Unit) publishes on gov.il, endpoint pending."
    - "Police crime file covers 2021–2025 only; earlier years not on
      data.gov.il this pass. Homicide as its own crime-type code needs
      the dictionary mapping (verified present in the dictionary
      resource)."
    - "TASE TA-35 index symbol: ^TA35.TA is 404 on Yahoo; ^TA125.TA
      verified instead and is the main index anyway. stooq is
      JS-walled from this machine (browser challenge under HTTP 200)."
    - "Italy's web ground (palette re-check at merge time — italy is
      queued, not in the tree)."

macro:
  gdp.csv:
    source: "CBS Israel — national accounts (blocked, see meta.pending)"
    official: true
    notes: >-
      PARKED at CBS. Harmonised fallbacks meanwhile: IMF WEO real GDP
      growth and WB GDP US$ (both verified below, official: false);
      never spliced with each other or with CBS.
  gdp_growth_imf.csv:
    source: "IMF DataMapper (WEO via datamapper API) — NGDP_RPCH"
    url: "https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/ISR"
    official: false
    refreshed_by: fetch/fetch_comparables.py   # to be written by the swarm
    notes: >-
      VERIFIED 2026-10-22. JSON {values:{<INDICATOR>:{<ISO3>:{year:
      value}}}}; the /ISR path segment does NOT filter — the response
      carries every country, filter client-side. Israel: 2008 +3.8,
      2009 -2.8, 2020 -1.9, 2023 +2.0, 2024 +1.7, 2025 +3.5, with WEO
      projections in the same object through 2031 — projections must
      live in their own columns. The 2009 negative year is what makes
      the 2008–09 band defensible on annual data; the war-period band
      still needs CBS q/q.
  cpi.csv:
    source: "CBS Israel — CPI (blocked); BoI composite index file 404"
    official: true
    notes: "PARKED (meta.pending). Magnitude sense from IMF PCPIP_IG (not yet pulled)."

markets:
  usdils.csv:
    source: "Bank of Israel — PublicApi representative exchange rates"
    url: "https://www.boi.org.il/currency.xml"   # 301 -> next line
    alt_url: "https://boi.org.il/PublicApi/GetExchangeRates"
    notes: >-
      VERIFIED 2026-10-22, live JSON: {exchangeRates:[{key:"USD",
      currentExchangeRate:3.107, currentChange, unit, lastUpdate}]},
      updated intraday (2026-10-22T12:22Z at capture). ILS per 1
      foreign unit; JPY carries unit=100 (rate is per 100 yen) — the
      fetcher must divide by unit. This is a SNAPSHOT of the
      representative rate, not history; the daily-history ZIP is dead
      (404), so the annual plate needs the BoI MSIB portal or WB
      PA.NUS.FCRF annual averages as stopgap. Direction on the plate:
      ILS per USD, a RISING line is a weaker sheqel.
  rates.csv:
    source: "Bank of Israel — policy rate (Monetary Committee decisions)"
    notes: >-
      PARKED: PublicApi has no rate endpoint and the portal is JS-only.
      cbs.gov.il is unreachable, so the plate runs hand-curated from
      committee announcements until BoI/MSIB is mapped. Unofficial
      stopgap: IMF WEO BCIFIS (not verified this pass).
  ta125.csv:
    source: "Tel Aviv Stock Exchange TA-125 close, redistributed by Yahoo Finance"
    url: "https://query1.finance.yahoo.com/v8/finance/chart/%5ETA125.TA?range=max&interval=1mo"
    official: false
    notes: >-
      VERIFIED 2026-10-22 (interval=1y is rejected; 1mo is the coarse
      valid stride and the fetcher derives year-ends from it). Max
      range back to 1992, 409 monthly closes. Year-end closes: 2006
      958.3, 2010 1203.8, 2015 1246.2, 2020 1624.1, 2024 2500.6, 2025
      3995.6 (the 2025 rise is the data saying it — record, do not
      editorialise). A market index: official:false, labelled on the
      plate. ^TA35.TA 404 — symbol parked.

fiscal:
  imf_gov.csv:
    source: "IMF DataMapper (WEO) — general-government gross debt and related"
    url: "https://www.imf.org/external/datamapper/api/v1/GG_DEBT_GDP/ISR"
    official: false
    notes: >-
      VERIFIED 2026-10-22. ISR gross debt %GDP: 2015 63.1, 2019 59.1,
      2020 71.1, 2022 60.5, 2023 61.5, 2024 67.8 (war spending — the
      data says it). Indicator ids found by scanning the indicator
      endpoint: GG_DEBT_GDP, NGDP_RDQ3, DEBT, PS_DEBT_GDP, NFPS_DEBT_
      GDP. Israel's own D7 public-debt definition (MoF/Accountant
      General) is a DIFFERENT definition and is parked; when it lands
      it gets its own column beside this one, never a splice.

social:
  labour_oecd.csv:
    source: "OECD SDMX REST — Israel LFS (OECD.SDD.TPS, DSD_LFS@DF_IALFS_*)"
    url: "https://sdmx.oecd.org/public/rest/data/OECD.SDD.TPS,DSD_LFS@DF_IALFS_INDIC,1.0/ISR........?lastNObservations=2"
    official: false
    notes: >-
      VERIFIED 2026-10-22, live: 1,059 series for ISR, generic
      SDMX-XML Series/Obs (ObsValue + ObsDimension), quarterly
      observations to 2026-Q2 and monthly to 2026-08 in one payload.
      Key quirk: nine key segments (ISR + eight empty dimensions,
      'ISR........'); response_format is NOT a valid parameter — use
      the Accept header or default XML; dimensionAtObservation
      accepts only DSD dimensions (REF_AREA, MEASURE, UNIT_MEASURE,
      TRANSFORMATION, ADJUSTMENT, SEX, AGE, ACTIVITY, FREQ,
      TIME_PERIOD). This is the harmonised layer beside the CBS LFS,
      which is parked. Survey-vs-administrative note kept for the
      plate: OECD here IS the LFS definition, not the NII register.
  income.csv:
    source: "CBS household survey (blocked); OECD IDD for the harmonised Gini"
    official: true
    notes: >-
      PARKED both sides this pass: CBS blocked; OECD IDD reference
      DSD_WISE_IDD@DF_IDD agency OECD.WISE.INE (data-explorer
      confirmed, flow version not resolved). Two definitions, two
      columns, per SOURCING §4.

migration:
  olim_flow.csv:
    source: "Ministry of Aliyah and Integration — new olim, open data"
    url: "https://data.gov.il/api/3/action/package_show?id=new-olim-by-years"
    notes: >-
      VERIFIED 2026-10-22, CKAN datastore live: person-level PUF with
      year_aliya, month_aliya, age, gender (Hebrew values זכר/נקבה),
      erez_moza (country of origin), yeshuv_klita (absorption
      settlement), machoz, mikzoa; rows through 2025-09. Sibling
      packages new-olim-by-month, new-olim-by-cities, and 1989–2015
      cuts (age, profession) exist. THIS is the Law-of-Return flow —
      olim are immigrants by the Law of Return (1950/1952), a legal
      category that is not an ordinary visa and must never be summed
      with work permits or asylum figures into one "immigration" line.
      Hebrew cell values stay UTF-8 in the CSV; map them to codes in
      the fetcher so plates can label in any language.
  permit_issuance.csv:
    source: "Population and Immigration Authority (PIBA) — visa/permit statistics"
    url: "https://data.gov.il/api/3/action/package_show?id=stats_rish"
    notes: >-
      VERIFIED 2026-10-22, CKAN datastore live: monthly issuance with
      Hebrew columns (שנת רישום, אשרה visa class, תת-אשרה subclass,
      מין, קבוצת גיל, ארץ דרכון passport country) and three count
      columns חדשים/הארכות/תיקונים — new permits vs extensions vs
      amendments. That split is §4a's permit-not-person trap in
      concrete form: only חדשים is a flow of first issuances. Rows
      from 2019 at least; stocks (permits in force) parked.
  asylum.csv:
    source: "PIBA / Asylum Seekers Unit"
    notes: "PARKED (meta.pending). Four numbers, never one line (§4a)."
  population.csv:
    source: "CBS Israel population register + Rosh Hashanah release (blocked)"
    official: true
    notes: >-
      PARKED at CBS; the Rosh Hashanah preliminary vs final register
      vintage trap is recorded for when it lands. Verified stopgap:
      WB SP.POP.TOTL (official:false) below.
    crosscheck_url: "https://api.worldbank.org/v2/country/ISR/indicator/SP.POP.TOTL?format=json"
    crosscheck: "VERIFIED 2026-10-22: 2023 9.849mn, 2024 10.0022mn, 2025 10.1228mn."

demography:
  births_deaths.csv:
    source: "CBS vital statistics (blocked)"
    official: true
    notes: "PARKED. WB SP.DYN.* indicators share the verified API pattern (indicator not pulled this pass)."
  causes.csv:
    source: "CBS causes of death, ICD-10 (blocked)"
    official: true
    notes: "PARKED with CBS."

security:
  crime_cases.csv:
    source: "Israel Police — crime records, open data"
    url: "https://data.gov.il/api/3/action/package_show?id=crime_records_data"
    notes: >-
      VERIFIED 2026-10-22, CKAN datastore live: one dictionary CSV of
      crime groups/types (StatisticCrimeGroupCode/Name,
      StatisticCrimeTypeCode/Name, CrimeName, SensitivityFlag) plus
      one CSV per year 2021–2025 of CASES by region × quarter × crime
      type. Counts are recorded-crime files, and only 2021–2025;
      the 2006–2020 half of the window is not there. Homicide lives in
      this taxonomy as a crime type — pull via the dictionary codes.
  homicide_cbs.csv:
    source: "CBS death certificates — assault deaths (blocked)"
    official: true
    notes: >-
      PARKED with CBS. The police count is place-of-occurrence and
      CBS's is residence-based; two columns when both land (§4a).

international:
  gdp_usd.csv:
    source: "World Bank WDI — NY.GDP.MKTP.CD (ISO3 ISR)"
    url: "https://api.worldbank.org/v2/country/ISR/indicator/NY.GDP.MKTP.CD?format=json"
    official: false
    notes: >-
      VERIFIED 2026-10-22, live JSON. Shape: JSON array [meta, [series
      objects]] — indicator/country objects plus date,value; value in
      current US$. Magnitudes: 2023 513.39bn, 2024 542.28bn, 2025
      610.78bn (the 2025 jump is partly the shekel's appreciation —
      cross-check against CBS ILS series before drawing). The brief's
      510-540bn band matches 2023-24. lastupdated 2026-10-08.
  gdp_pc.csv:
    source: "World Bank — NY.GDP.PCAP.CD"
    url: "https://api.worldbank.org/v2/country/ISR/indicator/NY.GDP.PCAP.CD?format=json"
    official: false
    notes: "Shape identical to gdp_usd. Same verified API pattern (indicator not individually pulled)."
  population.csv:
    source: "World Bank — SP.POP.TOTL"
    url: "https://api.worldbank.org/v2/country/ISR/indicator/SP.POP.TOTL?format=json"
    official: false
    notes: >-
      VERIFIED 2026-10-22. 2023 9.849mn, 2024 10.0022mn, 2025
      10.1228mn — Israel crossed 10mn in 2024, so the brief's
      9.8-10mn band is half a year stale. Cross-check only; the
      series of record is CBS's (parked).
  hdi.csv:
    source: "UNDP HDR 2025 — composite indices complete time series"
    url: "https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv"
    official: false
    notes: >-
      VERIFIED 2026-10-22 (2.0MB CSV, 200). ISR row: Israel, Very
      High human development, rank 27, HDI 0.90x in the recent years
      (row read at capture). One vintage throughout; HDR recomputes
      the whole back-series at each methodology change.
  imf_gov.csv: see fiscal/ — one entry, drawn from WEO.
  oecd_layer.csv:
    source: "OECD SDMX REST — agency OECD.SDD.TPS (Israel member)"
    url: "https://sdmx.oecd.org/public/rest/dataflow/OECD.SDD.TPS"
    official: false
    notes: >-
      VERIFIED 2026-10-22: the agency's dataflow list returns ~800KB
      of flow IDs (grep DSD_*@DF_* for names; Israel-specific flows
      exist, e.g. DSD_LFS@DF_IALFS_INDIC / _EMP / _LF). Base https://
      sdmx.oecd.org/public/rest; structure queries take NO query
      parameters. Migration stock (foreign-born) beside the olim
      register is the §4a citizenship-vs-birth cut to pull when the
      EMN/PIP flow version is resolved.
