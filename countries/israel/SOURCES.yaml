    official: false
    refreshed_by: fetch/fetch_harmonised.py
    notes: >-
      VERIFIED 2026-10-22, current vintage. GFCF 23.13 (2019),
      unemployment 3.60 (2024, ILO modelled), CPI inflation 4.41
      (2022) — the CPI line is WB's republication of the CBS index,
      so it shadows the parked macro/cpi.csv; when CBS returns the
      plate draws CBS as the line of record and keeps this beside it.
  gdp_growth.csv:
    source: "IMF DataMapper (WEO, October 2026 vintage) — NGDP_RPCH"
    url: "https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH"
    official: false
    refreshed_by: fetch/fetch_harmonised.py
    notes: >-
      VERIFIED again 2026-10-22 and the discovery note's spots were
      wrong: the endpoint now serves Israel 2008 +3.2, 2009 +1.2,
      2020 -1.9, 2023 +2.0, 2024 +1.7, 2025 +3.5 (projections to 2031
      cut, per house rule). The discovery pass recorded +3.8/-2.8 as
      Israel's 2008/2009; that pair is SUDAN's row — the
      client-side-filter trap (the /ISR segment does not filter)
      firing on the reader. World Bank national accounts (NY.GDP.MKTP
      .KD.ZG) independently say +3.2/+1.2. CONSEQUENCE: the 2008-09
