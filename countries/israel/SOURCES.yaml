# Data provenance — Israel. SKELETON (discovery pass, checkpoint 1).
#
# Written BEFORE any CSV, per SOURCING_A_COUNTRY.md §3. Every endpoint
# below is a lead and is marked UNVERIFIED until curl'd live with its
# payload shape recorded in DISCOVERY.md; verification passes amend this
# file in place and drop the markers. Nothing here is curated; no CSV
# exists yet.
#
# Retrieved: 2026-10-22 (discovery pass in progress).
#
# Israel is IN the international comparables layer (WB ISO3=ISR, IMF,
# UNDP, OECD membership), unlike Taiwan; the OECD API is a harmonised
# layer here the way Eurostat is for the EU countries.

