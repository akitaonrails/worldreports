      (36-10-0699 expenditure-based GDP, 18-10-0005 CPI annual average)
      are staged in macro/economy_statcan.csv as the national line, and
      the two are never spliced.
  growth_prices_from_wb.csv:
    source: 'World Bank — World Development Indicators (NY.GDP.MKTP.KD.ZG, FP.CPI.TOTL.ZG)'
    url: https://api.worldbank.org/v2/country/CAN/indicator/NY.GDP.MKTP.KD.ZG?format=json
    refreshed_by: fetch/fetch_spine.py
    official: false
  economy_from_wb.csv:
    source: 'World Bank — World Development Indicators (NE.GDI.FTOT.ZS, SL.UEM.TOTL.ZS)'
    url: 'https://api.worldbank.org/v2/country/CAN/indicator/NE.GDI.FTOT.ZS?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      gfcf_pct_gdp is whole-economy gross fixed capital formation, % of
      GDP (spending slot 3). unemployment_pct is the ILO modelled
      estimate, % of the labour force — harmonised, and not the national
      LFS headline, which stays the national line. Columns:
      gfcf_pct_gdp, unemployment_pct.
  economy_statcan.csv:
    source: 'Statistics Canada — GDP expenditure-based (36-10-0699), CPI annual average (18-10-0005), Labour Force Survey (14-10-0327)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610069901'
    refreshed_by: fetch/fetch_statcan.py (curated via fetch/_curate_statcan.py)
    notes: >-
      The national line beside the World Bank series in economy.csv and
      growth_prices.csv: real GDP growth at chained-FCE2017 percentage
      change, CPI inflation as the year-over-year change of the
      published 2002=100 annual-average index (a documented conversion),
      and the LFS unemployment rate for the population aged 15+ (not
      seasonally adjusted, the annual table). Never spliced into the
      harmonised line; the cross-checks in the sidecar entry below say
      how far apart they are.
  economy_from_statcan.csv:
    source: 'Statistics Canada — GDP expenditure-based (36-10-0699), CPI annual average (18-10-0005), Labour Force Survey (14-10-0327)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610069901'
    refreshed_by: fetch/fetch_statcan.py
    notes: >-
      As pulled, full history from each table's start: real growth,
      current-dollar GDP (the denominator the trade ratios divide by),
      the all-items CPI index level 2002=100 (the fetcher never derives
      the inflation rate; curation does), and the LFS unemployment rate.
      The cube's title, currency and CURRENT status are asserted against
      getCubeMetadata before any data is read, and the payload must be
      JSON or a real zip: StatCan served an outage page under HTTP 200
      on 2026-10-22.

trade:
  trade.csv:
    source: 'World Bank — World Development Indicators (NE.EXP.GNFS.ZS, NE.IMP.GNFS.ZS)'
    url: https://api.worldbank.org/v2/country/CAN/indicator/NE.EXP.GNFS.ZS?format=json
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Exports and imports of
      goods AND services, national-accounts basis, % of GDP — the
      spine's trade slot 1; the balance drawn in slot 2 is their
      difference and is not stored. Statistics Canada's own
      national-accounts line is staged in trade/trade_statcan.csv; the
      customs candidate (12-10-0011) was verified and rejected — goods
      only, different quantity.
  partners.csv:
    source: 'IMF — International Trade in Goods (IMTS), flow IMTS, series CAN.XG_FOB_USD+TBG_USD'
    url: https://api.imf.org/external/sdmx/2.1/data/IMF.STA,IMTS/CAN.XG_FOB_USD+TBG_USD..A?startPeriod=2005
    refreshed_by: fetch/fetch_spine.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Goods exports (FOB) by
      partner and goods balances, current US$ as units, not millions.
      Partners ranked once, on the last full year's exports, among
      single countries; the rest of the world only in the world column.
      Goods only — slot 1 above is goods and services.
  partners_from_imf.csv:
    source: 'IMF — International Trade in Goods (IMTS), flow IMTS, series CAN.XG_FOB_USD+TBG_USD'
    url: https://api.imf.org/external/sdmx/2.1/data/IMF.STA,IMTS/CAN.XG_FOB_USD+TBG_USD..A?startPeriod=2005
    refreshed_by: fetch/fetch_spine.py
    official: false
    notes: >-
      The fetcher takes the six largest partners on the last full year
      and requires the world aggregate to be in the payload before
      writing; regional aggregate codes (G001 and friends) are the world
      total, not a partner row.
  trade_from_wb.csv:
    source: 'World Bank — World Development Indicators (NE.EXP.GNFS.ZS, NE.IMP.GNFS.ZS)'
    url: 'https://api.worldbank.org/v2/country/CAN/indicator/NE.EXP.GNFS.ZS?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Exports and imports of goods AND services, national-accounts
      basis, % of GDP — not a customs goods series. The trade balance is
      their difference and is not stored. Columns: exports_pct_gdp,
      imports_pct_gdp.
  trade_statcan.csv:
    source: 'Statistics Canada — GDP expenditure-based, Canada, annual (36-10-0699): current-dollar exports/imports of goods and services over current-dollar GDP'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610069901'
    refreshed_by: fetch/fetch_statcan.py (curated via fetch/_curate_statcan.py)
    notes: >-
      The national line for trade slots 1-2, same definition as the
      World Bank file beside it (goods and services, national accounts)
      and the same numbers before redistribution rounding — the WB
      series is Statistics Canada's own outturn re-presented. The
      candidate customs table (12-10-0011) was dropped on verification:
      customs-basis goods only, not the quantity this slot measures.
      The balance is the difference and is not stored.
  trade_from_statcan.csv:
    source: 'Statistics Canada — GDP expenditure-based, Canada, annual (36-10-0699)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3610069901'
    refreshed_by: fetch/fetch_statcan.py
    notes: >-
      Published current-dollar millions (millions of CAD, "Less:
      imports" stored positive as the imports line) plus the % of GDP
      ratios the fetcher computes from the same cube and vintage in one
      pass, so the ratio can never mix two vintages.
