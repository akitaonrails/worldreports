  population_from_statcan.csv:
    source: 'Statistics Canada — Population estimates, quarterly (17-10-0009, CANSIM 051-0005)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710000901'
    refreshed_by: fetch/fetch_statcan.py
    notes: >-
      The July reference rows of the quarterly series, 1961 on (the
      quarterly table carries 1946 on; the atlas window starts later).
      2026 is the latest published estimate, labelled as the running
      year's point, not a year's result.
  components_statcan.csv:
    source: 'Statistics Canada — Estimates of the components of demographic growth, annual (17-10-0008, CANSIM 051-0004)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710000801'
