# Data provenance — every series for Canada
#
# The curated CSVs are what the plates draw. The `_from_*` sidecars are
# what the fetchers last pulled, kept beside them for the next diff; no
# plate may read one. Each sidecar entry below sits under the curated
# file it feeds.
#
# Retrieved/compiled: 2026-10-22. Curated: 2026-10-22 (visual diff
# against the spot values in HANDOFF.md; blanks carried over as blanks).

markets:
  rates.csv:
    source: Bank of Canada — Valet (STATIC_ATABLE_V39079, V122514, BD.CDN.*.DQ.YLD)
    url: https://www.bankofcanada.ca/valet/observations/STATIC_ATABLE_V39079/json
    refreshed_by: fetch/fetch_bankofcanada.py
    notes: >-
      Curated from the sidecar below, unchanged. Target for the overnight
      rate (year-end and annual average) from the monthly static table,
      the realised overnight average, and Government of Canada benchmark
      bond yields. See the sidecar entry for why the static table and not
      V39079.
  rates_from_boc.csv:
    source: Bank of Canada — Valet (STATIC_ATABLE_V39079, V122514, BD.CDN.*.DQ.YLD)
    url: https://www.bankofcanada.ca/valet/observations/STATIC_ATABLE_V39079/json
    refreshed_by: fetch/fetch_bankofcanada.py
    notes: >-
      target_rate_eoy / target_rate_avg: the target for the overnight
      rate, taken from the monthly static table rather than from V39079,
      the business-daily series, which Valet carries only from April
      2009 — a plate drawn from V39079 opens at 0.25% with the whole
      2008 easing missing in front of it. overnight_avg is the realised
      rate, which is the one that moved first in March 2020 and is not
      the same series as the target. Yields are the Government of Canada
      benchmark bonds, annual mean of the daily series.
  usdcad.csv:
    source: Bank of Canada — USD noon rate (IEXE0101) and USD daily rate (FXUSDCAD)
    url: https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json
    refreshed_by: fetch/fetch_bankofcanada.py
    notes: >-
      Curated from the sidecar below, unchanged: two columns kept as two
      columns, partial-coverage years blank with their coverage in the
      *_months columns, 2006-07 empty pending Statistics Canada
      33-10-0163. CAD per USD — a rising line is a weaker dollar.
  usdcad_from_boc.csv:
    source: Bank of Canada — USD noon rate (IEXE0101) and USD daily rate (FXUSDCAD)
    url: https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json
    refreshed_by: fetch/fetch_bankofcanada.py
    notes: >-
      TWO COLUMNS, NEVER ONE. The Bank retired the noon rate on
      2017-03-01 and replaced it with a single indicative rate published
      at 16:30, computed differently. January to April 2017 is published
      on both, which is what makes the break measurable rather than
      asserted. The noon series also begins in May 2007 and ends in
      April 2017, so 2007 and 2017 are eight- and four-month windows:
      both are left blank and the `*_months` columns carry the coverage,
      because either one presented as an annual average lands inside the
      plausible range for the dollar and nothing downstream would catch
      it. 2006 and 2007 need Statistics Canada's annual average
      (33-10-0163) instead. Direction: CAD per USD, so a RISING line is
      a weaker Canadian dollar.
  usdcad_h10.csv:
    source: Federal Reserve — H.10 daily foreign exchange rates, Canada (noon buying rate in New York)
    url: https://www.federalreserve.gov/releases/h10/hist/dat00_ca.htm
    refreshed_by: fetch/fetch_spine.py
    notes: >-
      Curated from the sidecar below, unchanged. The annual mean of the
      daily noon buying rate, C$ per US$, with days and months saying
      how much of each year is in it. It is the only exchange-rate
      series that covers 2006-07, where the Bank of Canada's noon file
      begins only in May 2007, so it is the base of the spine's currency
      index — the Bank's own noon and daily series ride on top of it,
      each indexed to the H.10 2006 average, and are never joined to it
      or to each other.
  usdcad_from_fed.csv:
    source: Federal Reserve — H.10 daily foreign exchange rates, Canada (noon buying rate in New York)
    url: https://www.federalreserve.gov/releases/h10/hist/dat00_ca.htm
    refreshed_by: fetch/fetch_spine.py
    notes: >-
      Averaged from the daily rows by year and by month; the coverage
      columns say what each annual figure is built from. A U.S. Federal
      Reserve redistribution of Canadian-market quotes, not a Bank of
      Canada publication.
  equities.csv:
    source: Yahoo Finance — S&P/TSX composite (^GSPTSE) and S&P 500 (^GSPC), monthly closes
    url: https://query1.finance.yahoo.com/v8/finance/chart/^GSPTSE
    refreshed_by: fetch/fetch_spine.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. NOT AN OFFICIAL
      STATISTIC: no official body publishes an equity index, so this is
      a redistributor feed flagged on the plate. Annual mean of the
      month-end closes, the running month left out; the TSX is converted
      to US$ each month at that month's H.10 average before averaging,
      which is why 2014-15 shows the oil price in it.
  equities_from_yahoo.csv:
    source: Yahoo Finance — S&P/TSX composite (^GSPTSE) and S&P 500 (^GSPC), monthly closes
    url: https://query1.finance.yahoo.com/v8/finance/chart/^GSPTSE
    refreshed_by: fetch/fetch_spine.py
    official: false
    notes: >-
      Monthly closes as pulled, with the month count per year. A
      redistributor: a revision at Yahoo would move a plate, which is
      why the curated file is what is drawn and this sidecar is what is
      diffed.

fiscal:
  transactions_pct_gdp.csv:
    source: Department of Finance Canada — Fiscal Reference Tables, November 2025, table 2
    url: https://www.canada.ca/content/dam/fin/publications/frt-trf/2025/frt-trf-25-eng.xlsx
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Curated from the sidecar below, unchanged. Federal government,
      fiscal years (fiscal_year is the starting year). The actuarial
      split columns are empty before 2008-09 by construction; see the
      sidecar entry.
  transactions_pct_gdp_from_frt.csv:
    source: Department of Finance Canada — Fiscal Reference Tables, November 2025, table 2
    url: https://www.canada.ca/content/dam/fin/publications/frt-trf/2025/frt-trf-25-eng.xlsx
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      FEDERAL government, FISCAL years. `fiscal_year` holds the starting
      year: 2024 is 1 April 2024 to 31 March 2025. Never plotted against
      a calendar series without saying so. balance_excl_actuarial and
      net_actuarial_losses are empty before 2008-09 and that is correct,
      not missing data: net actuarial losses became a separate expense
      line in 2019-20 with only 2008-09 onward reclassified, so the
      split does not exist for earlier years and must not be
      back-filled from the undivided balance.
  revenues_pct_gdp.csv:
    source: Department of Finance Canada — Fiscal Reference Tables, November 2025, table 4
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Curated from the sidecar below, unchanged. Federal revenue by
      source, % of GDP, fiscal years; pollution-pricing proceeds omitted
      (see the sidecar entry).
  revenues_pct_gdp_from_frt.csv:
    source: Department of Finance Canada — Fiscal Reference Tables, November 2025, table 4
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Federal revenue by source, per cent of GDP, fiscal years. The
      pollution-pricing column is omitted: the proceeds are returned to
      Canadians and appear as both a revenue and an expense, so
      including it in a revenue panel overstates the take by its own
      size. The federal carbon levy was removed on 1 April 2025, which
      ends the series rather than zeroing it.
  expenses_pct_gdp.csv:
    source: Department of Finance Canada — Fiscal Reference Tables, November 2025, table 8
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Curated from the sidecar below, unchanged. Federal expense by
      category, % of GDP, fiscal years; the 2020-21 pandemic spike is
      real (see the sidecar entry).
  expenses_pct_gdp_from_frt.csv:
    source: Department of Finance Canada — Fiscal Reference Tables, November 2025, table 8
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Federal expense by category, per cent of GDP, fiscal years. The
      2020-21 figure of 27.4% for program expenses is real: it is the
      pandemic benefits, and it is the largest single-year federal
      spending in Canadian peacetime.
  liabilities.csv:
    source: Department of Finance Canada — Fiscal Reference Tables, November 2025, table 15
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Curated from the sidecar below; only the float formatting was
      cleaned (the sidecar wrote e-notation), the numbers are unchanged.
      Millions of current dollars, fiscal years, federal only.
  liabilities_from_frt.csv:
    source: Department of Finance Canada — Fiscal Reference Tables, November 2025, table 15
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Millions of current dollars, fiscal years, FEDERAL only. The
      accumulated deficit is what Canadian budget documents call "the
      federal debt"; net_debt subtracts financial assets from total
      liabilities and is a different quantity again. Neither is the
      general-government debt in international/, and the three are
      routinely quoted as though they were one number.
  general_government.csv:
    source: 'IMF — World Economic Outlook and Fiscal Monitor, via DataMapper'
    url: https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. The canonical fiscal
      slot: GENERAL government (federal, provincial, territorial, local
      and the CPP/QPP), CALENDAR years, % of GDP — comparable across the
      atlas, and not the federal fiscal-year books in the FRT files.
      Same IMF numbers Finance Canada reprints in
      international/g7_*.csv, taken straight from the IMF.
  general_government_from_imf.csv:
    source: 'IMF — World Economic Outlook and Fiscal Monitor, via DataMapper (GGR_G01_GDP_PT (Fiscal Monitor), G_X_G01_GDP_PT (Fiscal Monitor), GGXCNL_NGDP (WEO), GGXONLB_G01_GDP_PT (Fiscal Monitor), GGXWDG_NGDP (WEO))'
    url: 'https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      General government, % of GDP, calendar years. Balance and gross
      debt are WEO indicators; revenue, expenditure and the primary
      balance are not WEO codes on DataMapper (GGR_NGDP, GGX_NGDP and
      GGXONLB_NGDP do not exist there) and come from the Fiscal Monitor,
      served from the same database — the fetcher checks the WEO and
      Fiscal Monitor balances agree within 0.1 pt before writing. Stops
      at 2025: later IMF years are staff projections. 2025 itself may be
      an IMF estimate. Columns: revenue_pct_gdp, expenditure_pct_gdp,
      balance_pct_gdp, primary_balance_pct_gdp, gross_debt_pct_gdp. The
      same IMF numbers that Finance Canada reprints in
      international/g7_*.csv, taken straight from the IMF.
  public_investment.csv:
    source: 'OECD — National Accounts at a Glance, chapter 6, measure P51GS13'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI,/A.CAN.P51GS13...'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. General-government
      gross fixed capital formation, % of GDP (spending slot 4).
  public_investment_from_oecd.csv:
    source: 'OECD — National Accounts at a Glance, chapter 6, OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI, measure P51GS13'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI,/A.CAN.P51GS13...'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      gov_gfcf_pct_gdp: general-government gross fixed capital
      formation, % of GDP (spending slot 4).
  cofog.csv:
    source: 'IMF — Government Finance Statistics, expenditure by function (COFOG), flow GFS_COFOG, series CAN.S13....A'
    url: 'https://api.imf.org/external/sdmx/2.1/data/IMF.STA,GFS_COFOG/CAN.S13....A?startPeriod=2005'
    refreshed_by: fetch/fetch_spine.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. General-government
      (S13) outlays by the ten COFOG divisions, % of GDP, calendar
      years. 2008 onward only: earlier years are not in the IMF table.
      The total is total outlays as COFOG measures them, 2–4 points of
      GDP below the Fiscal Monitor expenditure line on the fiscal plate.
  cofog_from_imf.csv:
    source: 'IMF — Government Finance Statistics, expenditure by function (COFOG), flow GFS_COFOG, series CAN.S13....A'
    url: 'https://api.imf.org/external/sdmx/2.1/data/IMF.STA,GFS_COFOG/CAN.S13....A?startPeriod=2005'
    refreshed_by: fetch/fetch_spine.py
    official: false
    notes: >-
      The fetcher requires the ten divisions to add up to the published
      total within 0.1 point before writing, per year. Statistics
      Canada's own functional classification is the national line,
      pending.
  gfs_operations.csv:
    source: 'IMF — Government Finance Statistics, statement of operations, flow GFS_SOO, series CAN.S13....A'
    url: 'https://api.imf.org/external/sdmx/2.1/data/IMF.STA,GFS_SOO/CAN.S13....A?startPeriod=2005'
    refreshed_by: fetch/fetch_spine.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. interest_payable is GFS
      item 24, general government, % of GDP — the canonical fiscal slot
      4 series. revenue / expenditure / net_lending are kept as a
      cross-check on general_government.csv (same IMF database, a later
      vintage).
  gfs_operations_from_imf.csv:
    source: 'IMF — Government Finance Statistics, statement of operations, flow GFS_SOO, series CAN.S13....A'
    url: 'https://api.imf.org/external/sdmx/2.1/data/IMF.STA,GFS_SOO/CAN.S13....A?startPeriod=2005'
    refreshed_by: fetch/fetch_spine.py
    official: false

international:
  g7_balance.csv:
    source: IMF, redistributed by the Department of Finance Canada — Fiscal Reference Tables, table 53
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Curated from the sidecar below, unchanged. GENERAL government on
      the national-accounts basis, CALENDAR years — comparable across the
      G7, incomparable with everything in fiscal/.
  g7_balance_from_frt.csv:
    source: IMF, redistributed by the Department of Finance Canada — Fiscal Reference Tables, table 53
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      GENERAL government — federal, provincial, territorial, local and
      the CPP/QPP — on the national-accounts basis, CALENDAR years,
      which is what makes it comparable across the G7 and incomparable
      with everything in fiscal/. The IMF computes it; Finance Canada
      only reprints it.
  g7_net_debt.csv:
    source: IMF, via Fiscal Reference Tables 2025, table 54
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Curated from the sidecar below, unchanged. Net of CPP/QPP assets;
      drawn beside the gross series, never alone.
  g7_net_debt_from_frt.csv:
    source: IMF, via Fiscal Reference Tables 2025, table 54
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Canada's net debt reads about 12% of GDP against a G7 average near
      93%, and the gap is not an achievement: the net measure nets off
      the assets of the Canada and Quebec Pension Plans, which most G7
      members do not hold in the same form. It is drawn beside the gross
      series, never alone.
  g7_gross_debt.csv:
    source: IMF, via Fiscal Reference Tables 2025, table 55
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      Curated from the sidecar below, unchanged. The same countries on
      the gross measure; the pair with the net file is the point.
  g7_gross_debt_from_frt.csv:
    source: IMF, via Fiscal Reference Tables 2025, table 55
    refreshed_by: fetch/fetch_frt.py
    notes: >-
      The same countries on the gross measure, where Canada reads about
      111% of GDP. Both are correct; the pair is the point.
  gdp_usd.csv:
    source: World Bank — World Development Indicators, NY.GDP.MKTP.CD
    url: https://api.worldbank.org/v2/country/CAN/indicator/NY.GDP.MKTP.CD
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. A harmonised
      cross-country series, not Canada's own national accounts.
  gdp_usd_from_wb.csv:
    source: World Bank — World Development Indicators, NY.GDP.MKTP.CD
    url: https://api.worldbank.org/v2/country/CAN/indicator/NY.GDP.MKTP.CD
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      A harmonised cross-country series, not Canada's own national
      accounts. Kept as the comparables layer and as a magnitude check
      on the Statistics Canada figure; the two are not spliced.
  gdp_pc.csv:
    source: World Bank — NY.GDP.PCAP.CD
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Current US$ per person,
      harmonised across countries.
  gdp_pc_from_wb.csv:
    source: World Bank — NY.GDP.PCAP.CD
    refreshed_by: fetch/fetch_comparables.py
    official: false
  population.csv:
    source: World Bank — SP.POP.TOTL
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Cross-check only: the
      population series of record is Statistics Canada's quarterly
      demographic estimate, the only one that separates non-permanent
      residents.
  population_from_wb.csv:
    source: World Bank — SP.POP.TOTL
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      The curated population series is Statistics Canada's quarterly
      demographic estimate, which is the only one that separates
      non-permanent residents. This is the cross-check.
  reserves.csv:
    source: World Bank — FI.RES.TOTL.CD (IMF IFS)
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Total reserves including
      gold, current US$, year-end.
  reserves_from_wb.csv:
    source: World Bank — FI.RES.TOTL.CD (IMF IFS)
    refreshed_by: fetch/fetch_comparables.py
    official: false
  openness.csv:
    source: World Bank — NE.TRD.GNFS.ZS
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Exports plus imports of
      goods and services as a share of GDP.
  openness_from_wb.csv:
    source: World Bank — NE.TRD.GNFS.ZS
    refreshed_by: fetch/fetch_comparables.py
    official: false
  hdi.csv:
    source: UNDP — Human Development Report 2025, composite indices complete time series
    url: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. One vintage throughout;
      the HDR recomputes the whole back-series at each methodology
      change, so a trend assembled from successive reports is partly an
      artefact of the reports.
  hdi_from_undp.csv:
    source: UNDP — Human Development Report 2025, composite indices complete time series
    url: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      One file, one vintage, every year. The HDI is recomputed for the
      whole back-series at each methodology change, so a trend assembled
      from successive annual reports is partly an artefact of the
      reports.
  cpi.csv:
    source: Transparency International — Corruption Perceptions Index, 2025 edition results and trends
    url: https://images.transparencycdn.org/images/CPI2025-Results-and-trends.xlsx
    refreshed_by: fetch/fetch_spine.py
    notes: >-
      Curated from the sidecar below, unchanged. The world slot 3 score:
      0–100 on the method introduced in 2012. Earlier scores are 0–10
      and are not in TI's own time series, so nothing is rescaled and
      stitched: the series simply begins in 2012.
  cpi_from_ti.csv:
    source: Transparency International — Corruption Perceptions Index, 2025 edition results and trends
    url: https://images.transparencycdn.org/images/CPI2025-Results-and-trends.xlsx
    refreshed_by: fetch/fetch_spine.py
    notes: >-
      Read from the results-and-trends workbook, the whole time series
      of one edition so the vintage never changes under the plate. The
      workbook carries defined names openpyxl cannot locate, so the
      fetcher reads the sheet XML directly and shape-checks before
      caching.

social:
  gini.csv:
    source: World Bank — SI.POV.GINI
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Derived from the
      Canadian Income Survey under the World Bank's own income
      definition; it lands in a different place from Statistics Canada's
      own Gini and the two are not two readings of one quantity.
  gini_from_wb.csv:
    source: World Bank — SI.POV.GINI
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      The World Bank's harmonised Gini for Canada is derived from the
      Canadian Income Survey through its own income definition and lands
      in a different place from Statistics Canada's own figure. They are
      not two readings of one quantity.
  demography.csv:
    source: 'World Bank — World Development Indicators (SP.DYN.TFRT.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN, SM.POP.NETM), from the UN World Population Prospects and national vital statistics'
    url: https://api.worldbank.org/v2/country/CAN/indicator/SP.DYN.TFRT.IN?format=json
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Total fertility rate,
      crude birth and death rates (per 1,000), and net migration as a
      COUNT — per-1,000 rates divide by the population of the same year.
      Statistics Canada's own rates and components of growth are staged
      in social/demography_statcan.csv and social/components_statcan.csv
      as the national line.
  demography_from_wb.csv:
    source: 'World Bank — World Development Indicators (SP.POP.TOTL.FE.IN, SP.DYN.TFRT.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN, SM.POP.NETM), from the UN World Population Prospects and national vital statistics'
    url: 'https://api.worldbank.org/v2/country/CAN/indicator/SP.POP.TOTL.FE.IN?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Mid-year population (total and female), so a rate per 100,000
      women can be computed on a mid-year denominator. Crude birth and
      death rates are per 1,000 people. net_migration is a COUNT of
      people (WPP estimate), not a rate: per 1,000 = net_migration /
      population x 1,000 for the same year. WPP figures for recent years
      are estimates and are revised with each WPP. Columns:
      population_female, fertility, birth_rate_per_1000,
      death_rate_per_1000, net_migration.
  poverty.csv:
    source: 'World Bank — Poverty and Inequality Platform, SI.POV.UMIC'
    url: https://api.worldbank.org/v2/country/CAN/indicator/SI.POV.UMIC?format=json
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Share of people below
      US$8.30 a day (2021 PPP), survey years only — the gaps are years
      without a survey, not zeros. Canada's official line is the Market
      Basket Measure, staged in social/poverty_statcan.csv with each MBM
      base as its own column; the two are different measures and never
      one line.
  poverty_from_wb.csv:
    source: 'World Bank — Poverty and Inequality Platform, SI.POV.UMIC'
    url: 'https://api.worldbank.org/v2/country/CAN/indicator/SI.POV.UMIC?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      poverty_830_pct: share of people below US$8.30 a day, 2021 PPP.
      Survey years only; the gaps are years without a survey, not zeros.
      The cross-country line beside the national poverty definition,
      never spliced into it.
  security.csv:
    source: 'World Bank — World Development Indicators: VC.IHR.PSRC.P5 (UNODC), SH.STA.SUIC.P5 and SH.STA.TRAF.P5 (WHO Global Health Estimates)'
    url: https://api.worldbank.org/v2/country/CAN/indicator/VC.IHR.PSRC.P5?format=json
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. All per 100,000. The
      spine's canonical security series; the national police-reported
      homicide is staged in social/security_from_statcan.csv (cube
