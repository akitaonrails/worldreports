migration:
  pr_admissions.csv:
    source: IRCC — Permanent Residents, monthly open-data release
    url: https://www.ircc.canada.ca/opendata-donneesouvertes/data/ODP-PR-Citz.csv
    refreshed_by: fetch/fetch_ircc.py
    notes: >-
      Curated from the sidecar below, unchanged. Permanent-resident
      admissions per calendar year; rounded to fives by IRCC and the
      series begins in 2015, so 2006-2014 are blank (see the sidecar
      entry).
  pr_admissions_from_ircc.csv:
    source: IRCC — Permanent Residents, monthly open-data release
    url: https://www.ircc.canada.ca/opendata-donneesouvertes/data/ODP-PR-Citz.csv
    refreshed_by: fetch/fetch_ircc.py
    notes: >-
      ROUNDED. Every cell in the source is a multiple of five — all
      19,503 of them, with no exceptions — and IRCC labels the files
      "not for calculations". Nationally it hardly matters: 2024 sums to
      482,960 against IRCC's published 483,390, 0.02% apart. For a small
      country of citizenship it matters completely, because a cell
      holding two people is published as zero or as five. The file is
      tab-separated despite its extension and BEGINS IN 2015, so the
      2006–2014 half of this atlas's window is not in it.
  pr_by_origin.csv:
    source: IRCC — Permanent Residents by country of citizenship
    refreshed_by: fetch/fetch_ircc.py
    notes: >-
      Curated from the sidecar below, unchanged. The ten largest
      countries of citizenship over the whole file, ranked once.
  pr_by_origin_from_ircc.csv:
    source: IRCC — Permanent Residents by country of citizenship
    refreshed_by: fetch/fetch_ircc.py
    notes: >-
      The ten largest sources over the whole file, ranked once rather
      than per year, so the composition does not reshuffle under the
      reader. Every column is far above the rounding floor. Country of
      CITIZENSHIP, not of birth or of last residence; the three give
      different answers and are regularly quoted as one.
  study_permits.csv:
    source: IRCC — Temporary Residents, study permit holders
    refreshed_by: fetch/fetch_ircc.py
    notes: >-
      Curated from the sidecar below, unchanged. A FLOW — permits signed
      in the period — not the stock of students present, which is
      Statistics Canada's non-permanent-resident estimate.
  study_permits_from_ircc.csv:
    source: IRCC — Temporary Residents, study permit holders
    refreshed_by: fetch/fetch_ircc.py
    notes: >-
      Permit holders with a permit signed in the period, which is a
      FLOW. It is not the stock of students present in Canada, and the
      two differ by more than a factor of two because a study permit
      runs for several years. The stock belongs to Statistics Canada's
      non-permanent-resident estimate.

credit:
  household_credit.csv:
    source: BIS — total credit statistics, WS_TC Q.CA.H.A.M.770.A
    url: https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/Q.CA.H.A.M.770.A?format=csv
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Credit to households and
      NPISHs from all lenders, % of GDP; hh_credit_pct_gdp_q4 is the
      year-end quarter the spine draws. The BIS series is wider than any
      bank-loan series and adjusted for breaks; Statistics Canada's
      credit market debt to disposable income ratio is the national
      line, staged in credit/household_credit_statcan.csv — a different
      denominator, so two labelled lines, never one.
  debt_service.csv:
    source: BIS — debt service ratios, WS_DSR Q.CA.H
    url: https://stats.bis.org/api/v2/data/dataflow/BIS/WS_DSR/1.0/Q.CA.H?format=csv
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Households' interest
      plus amortisation as % of household disposable income (the credit
      lens slot). A BIS estimate built on an assumed average maturity;
      see the sidecar entry.
  mortgage_rates.csv:
    source: Bank of Canada — Valet (V80691335; V122667775/V12266781 and V122667724/V122667730, funds advanced)
    url: https://www.bankofcanada.ca/valet/observations/V80691335/json
    refreshed_by: fetch/fetch_spine.py
    notes: >-
      Curated from the sidecar below, unchanged. The 5-year rate the
      major banks post (annual mean of the weekly series — few borrowers
      pay it) beside the rate actually charged on new residential
      mortgages, insured and uninsured, weighted by the funds advanced
      (monthly, from 2013; the *_months column says the coverage).
  mortgage_rates_from_boc.csv:
    source: Bank of Canada — Valet (V80691335; V122667775/V12266781 and V122667724/V122667730, funds advanced)
    url: https://www.bankofcanada.ca/valet/observations/V80691335/json
    refreshed_by: fetch/fetch_spine.py
    notes: >-
      The posted rate is what the banks advertise; the new-mortgage rate
      is what borrowers sign, computed from the insured (V82) and
      uninsured (V81) rates weighted by the funds advanced (V122667724
      and V122667730). Quoting the posted rate as "the mortgage rate"
      under-states what was paid through 2020-21 by well over a point.
  npl.csv:
    source: World Bank — WDI FB.AST.NPER.ZS (IMF Financial Soundness Indicators)
    url: https://api.worldbank.org/v2/country/CAN/indicator/FB.AST.NPER.ZS?format=json
    refreshed_by: fetch/fetch_spine.py
    official: false
    notes: >-
      Curated from the sidecar below, unchanged. Bank non-performing
      loans as % of gross loans, IMF FSI via the World Bank. The
      definition is the IMF's, not a national one — the panel's legend
      says so.
  npl_from_wb.csv:
    source: World Bank — WDI FB.AST.NPER.ZS (IMF Financial Soundness Indicators)
    url: https://api.worldbank.org/v2/country/CAN/indicator/FB.AST.NPER.ZS?format=json
    refreshed_by: fetch/fetch_spine.py
    official: false
  debt_service_from_bis.csv:
    source: 'BIS — debt service ratios, WS_DSR Q.CA.H'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_DSR/1.0/Q.CA.H?format=csv'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Interest plus amortisation on household debt as % of household
      disposable income. A BIS estimate built on an assumed average
      maturity and the aggregate lending rate. Q4 value, quarter mean
      and the number of quarters, as in the credit file.
  household_credit_statcan.csv:
    source: 'Statistics Canada — Financial indicators of households and NPISHs, national balance sheet accounts (38-10-0235, CANSIM 378-0123)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3810023501'
    refreshed_by: fetch/fetch_statcan.py (curated via fetch/_curate_statcan.py)
    notes: >-
      Credit market debt to DISPOSABLE INCOME (a ratio near 170, not a
      per cent of GDP near 100 — different denominators, both correct).
      Seasonally adjusted quarterly stock; Q4 is the year-end value, the
      quarter mean and count ride beside it as elsewhere in credit/.
  household_credit_from_statcan.csv:
    source: 'Statistics Canada — Financial indicators of households and NPISHs, national balance sheet accounts (38-10-0235, CANSIM 378-0123)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3810023501'
    refreshed_by: fetch/fetch_statcan.py
    notes: >-
      Households and NPISHs series as pulled, 1990 on, annualised by the
      house convention (Q4, quarter mean, quarter count). The candidate
      36-10-0639 was verified and dropped: it holds credit liabilities
      in dollars, not the ratio.
  debt_service_statcan.csv:
    source: 'Statistics Canada — Debt service indicators of households, national balance sheet accounts (11-10-0065)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1110006501'
    refreshed_by: fetch/fetch_statcan.py (curated via fetch/_curate_statcan.py)
    notes: >-
      What households actually paid: debt service ratio (interest plus
      obligated principal) as % of disposable income, seasonally
      adjusted at annual rates, plus the mortgage split. It runs about
      1.2 points above the BIS modelled ratio because it measures
      payments, not an assumed-maturity model — two lines, never one.
  debt_service_from_statcan.csv:
    source: 'Statistics Canada — Debt service indicators of households, national balance sheet accounts (11-10-0065)'
    url: 'https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1110006501'
    refreshed_by: fetch/fetch_statcan.py
    notes: >-
      Seasonally adjusted at annual rates only; the unadjusted column of
      the cube is deliberately not pulled, so the sidecar cannot be
      mis-spliced across the two adjustments.
  household_credit_from_bis.csv:
    source: 'BIS — total credit statistics, WS_TC Q.CA.H.A.M.770.A'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/Q.CA.H.A.M.770.A?format=csv'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Credit to households and NPISHs from all sectors, market value, %
      of GDP, adjusted for breaks. hh_credit_pct_gdp_q4 is the Q4 (year-
      end) value the spine draws; _qavg is the mean of the quarters
      published and _quarters says how many, so the running year reads
      as one quarter, not a year. Wider than bank-loan series: every
      lender and debt securities are in it.

