migration:
  stocks_flows.csv:
    source: UNVERIFIED - NIA business-statistics section (foreign residents); MOL labour-statistics network (foreign worker permits)
    url: https://www.immigration.gov.tw/5385/7344/7350/ (200, files JS-rendered) and https://www.mol.gov.tw/1607/71771/ (labor statistics network) - both PENDING
    notes: >-
      PENDING with reason: the portals are reachable but no keyless
      file endpoint found from this machine today. §4a discipline
      stands: foreign RESIDENTS (stock, alien-resident-card
      registrations, largely Southeast Asian workers) vs foreign WORKER
      permits (a permit is not a person, MOOL/MOL counts) vs
      new-resident flows; emigration is weakly measured - publish the
      stock and the flow that exists, name the unmeasured, never print
      a net line.
