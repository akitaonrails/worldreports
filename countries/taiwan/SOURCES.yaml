  labour.csv:
    source: UNVERIFIED — DGBAS labour force survey, human-resources survey; monthly wages verified on DPAS A046301010
    url: https://manpower.dgbas.gov.tw/dgbas_community/ (LFS dedicated portal — pending shape) / https://nstatdb.dgbas.gov.tw/dgbasAll/webMain.aspx?sys=100&funid=qryout&funid2=A046301010 (verified table page, monthly wage series)
    verified: 2026-10-23 (wage table page; LFS portal pending)
    notes: >-
      No OECD membership (verify — Taiwan is not an OECD member); national
      LFS is the spine. Employment rate, unemployment rate, sector shares.
  income_inequality.csv:
    source: UNVERIFIED — DGBAS family income survey (Gini, quintile shares); DPAS A020001010 verified for median disposable income
    url: https://nstatdb.dgbas.gov.tw/dgbasAll/webMain.aspx?sys=100&funid=qryout&funid2=A020001010
    verified: 2026-10-23 (table page only)
    notes: >-
      Survey-based; the family income/expense survey is the only
      sub-national income cut. No World Bank PIP and no OECD inequality
      table for Taiwan — the national survey IS the comparable.

world:
  reserves.csv:
    source: CBC — cpx.cbc.gov.tw (EF07M01, key monthly financial indicators)
    url: https://cpx.cbc.gov.tw/api/dataapi/Get?FileName=EF07M01
    verified: 2026-10-23
    notes: >-
      VERIFIED. EF07M01 carries 外匯存底 (foreign exchange reserves, mn
      USD) monthly from 1992M01, plus the domestic-bank NPL ratio and CPI
      y/y in the same table. Taiwan's reserves run ~US$600bn — among the
      world's largest. IMF IFS does not carry Taiwan, so the CBC IS the
      comparable; any ranking panel must be built against other
      countries' own central banks, not an IMF table.
  ranking.csv:
    source: WTO (see trade.wto_profile.csv — key-gated) and ADB (carries some tables as "Taipei,China" in its Key Indicators products; API not probed live today — PENDING)
    url: UNVERIFIED
    official: true
    notes: >-
      Where WB/IMF/UN rankings are absent the entry names its
      substitute: the WTO carries "Chinese Taipei" and the reserves
      ranking comes from EF07M01 vs other countries' own central banks.
      HDI does not apply (no UNDP for Taiwan) — record in DATA_NOTES.md
      that the world chapter's human-development panel has no source;
      the chapter is built from trade and financial standing instead.

credit:
  household_credit.csv:
    source: CBC — cpx.cbc.gov.tw (EF99Y01 consumer and construction loans; EF07M01 NPL)
    url: https://cpx.cbc.gov.tw/api/dataapi/Get?FileName=EF99Y01
    verified: 2026-10-23
    notes: >-
      VERIFIED. EF99Y01: consumer loans and building loans outstanding,
      with construction loans standing in for household housing credit
      (CBC definition: 消費者貸款 includes credit cards/overdraft;
      建築貸款 is developers' construction credit — check which column
      is household mortgage before drawing; five-bank new-housing-loan
      detail is EH45M01). EF07M01 carries the bank NPL ratio (逾放比率).
      No BIS/IMF cross-country series for Taiwan; the CBC is both the
      national and the comparable source.

