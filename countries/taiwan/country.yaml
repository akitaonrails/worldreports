    pt: [Taiwan, DGBAS, Banco Central da República da China (Taiwan), estatísticas oficiais]
  spatial: "Taiwan, counties and cities of Taiwan"

# Named in the dek, and the institutions SOURCES.yaml must agree with.
# The international layer (WB/IMF/UN) is deliberately absent — the WTO,
# the MOF trade database (compiled from customs records) and the CBC
# stand in for it. The dek names the domestic bodies that actually carry
# the spine, including MOL, MOI/RIS and NIA for people and migration.
sources:
  zh-Hant: "行政院主計總處、中央銀行、財政部、勞動部、內政部戶政司與移民署"
  en: "the Directorate General of Budget, Accounting and Statistics, the Central Bank, the ministries of Finance, Labor and the Interior, and the National Immigration Agency"
  pt: "a Direção-Geral de Orçamento, Contabilidade e Estatística, o Banco Central, os ministérios das Finanças, do Trabalho e do Interior e a Agência Nacional de Imigração"
