# Data provenance — every series in this repo
#
# Curated CSVs (committed) are the source of truth for charts; where a public
# official API exists, fetch/fetch_*.py can refresh them (results written to
# *_from_api.csv / *_check.csv files so curated data is never clobbered).
# Retrieved/compiled: 2026-10-21.

macro:
  gdp.csv:
    source: IBGE — Contas Nacionais (SIDRA tables 6784 & 1846, 5932)
    url: https://sidra.ibge.gov.br/tabela/6784
    refreshed_by: fetch/fetch_ibge.py
    notes: >-
      nominal_rbi: annual current prices (R$ bn); 2024-2026 = sum of official
      quarterly values (table 1846, market prices) which matches the annual
      accounts. real_growth: annual volume variation (6784/9810; 2024-2025
      from 5932 Q4 accumulated). gdp_per_capita_usd computed as nominal GDP /
      population / average PTAX (BCB series 1). population_mn is Contas
      Nacionais variable 93 through 2023 and IBGE Projeções 2024
      (population.csv) from 2024 on; the two agree to within 0.049M over
      2006-2023, so the join introduces no step.
  ipca.csv:
    source: Banco Central — SGS series 433 (IPCA monthly %, compounded per year)
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados
    refreshed_by: fetch/fetch_bcb.py
  selic.csv:
    source: Banco Central — SGS series 432 (Copom target rate, year end); 2026 = current level (series 1178)
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados
    notes: >-
      432 is the Meta Selic set by Copom, not the realized rate accumulated
      over the year — it is a daily series that holds flat between meetings,
      and this file takes its value on the last day of each year. True
      accumulated Selic for 2005 was about 19.05% against the 18.00 here.
      The series begins in 1999 with inflation targeting; the realized
      Selic-over (series 1178 or 4390, from 1986) is a different concept and
      must not be spliced onto it.
    refreshed_by: fetch/fetch_bcb.py
  credit.csv:
    source: Banco Central — SGS 20622, 20539, 20714, 20715, 20716, 21082, 21084
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.20622/dados
    notes: >-
      Every code was resolved to its official name through BCB's open-data
      catalog (codigo_sgs on dadosabertos.bcb.gov.br), not inferred from its
      values — by magnitude alone 20717 looks like the household rate, since
      it is the highest at 48.5%, but it is "recursos livres - Total"; the
      household series is 20716 at 38.2%. One value a year, taken at
      DECEMBER rather than averaged, because these are stocks and stock
      ratios measured at a point in time; that makes the rate columns
      year-end rates, not annual averages. The rate and arrears columns
      begin in March 2011, when BCB rebuilt the credit statistics on SCR
      microdata. stock_brl_mn exists back to 1988 in SGS but crosses four
      currency redenominations with no unit column, so this file starts at
      1995. 2026 is partial (August).
    refreshed_by: fetch/fetch_credit.py
  household_debt.csv:
    source: Banco Central — SGS 29037, 29038, 29034 (household indebtedness)
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.29037/dados
    notes: >-
      debt_income = stock of household debt with the SFN over the last
      twelve months of accumulated income; debt_service = share of income
      going to debt service. The ex-housing column matters: the gap between
      it and the total is mortgage credit, which buys an asset, so the
      headline 49.9% should not be read as consumption debt. Covers the SFN
      only — it excludes fintech lenders outside the system, consórcios and
      informal credit, so it is a floor, not the whole of what households
      owe. December values; 2026 is partial (August).
    refreshed_by: fetch/fetch_credit.py
  dollar.csv:
    source: Banco Central — SGS series 1 (PTAX USD/BRL, free — sale, end of period)
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados
    notes: avg = simple average of daily values; eop = last business day
    refreshed_by: fetch/fetch_bcb.py
  reserves.csv:
    source: Banco Central — SGS series 3546 (international reserves, conceito liquidez, US$ mn, monthly)
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.3546/dados
    notes: >-
      eop_usbi = last monthly value of each year, converted to US$ bn. Series
      13637 (daily, conceito caixa) is served as an HTML error page under
      HTTP 200 by the SGS gateway and cannot be parsed; 3546 carries the same
      year-end level.
    refreshed_by: fetch/fetch_bcb.py
  unemployment.csv:
    source: IBGE — PNAD Contínua annual average (SIDRA 4562); PME annual (SIDRA 1168, 6 metro regions, old survey)
    notes: two non-comparable series in one file (value=PNAD-C national; pme=old metro survey); do not splice
    compiled: sub-agent research 2026-10-21, verified against IBGE releases
  minimum_wage.csv:
    source: planalto.gov.br legal acts (Decreto 12.797/2025 for 2026; Lei 11.321/2006 etc.)
    notes: value in force for most of each year (pre-2010 adjustments were not on Jan 1)
    compiled: sub-agent research 2026-10-21
  economy_from_wb.csv:
    source: 'World Bank — World Development Indicators (NE.GDI.FTOT.ZS, SL.UEM.TOTL.ZS)'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/NE.GDI.FTOT.ZS?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      gfcf_pct_gdp is whole-economy gross fixed capital formation, % of
      GDP (spending slot 3). unemployment_pct is the ILO modelled
      estimate, % of the labour force — harmonised, and not the national
      LFS headline, which stays the national line. Columns:
      gfcf_pct_gdp, unemployment_pct.
  household_credit_from_bis.csv:
    source: 'BIS — total credit statistics, WS_TC Q.BR.H.A.M.770.A'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/Q.BR.H.A.M.770.A?format=csv'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Credit to households and NPISHs from all sectors, market value, %
      of GDP, adjusted for breaks. hh_credit_pct_gdp_q4 is the Q4 (year-
      end) value the spine draws; _qavg is the mean of the quarters
      published and _quarters says how many, so the running year reads
      as one quarter, not a year. Wider than bank-loan series: every
      lender and debt securities are in it.

  inflation_target.csv:
    source: Conselho Monetário Nacional — inflation targets and tolerance intervals (CMN resolutions; a continuous target from 2025)
    url: https://www.bcb.gov.br/controleinflacao/historicometas
    notes: >-
      target = centre of the target for the calendar year, % (IPCA
      Dec/Dec); tolerance = the half-width of the band either side of it,
      percentage points: 2.0 through 2016, 1.5 from 2017. From 2025 the
      target is continuous (3.0% over any 12 months) rather than for the
      calendar year; the plate keeps reading it per year. Transcribed by
      hand from the BCB's historical table; it matches the dictionary the
      plate used to hard-code.
    compiled: 2026-10-22
  economy.csv:
    source: 'World Bank — World Development Indicators (NE.GDI.FTOT.ZS, SL.UEM.TOTL.ZS)'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/SL.UEM.TOTL.ZS?format=json'
    official: false
    notes: >-
      Curated copy of economy_from_wb.csv, accepted unchanged on
      2026-10-22. unemployment_pct is the ILO modelled estimate, drawn
      thin beside the national PNAD Contínua line on economy slot 4 and
      the only line covering the 2006-2011 gap before PNAD-C begins.
  household_credit.csv:
    source: 'BIS — total credit statistics, WS_TC Q.BR.H.A.M.770.A'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/Q.BR.H.A.M.770.A?format=csv'
    official: false
    notes: >-
      Curated copy of household_credit_from_bis.csv, accepted unchanged
      on 2026-10-22. Credit to households and NPISHs from all lenders, %
      of GDP; the plate draws the Q4 (year-end) column. 2026 has one
      quarter only and its Q4 is blank, so it is not drawn.

social:
  population.csv:
    source: IBGE — Projeções da População, revisão 2024 (tab4 indicadores, Brasil 2000-2070)
    url: https://ftp.ibge.gov.br/Projecao_da_Populacao/Projecao_da_Populacao_2024/projecoes_2024_tab4_indicadores.xlsx
    notes: >-
      pop_mn/growth_pct/tfr/births/deaths are all 2024-revision model output
      and mutually consistent; reference date 1 July. NOT the Censo 2022
      enumerated count (203,080,756) — IBGE adjusts that upward by 3.90% for
      undercount (7.33% for ages 0-9), so the two must never share an axis.
      Peak population 220,425,299 in 2041, declining from 2042; TFR falls
      2.3156 (2000) -> 1.5705 (2023), -32.2%. Do NOT use SIDRA tables
      7358/7360/7362/7363/7365: they still serve the superseded 2018 revision
      (peak 2047, 233.2M) with the year as a classification, not the period.
    refreshed_by: fetch/fetch_ibge_population.py
  homicides.csv:
    source: IPEA — Atlas da Violência (undocumented JSON API over DATASUS/SIM)
    url: https://www.ipea.gov.br/dados-api/series-values/328/1
    notes: >-
      Brazil = regiao_id 1076 at abrangencia 1. Series 328 count / 20 rate /
      365 hidden / 366 estimated count / 368 estimated rate. Definition is
      CID-10 X85-Y09 (agressões) + Y35-Y36 (intervenção legal), by victim's
      RESIDENCE. Verified against an independent DATASUS/TabNet pull: the
      counts match for all 19 years. Two breaks to annotate, not smooth:
      (1) 2019, where X85-Y09 falls 21% while deaths of undetermined intent
      (Y10-Y34) jump — largely reclassification, so the registered series
      overstates the decline; (2) 2024, where hidden homicides nearly double.
      "Estimated" adds a modeled share of those undetermined deaths and is
      equally official; the gap reached 17% in 2024 (42,590 vs 49,673).
      Rates are IPEA's own — do not recompute, the denominators are a
      documented patchwork and the Atlas PDF itself prints 20.1 vs the API's
      20.03 for 2024.
    refreshed_by: fetch/fetch_violence.py
  violence_fbsp.csv:
    source: FBSP — Anuário Brasileiro de Segurança Pública 2026 (20th ed., 2025 data)
    url: https://forumseguranca.org.br/wp-content/uploads/2026/07/anuario-2026.xlsx
    notes: >-
      Sheets T02 (MVI count + rate), P03 (deaths resulting from police intervention), P06 (homicides of
      women, femicides). MVI = homicídio doloso + latrocínio + lesão corporal
      seguida de morte + mortes por intervenção policial, by OCCURRENCE, from
      state police records. A different universe from homicides.csv — never
      splice them. Starts 2012 (properly 2013) but publishes ~18 months
      sooner, so it is the only source for the latest year. Use THIS for
      deaths resulting from police intervention, never SIM's Y35: SIM captures about a third of them,
      since the ICD code follows the death certificate rather than the police
      classification. The rising femicide share is substantially a
      classification effect (qualifier created by Lei 13.104/2015, autonomous
      crime from Lei 14.994/2024), so the 2015-2019 ramp is not a trend.
    refreshed_by: fetch/fetch_violence.py
  epidemic_deaths.csv:
    source: Ministério da Saúde — SIM/DATASUS, Mortalidade Geral (TabNet, CID-10)
    url: http://tabnet.datasus.gov.br/cgi/deftohtm.exe?sim/cnv/obt10uf.def
    notes: >-
      Deaths by underlying cause from death certificates, counted by the
      victim's RESIDENCE — the same instrument as homicides.csv, so the three
      columns are comparable to each other and to the security plate.
      COVID is read from B34, not U07: this TabNet definition carries no
      ICD-10 chapter XXII at all, so a U07 query returns zero rather than an
      error. B34's pre-pandemic baseline is ~64 deaths a year against 213,233
      in 2020, which is what makes it usable as a COVID proxy — but values
      before 2020 are unspecified viral deaths and must not be drawn under a
      COVID label. Dengue changes code mid-series: A90/A91 through 2024, A97
      from 2025 (ICD-10 2019 revision), and the column sums all three, or
      2025 reads as a year with no dengue deaths. Influenza is J09+J10+J11.
      Not the Ministry's COVID panel, which counted notifications during the
      emergency and reported 194,949 for 2020 against SIM's 213,233 — two
      instruments, not an error in either. 2025 is treated as complete on
      its own volume (1,534,588 registered deaths, above 2024's 1,532,015);
      2026 exists in TabNet and is genuinely partial, so it is excluded.
    refreshed_by: fetch/fetch_sim_causes.py
  hdi.csv:
    source: UNDP — Human Development Report 2025, complete time series (single vintage)
    url: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
    notes: post-2010 methodology for all years (internally consistent); latest year 2023
    compiled: sub-agent research 2026-10-21
  gini.csv:
    source: IBGE SIDRA 7435 (column ibge, 2012+) and World Bank PIP SI.POV.GINI (column wb)
    url: https://sidra.ibge.gov.br/tabela/7435
    notes: two vintages kept separate — do not splice; 2010 missing (census year, no survey)
    compiled: sub-agent research 2026-10-21
  poverty.csv:
    source: World Bank PIP — SI.POV.UMIC (US$ 8.30/day) and SI.POV.DDAY (US$ 3.00/day), PPP 2021 vintage
    url: https://api.worldbank.org/v2/country/BRA/indicator/SI.POV.UMIC
    notes: computed from IBGE PNAD/PNAD-C microdata; 2010 missing; 2025+ pending
    compiled: sub-agent research 2026-10-21
  demography_from_wb.csv:
    source: 'World Bank — World Development Indicators (SP.POP.TOTL, SP.POP.TOTL.FE.IN, SP.DYN.TFRT.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN, SM.POP.NETM), from the UN World Population Prospects and national vital statistics'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/SP.POP.TOTL.FE.IN?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Mid-year population (total and female), so a rate per 100,000
      women can be computed on a mid-year denominator. Crude birth and
      death rates are per 1,000 people. net_migration is a COUNT of
      people (WPP estimate), not a rate: per 1,000 = net_migration /
      population x 1,000 for the same year. WPP figures for recent years
      are estimates and are revised with each WPP. Columns: population,
      population_female, fertility, birth_rate_per_1000,
      death_rate_per_1000, net_migration.
  security_from_wb.csv:
    source: 'World Bank — World Development Indicators: VC.IHR.PSRC.P5 (UNODC), SH.STA.SUIC.P5 and SH.STA.TRAF.P5 (WHO Global Health Estimates)'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/VC.IHR.PSRC.P5?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      All per 100,000 people. Intentional homicide is UNODC's harmonised
      count, which usually differs from the national police or death-
      certificate series in both directions. Suicide and road-traffic
      deaths are WHO modelled estimates (suicide age-standardised),
      ending 2021 and 2019 respectively in this release; later years are
      blank, not zero. Columns: homicide_per_100k, suicide_per_100k,
      road_deaths_per_100k.

  deaths.csv:
    source: Ministério da Saúde — SIM/DATASUS, Mortalidade Geral (TabNet, CID-10, óbitos por residência)
    url: http://tabnet.datasus.gov.br/cgi/deftohtm.exe?sim/cnv/obt10uf.def
    refreshed_by: fetch/fetch_sim_causes.py
    notes: >-
      registered = the TabNet table's own Total row, every registered
      death of a Brazilian resident; the fetcher checks the ICD-10
      categories sum to it. suicide = X60-X84; road = V01-V89 (the
      Ministry's "acidentes de transporte terrestre"). Counts, not rates:
      the plates divide by social/population.csv : pop_mn of the same
      year. Final data to 2024; 2025 is preliminary (TabNet extraction
      28/07/2026); 2026 is a preview and is not taken. Spot value 2019 =
      1,349,801, read by hand off TabNet. Curated from
      deaths_from_sim.csv on 2026-10-22.
  demography.csv:
    source: 'World Bank — World Development Indicators (SP.POP.TOTL, SP.POP.TOTL.FE.IN, SP.DYN.TFRT.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN, SM.POP.NETM), from the UN World Population Prospects'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/SP.POP.TOTL.FE.IN?format=json'
    official: false
    notes: >-
      Curated copy of demography_from_wb.csv, accepted unchanged on
      2026-10-22. The plates use population_female (mid-year, the
      denominator of the per-100,000-women rates) and net_migration (a
      count, divided by population of the same year for per 1,000).
  security.csv:
    source: 'World Bank — World Development Indicators: VC.IHR.PSRC.P5 (UNODC), SH.STA.SUIC.P5 and SH.STA.TRAF.P5 (WHO)'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/SH.STA.SUIC.P5?format=json'
    official: false
    notes: >-
      Curated copy of security_from_wb.csv, accepted unchanged on
      2026-10-22. The WHO suicide and road-death estimates are drawn thin
      beside the SIM crude rates. UNODC's homicide rate is not drawn: it
      is built on the same SIM counts and sits within a point of the
      IPEA registered rate every year.

fiscal:
  tax_burden.csv:
    source: >-
      Receita Federal do Brasil + Tesouro Nacional — Carga Tributária Bruta do
      Governo Geral. 2010-2025: STN new methodology (GFSM 2014, FGTS/Sistema S
      excluded), edition 2025 (published 10/04/2026). 2006-2009: RFB old
      methodology (Estudos Tributários 2015).
    url: https://www.tesourotransparente.gov.br/publicacoes/carga-tributaria-do-governo-geral/2025/114
    notes: >-
      METHODOLOGY BREAK at 2010 (~-1.8pp level shift; no official recalc before
      2010). Chart shows the break. Old-methodology reference values for
      2010-2017 in the research notes (e.g. 2014: 31.84 old vs 29.53 new).
    compiled: sub-agent research 2026-10-21
  primary_result.csv:
    source: Tesouro Nacional — Resultado Primário do Governo Central, "acima da linha" (series-temporais.tesouro.gov.br, series 8911; % PIB 2015-2025 from PCPR/RTN publications)
    url: https://series-temporais-externo-frontend.tesouro.gov.br/backend-series-temporais/rest/Public/SerieGrafico/ValorSerie/8911
    notes: >-
      2006-2014 computed as STN R$ values / official nominal GDP (reproduces
      published % PIB exactly for 2015-2025). BCB "abaixo da linha" measure
      differs slightly (2023: -2.42% vs -2.09%).
    compiled: sub-agent research 2026-10-21
  debt.csv:
    source: Banco Central — DBGG (SGS 13762, "Conceito Bacen") and DLSP (SGS 4513), % GDP, December values
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.13762/dados
    notes: >-
      2026 = August values (82.87 / 69.27). Current official series; vintage
      Sept/2026 release (past ratios re-lowered by GDP revisions). Pre-2008
      debt methodology differs (old series 2006: 64.6%). SGS 4513 = NET debt
      (not gross); gross = 13762. IMF concept (broader): 93.3% in 2025.
    compiled: sub-agent research 2026-10-21
    refreshed_by: fetch/fetch_bcb.py
  revenue.csv:
    source: Tesouro Nacional — Receita Total do Governo Central (series-temporais API, series 8807, cash basis, before transfers)
    compiled: sub-agent research 2026-10-21
  spending_by_function.csv:
    source: "Tesouro Nacional — Despesas da União: Séries Históricas (SIAFI), published 30/09/2026"
    url: https://www.tesourotransparente.gov.br/publicacoes/despesas-da-uniao-series-historicas/2023/8-2
    files: Despesa_Funcao.xlsm / Despesa_Grupo.xls (thot-arquivos.tesouro.gov.br)
    notes: >-
      Spending by function as % of GDP. despesa liquidada, Orçamentos Fiscal e
      Seguridade Social, excluding debt refinancing. juros_gnd2 & pessoal_gnd1
      are GND groups (not funções); encargos_especiais (função 27) contains
      most interest. % GDP computed as value / IBGE nominal GDP.
      outras = total − listed functions.
  spending_by_function_rbi.csv:
    source: "Tesouro Nacional — Despesas da União: Séries Históricas (SIAFI), published 30/09/2026"
    url: https://www.tesourotransparente.gov.br/publicacoes/despesas-da-uniao-series-historicas/2023/8-2
    files: Despesa_Funcao.xlsm / Despesa_Grupo.xls (thot-arquivos.tesouro.gov.br)
    notes: >-
      The same series in R$ billion of the year, which is what the site's
      headline figures and plate 03 read. 2026 rows = Jan-Aug partial (the R$
      file only), so annual totals stop at 2025.
  debt_bcb.csv:
    source: Banco Central — SGS 13762 (gross, DBGG) and 4513 (net, DLSP), % GDP
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.13762/dados
    refreshed_by: fetch/fetch_bcb.py
    notes: >-
      Fetcher output, kept beside the curated debt.csv for comparison. Not read
      by the charts: debt.csv is the curated series.
  investment.csv:
    source: >-
      IBGE Contas Nacionais (FBCF, SIDRA 1846/6784); Tesouro — Orçamento GND4
      (liquidado); Tesouro RTN série histórica (valor pago, GND4+5, % PIB published)
    url: https://www.tesourotransparente.gov.br/ckan/dataset/ab56485b-9c40-4efb-8563-9ce3e1973c4b/resource/527ccdb1-3059-42f3-bf23-b5e3ab4c6dc6/download/seriehistoricajul26.xlsx
    notes: three investment concepts kept as separate columns; RTN series starts 2008
  general_government_from_imf.csv:
    source: 'IMF — World Economic Outlook and Fiscal Monitor, via DataMapper (GGR_G01_GDP_PT (Fiscal Monitor), G_X_G01_GDP_PT (Fiscal Monitor), GGXCNL_NGDP (WEO), GGXONLB_G01_GDP_PT (Fiscal Monitor), GGXWDG_NGDP (WEO))'
    url: 'https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      General government, % of GDP, calendar years. Balance and gross
      debt are WEO indicators; revenue, expenditure and the primary
      balance are not WEO codes on DataMapper (GGR_NGDP, GGX_NGDP and
      GGXONLB_NGDP do not exist there) and come from the Fiscal Monitor,
      served from the same database — the fetcher checks the WEO and
      Fiscal Monitor balances agree within 0.1 pt before writing. Stops
      at 2025: later IMF years are staff projections. 2025 itself may be
      an IMF estimate. Columns: revenue_pct_gdp, expenditure_pct_gdp,
      balance_pct_gdp, primary_balance_pct_gdp, gross_debt_pct_gdp. The
      IMF's gross debt is wider than the BCB's DBGG (it counts the
      Treasury bonds the central bank holds), so it reads higher than
      fiscal/debt.csv; both are right.
  public_investment_from_oecd.csv:
    source: 'OECD — National Accounts at a Glance, chapter 6, OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI, measure P51GS13'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI,/A.BRA.P51GS13...'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      gov_gfcf_pct_gdp: general-government gross fixed capital
      formation, % of GDP (spending slot 4). General government, unlike
      the federal-only GND4 columns of investment.csv; the OECD series
      stops in 2020.

  cofog.csv:
    source: Tesouro Nacional, SOF and IBGE — Despesa por Função do Governo Geral (COFOG), edition 2023 spreadsheet (table 1.5.a, % do PIB) and edition 2024 report (Tabela 1)
    url: https://cdn.tesouro.gov.br/sistemas-internos/apex/producao/sistemas/thot/arquivos/publicacoes/51473_1617293/anexos/24705_1617712/COFOG%20GG.xlsx
    refreshed_by: fetch/fetch_cofog.py
    notes: >-
      General government (central, state, municipal), GFSM 2014, % of GDP.
      The ten COFOG divisions mapped to the spine's seven groups:
      social_protection 710, health 707, education 709, general_public 701
      (includes 7017, public-debt transactions, i.e. interest),
      economic_affairs 704, defence_order 702+703, other 705+706+708.
      2010-2023 from the 2023 edition's spreadsheet via the fetcher, which
      checks the divisions sum to the published total and that the 2023
      column matches the 2024 report's. 2024 transcribed by hand from
      "Relatório COFOG GG 2024", Tabela 1 (preliminary; its groups sum to
      45.78 against a published 45.79, rounding). The total matches the
      IMF's general-government expenditure to the hundredth in 2010 and
      2015. Curated 2026-10-22.
  general_government.csv:
    source: 'IMF — World Economic Outlook and Fiscal Monitor, via DataMapper (GGR_G01_GDP_PT, G_X_G01_GDP_PT, GGXCNL_NGDP, GGXONLB_G01_GDP_PT, GGXWDG_NGDP)'
    url: 'https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP'
    official: false
    notes: >-
      Curated copy of general_government_from_imf.csv, accepted unchanged
      on 2026-10-22. General government, % of GDP, calendar years; the
      spine's canonical fiscal series. Net interest on the plate is
      primary_balance_pct_gdp - balance_pct_gdp.
  public_investment.csv:
    source: 'OECD — National Accounts at a Glance, chapter 6, measure P51GS13'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI,/A.BRA.P51GS13...'
    official: false
    notes: >-
      Curated copy of public_investment_from_oecd.csv, accepted unchanged
      on 2026-10-22. General-government GFCF, % of GDP; stops in 2020.
  nfsp.csv:
    source: Banco Central — NFSP sem desvalorização cambial, % PIB, fluxo acumulado em 12 meses, setor público consolidado (SGS 5727 resultado nominal, 5793 primário, 5760 juros nominais)
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.5760/dados?formato=json
    refreshed_by: fetch/fetch_bcb_fiscal.py
    notes: >-
      December value of each 12-month flow = the calendar year. BCB sign:
      positive = a financing need (a deficit), so nfsp_primary 0.43 in
      2025 is a primary DEFICIT of 0.43% of GDP. interest is the nominal
      interest bill of the consolidated public sector (central government,
      states, municipalities and state firms outside Petrobras and
      Eletrobras), the "juros nominais" Brazilian debate is about. The
      fetcher checks nominal = primary + interest every year. Curated from
      nfsp_from_bcb.csv on 2026-10-22.

trade:
  trade.csv:
    source: MDIC/SECEX — "Balança Comercial Brasileira — Dados Consolidados" (TOTAIS_ANUAL.xlsx and product/destination factor files)
    url: https://balanca.mdic.gov.br/balanca/publicacoes_dados_consolidados/tabelas/pg_series_historicas/
    notes: >-
      US$ FOB; SECEX's consolidated series restates 2012-2019 vs first-published
      figures (2014: -9.9 consolidated vs -4.0 announced; 2013: -9.0 vs +2.4).
      2026 = Jan-Sep. Product groupings per SOURCES notes; complexo soja includes
      soy oil (HS 1507) and sucroalcooleiro includes ethanol (HS 2207) from UN
      Comtrade (Brazil-reported). Cross-checked vs UN Comtrade exact matches.
    compiled: sub-agent research 2026-10-21
  exports_products.csv:
    source: SECEX factor files + UN Comtrade supplements (HS 1507, 2207, 2710)
    notes: selected years (2006, 2010, 2015, 2020, 2024, 2025); others = residual
    compiled: sub-agent research 2026-10-21
  imports_products.csv:
    source: SECEX import factor files (fuels, fertilizers+agrotoxics, machinery/electronics, chemicals+pharma, vehicles, wheat)
    notes: selected years; share of total imports FOB
    compiled: sub-agent research 2026-10-21
  destinations.csv:
    source: SECEX EXP_ANUAL_{CHINA, ESTADOS UNIDOS, UNIÃO EUROPEIA, ARGENTINA, JAPÃO}.xlsx
    notes: SECEX's fixed EU bloc definition; Argentina = Mercosul proxy; 2026 = Jan-Sep
    compiled: sub-agent research 2026-10-21
  trade_from_wb.csv:
    source: 'World Bank — World Development Indicators (NE.EXP.GNFS.ZS, NE.IMP.GNFS.ZS)'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/NE.EXP.GNFS.ZS?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Exports and imports of goods AND services, national-accounts
      basis, % of GDP — not a customs goods series. The trade balance is
      their difference and is not stored. Columns: exports_pct_gdp,
      imports_pct_gdp.

  national_accounts.csv:
    source: 'World Bank — World Development Indicators (NE.EXP.GNFS.ZS, NE.IMP.GNFS.ZS)'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/NE.EXP.GNFS.ZS?format=json'
    official: false
    notes: >-
      Curated copy of trade_from_wb.csv, accepted unchanged on 2026-10-22
      (renamed because trade.csv is the SECEX goods file). Goods and
      services, national-accounts basis, % of GDP; the balance on the
      plate is exports minus imports.

markets:
  ibov.csv:
    source: B3 — IBOVESPA official historical statistics (adjusted series); 2005-06 cross-checked vs BCB SGS series 7
    url: https://sistemaswebb3-listados.b3.com.br/indexStatisticsPage/variation/IBOVESPA?language=en-us
    notes: year-end closes; 2026 = Oct 20 close (208,295.98, +29.3% YTD, record run)
    compiled: sub-agent research 2026-10-21
  sp500.csv:
    source: S&P 500 (^GSPC) final trading-day closes from Yahoo Finance history; cross-checks CNBC (2025), macrotrends (Oct 2026)
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC
    notes: 2026 = Oct 20 close (7,712.57); price index, excludes dividends
    compiled: sub-agent research 2026-10-21

  bond_10y.csv:
    source: Tesouro Nacional — Tesouro Direto historical rates, NTN-F (Tesouro Prefixado com Juros Semestrais), one workbook a year
    url: https://cdn.tesouro.gov.br/sistemas-internos/apex/producao/sistemas/sistd/2025/NTN-F_2025.xls
    refreshed_by: fetch/fetch_tesouro_direto.py
    notes: >-
      yield_10y = annual mean, over business days, of the buy rate ("Taxa
      Compra Manhã") of the NTN-F whose maturity is closest to ten years
      from that day, counting only days when that bond matures 8.5-11.5
      years out. days and the maturity columns say what each year rests
      on. 2006 (longest NTN-F seven years) and 2009 (eight) have no such
      day and are blank; 2008 rests on 125 days. A retail offer rate set by
      the Tesouro each morning from the market, not ANBIMA's secondary-
      market curve (which is behind a login). No official API publishes a
      constant-maturity 10-year yield for Brazil; the OECD's "long-term
      interest rate" for Brazil is the TJLP, a BNDES lending rate. 2026 =
      Jan to 21 Aug. Curated from bond_10y_from_tesouro.csv on 2026-10-22.
migration:
  stock_census.csv:
    source: IBGE — Censo Demográfico 2022, Migração e Deslocamento
    url: https://biblioteca.ibge.gov.br/visualizacao/livros/liv102187.pdf
    refreshed_by: fetch/fetch_migration.py
    notes: >-
      Same-census numerator and denominator. Foreign-born is from the migration
      report; citizenship is refreshed from SIDRA table 10157
      (https://sidra.ibge.gov.br/tabela/10157). Neither is an annual flow.
  origins_census.csv:
    source: IBGE — Censo Demográfico 2010 and 2022, Migração e Deslocamento
    url: https://biblioteca.ibge.gov.br/visualizacao/livros/liv102187.pdf
    refreshed_by: fetch/fetch_migration.py
    notes: >-
      Census residents born in Latin America, two snapshots. The 2022 report
      preserves the 2010 comparison on the same named origin region.

international:
  wef.csv:
    source: World Economic Forum — Global Competitiveness Report editions 2006-07 through 2017-18 (GCI, scale 1-7) and GCI 4.0 2018/2019 (scale 0-100, via World Bank data360)
    url: https://www3.weforum.org/docs/WEF_GlobalCompetitivenessReport_2006-07.pdf
    notes: >-
      scores pre/post 2018 are NOT comparable; rank denominators vary
      (122->141 countries); last edition with country rankings = 2019.
    compiled: sub-agent research 2026-10-21
  cpi.csv:
    source: Transparency International — Corruption Perceptions Index (2006-2011 from archived TI tables; 2012+ from TI/Wikipedia compiled tables; 2024-25 from TI Brasil)
    url: https://www.transparency.org/en/cpi/2025
    notes: "0-10 scale until 2011, 0-100 from 2012 (TI: only 2012+ comparable); chart script rescales pre-2012 by 10"
    compiled: sub-agent research 2026-10-21
  world_from_wb.csv:
    source: 'World Bank — World Development Indicators (NY.GDP.MKTP.CD, NY.GDP.PCAP.CD, FI.RES.TOTL.CD)'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/NY.GDP.MKTP.CD?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Current US$: GDP, GDP per person, and total reserves including
      gold (year-end, IMF IFS via the WDI). A harmonised cross-country
      series for the world chapter, not the national accounts; spot-
      checked and cross-checked in the fetcher. Columns: gdp_usd,
      gdp_per_person_usd, reserves_usd.
  world.csv:
    source: 'World Bank — World Development Indicators (NY.GDP.MKTP.CD, NY.GDP.PCAP.CD, FI.RES.TOTL.CD)'
    url: 'https://api.worldbank.org/v2/country/BRA/indicator/NY.GDP.MKTP.CD?format=json'
    official: false
    notes: >-
      Curated copy of world_from_wb.csv, accepted unchanged on 2026-10-22.
      GDP and GDP per person in current US$ (economy slot 2, world slot
      1). Reserves are drawn from the BCB's own macro/reserves.csv, which
      agrees with reserves_usd to within US$1bn.
