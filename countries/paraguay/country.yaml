# Named in the dek, and the institutions SOURCES.yaml must agree with.
# Only publishers whose numbers are drawn are named: INE for the
# population, poverty and labour series, MEF for the fiscal accounts,
# UNDP for the HDI, and the World Bank and IMF for the harmonised layer
# that stands in for the blocked central bank.
sources:
  es: "el INE, el Ministerio de Economía y Finanzas y el PNUD, además del Banco Mundial y el FMI para las comparaciones"
  en: "the INE, the Ministry of Economy and Finance and UNDP, plus the World Bank and IMF for comparisons"
  pt: "o INE, o Ministério da Economia e Finanças e o PNUD, além do Banco Mundial e do FMI para comparações"
