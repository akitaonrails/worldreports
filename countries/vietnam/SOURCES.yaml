    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Income Gini, 0–1 scale, national plus urban/rural and six regions,
      2002–2025. Verified: 2006 0.424, 2010 0.433, 2018 0.425, 2019 0.423,
      then 2020 0.375 and 2025 0.323. A FIVE-POINT FALL IN ONE YEAR
      (2019→2020) is not a plausible redistribution, and the 2025 value is
      "Sơ bộ". The table carries no footnote (the PX-Web footnote page is
      empty) and the cause is not verified: a VHLSS income-module or
      weighting change is the likely explanation. It is annotated as an
      undocumented step and drawn as two segments, 2002–2019 and
      2020–2025, until the NSO's methodology note confirms the cause. The World Bank's SI.POV.GINI (2020 36.8, 2022 36.1)
      is a consumption-based Gini on its own welfare aggregate. It is a
      different quantity on a 0–100 scale, kept in its own file.
  poverty_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V14.46, Tỷ lệ hộ nghèo (household poverty rate on the national standard)
    url: https://pxweb.nso.gov.vn/pxweb/vi/Y tế, văn hóa và MSDC/Y tế, văn hóa và MSDC/V14.46.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Share of HOUSEHOLDS below the government's poverty standard, which
      has been redefined every five years. The PX NOTEX, verbatim in
      substance: income standard to 2015; multidimensional standard
      2016–2021 ("*"); multidimensional standard 2022–2025 ("**", from
      2022). Years 1998–2016 then 2020–"Sơ bộ 2025", with 2017–2019 absent
      in this table. `year_label` keeps the markers exactly as published
      ("2021*", "2023**"). The `standard` column is INFERRED by the
      fetcher from the NOTEX and the V14.01 comparison, not published: it
      reads income-based to 2016 (the NSO keeps 2016 on the old line
      here), the 2016–2021 multidimensional standard for 2020–2021, and
      the 2022–2025 standard from 2022. Verified: 2006 15.5, 2010 14.2, 2015 7.0, 2016 5.8,
      2020 4.8, 2023 3.37, 2024 2.3, 2025 1.35. TWO TABLES DISAGREE: the
      summary table V14.01 reads 2016 = 9.2 and carries 2017–2019 (7.9,
      6.84, 5.65), because it puts 2016 on the new multidimensional
      standard where V14.46 keeps the old one. One table per line, the
      standard changes annotated, never spliced. The World Bank's
      SI.POV.DDAY ($3/day 2021 PPP: 2006 23.7, 2022 1.6) is a third
      definition, in its own file.
  inequality_from_wb.csv:
    source: World Bank — WDI SI.POV.GINI, SI.POV.DDAY, SI.POV.NAHC (Poverty and Inequality Platform, VHLSS microdata)
    url: https://api.worldbank.org/v2/country/VNM/indicator/SI.POV.GINI?format=json&date=2006:2025
