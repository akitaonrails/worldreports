      Fetched through the HTML JSON-stat door like every NSO file. The
      JSON API (/api/v1/vi/Dân số và lao động/V02.59.px, POST
      {"query":[...],"response":{"format":"json"}}, reply with a BOM) is
      used only as a cross-check, asserted equal to its 2-dp rounding.
      Unemployment rate IN WORKING AGE (trong độ tuổi lao động),
      2010–"Sơ bộ 2025" (2000–2009 blank in the table): 2010 2.91, 2020
      2.48, 2021 3.20 (Delta), 2025 2.21. Labour force 15+ (thousands) 2000–2025; informal employment
      rate 2013–2025. Rates are fine at the API's rounding (2 dp), but
      the fetcher uses the HTML JSON-stat door wherever SHOWDECIMALS could
      truncate. Unemployment exists on three definitions: NSO working age
      (here), ADB LUR_PT for 15+ (2.24 in 2024, covering 2005–2009 too),
      and the World Bank's ILO-modelled SL.UEM.TOTL.ZS (1.60 in 2024).
