# Data provenance: every planned series for Vietnam.
#
# Written 2026-10-22 BEFORE any CSV exists, as the research pass prescribes.
# The fetch swarm then stages each `*_from_*` sidecar under data/. Nothing
# here is curated yet. Corrected at consolidation (same day) to what the
# four fetchers actually do; where this file and DISCOVERY.md disagree,
# this file is right. Every endpoint below was curled live on 2026-10-22
# and its payload shape is recorded in the notes. The pending block under
# `meta` lists publishers that exist but have no machine endpoint this
# machine can reach. The page's sources table ignores `meta`.
#
# THE NATIONAL PUBLISHER. The General Statistics Office is now Cục Thống kê,
# the National Statistics Office (NSO), under the Ministry of Finance. The
# old gso.gov.vn domain no longer resolves; www.nso.gov.vn serves the site.
# The NSO runs a PxWeb 2019 database at pxweb.nso.gov.vn with two doors:
#
#   1. The PxWeb JSON API, /api/v1/vi/<db>/<table>.px. GET gives metadata,
#      POST a query gives data. It exposes only five databases (Công
#      nghiệp, Đầu tư, Doanh nghiệp, Dân số và lao động, Giáo dục, plus
#      English twins). National accounts, prices, trade, the budget and the
#      social tables all 404 there. Formats: `json` and `csv` work,
#      `json-stat2` 404s. TRAP: the API rounds every value to the table's
#      SHOWDECIMALS. The total fertility rate (V02.15) comes back as "2"
#      for every year from 2001 to 2025. The CSV is Windows-1252, so the
#      Vietnamese labels are destroyed into '?' and the header row is
#      mislabelled.
#   2. The PxWeb HTML table pages, /pxweb/vi/<db>/<db>/<table>.px/. Every
#      database is here: an ASP.NET WebForms page with __VIEWSTATE. A fetcher
#      GETs the page, selects every <option> of each ValuesListBox, sets
#      OutputFormatDropDownList=FileTypeJsonStat and posts ButtonViewTable.
#      The reply is a JSON-stat v1 attachment, UTF-8 with a BOM and ONE
#      TRAILING NUL BYTE that has to be stripped before parsing. Values come
#      at full precision (TFR 2024 = 1.91). FileTypePX also works but its
#      CODEPAGE is iso-8859-15, so the labels are lossy. A bad path lands on
#      /ErrorGeneral.aspx under HTTP 200. The fetcher must assert the
#      content-disposition header and the dataset key, never the status.
#
# Year labels carry status: "Sơ bộ 2025" is preliminary and "Ước tính 2025"
# is an estimate. Parse the year off the label and keep the status in a
# column. The PX tables are the statistical yearbook (Niên giám), updated
# each August, so they stop at 2025. The running year 2026 exists only in
# NSO press releases, and nothing on a plate is built from those.
#
# THE GDP SCALE BREAK. In 2019 the NSO revalued GDP upward by roughly a
# quarter, from 2010 onward only. V03.01's own note: "Số liệu từ năm 2010 là
# số liệu theo quy mô GDP đánh giá lại". The PX table carries 2000–2002 and
# 2009 on the OLD scale (2009 = 1,809,149 bn VND) and 2010+ on the NEW
# (2010 = 2,739,843 bn VND); 2003–2008 are absent. ADB carries 2005–2009
# from the NSO on the old scale with the same footnote. The World Bank's
# NY.GDP.MKTP.CD inherits the seam and jumps from US$106.0bn (2009) to
# US$147.2bn (2010), +39% in a year of 6.4% real growth. The IMF WEO
# back-casts the revaluation and reads US$129.0bn for 2009. Growth across
# 2009→2010 on the NSO or WB level is methodology, not growth. Never splice
# the scales. Draw the old-scale segment and the new-scale segment apart,
# or use the IMF series for a continuous level, labelled as such.

meta:
  pending:
    - name: policy rates (refinancing, rediscount), history
      publisher: Ngân hàng Nhà nước Việt Nam (State Bank of Vietnam, SBV)
      url: https://sbv.gov.vn/lãi-suất1
      official: true
      notes: >-
        sbv.gov.vn sits behind an F5 WAF that answers "Request Rejected"
        (244 bytes) under HTTP 200 to a bare curl. A full browser header set
        (UA, Accept, Accept-Language, Sec-Fetch-*) passes, and the site is
        now a Liferay portal. The rate page shows only the CURRENT values
        (2026-10-22: refinancing 4.50%, rediscount 3.00%, decision
        1123/QĐ-NHNN of 16/06/2023) and today's interbank fixings. It holds
        no history and no download. The IMF SDMX API (api.imf.org, MFS_IR
        9.0.0) answers 403 to data queries. Hand-curate the refinancing-rate
        history from the SBV decisions (Quyết định) when the markets plate
        is built. The NSO's V03.21 covers deposit and lending averages and
        the central rate from 2015 in the meantime.
    - name: exchange rates and monetary statistics, direct from the SBV
      publisher: Ngân hàng Nhà nước Việt Nam (State Bank of Vietnam, SBV)
      url: https://sbv.gov.vn/tỷ-giá
      official: true
      notes: >-
        The central rate page gives TODAY only (22/10/2026: 1 USD = 25,632
        VND, notice 442/TB-NHNN). The "Dữ liệu thống kê" pages (M2, credit,
        NPL ratio, loan-to-deposit) are HTML snapshots of the latest period,
        and /can-can-thanh-toan-quoc-te returns 403 even with browser
        headers. dttktt.sbv.gov.vn (the old WebCenter statistics host)
        times out. The NSO republishes the annual central rate (V03.21),
        credit (V03.19), money (V03.18.02, 2025 only) and the balance of
        payments (V03.20), and those are what is staged.
    - name: merchandise trade by partner and commodity, customs basis
      publisher: Tổng cục Hải quan / Cục Hải quan (General Department of Vietnam Customs)
      url: https://www.customs.gov.vn/
      official: true
      notes: >-
        customs.gov.vn resolves (58.186.80.48) but the TCP connection times
        out from this machine on every path. That is a block, not a 403.
        The NSO republishes customs trade by partner (V09.06/V09.12) and by
        SITC group (V09.03/V09.09-10), so the trade chapter is not blocked.
        UN Comtrade carries Vietnam's own report through 2023.
    - name: public debt bulletin and state budget outturn, direct from the MOF
      publisher: Bộ Tài chính (Ministry of Finance)
      url: https://mof.gov.vn/
      official: true
      notes: >-
        mof.gov.vn is a Vite single-page app whose bundle calls an
        undocumented relative /api/. The public debt bulletin (Bản tin nợ
        công) and the budget disclosure (công khai ngân sách) are documents.
        vst.mof.gov.vn and the treasury (kbnn.vn) never connected. Staged
        instead: the NSO's budget revenue and expenditure (V03.13-17), ADB's
        general-government GFS table to 2022, and IMF WEO general-government
        gross debt and net lending, which is not the MOF's public-debt
        definition. The MOF counts public debt as government plus
        government-guaranteed plus local-government debt. Hand-curate the
        bulletin's public-debt-to-GDP series if a plate needs the national
        definition.
    - name: overseas contract workers (labour export), annual departures
      publisher: Cục Quản lý lao động ngoài nước (DOLAB), formerly MOLISA, now the Ministry of Home Affairs
      url: https://dolab.gov.vn/
      official: true
      notes: >-
        This is the single most important migration flow for Vietnam:
        workers sent abroad on contract, mostly to Japan, Taiwan and Korea.
        dolab.gov.vn and molisa.gov.vn both timed out. MOLISA's labour
        functions moved to the Ministry of Home Affairs (moha.gov.vn answers
        200) in the 2025 restructuring. The annual totals exist only in
        press releases and year-end reports. Hand-curate them from DOLAB's
        year-end reports, labelled as a flow of contract departures, not
        emigrants, and never drawn on the UN DESA stock's axis (SOURCING
        §4a).
    - name: recorded crime and intentional homicide, police count
      publisher: Bộ Công an (Ministry of Public Security)
      url: https://bocongan.gov.vn/
      official: true
      notes: >-
        bocongan.gov.vn answers (117 KB HTML) but publishes no crime
        statistics table. Vietnam reports no national homicide series. The
        UNODC CTS portal's download paths 302 away (dataunodc.un.org). What
        survives in the World Bank's VC.IHR.PSRC.P5 stops at 2011. The
        security chapter is therefore built from the prosecution and court
        counts the NSO republishes (V14.77), the police traffic-death count
        (V14.86) beside the WHO estimate, and the WHO's modelled homicide
        rate. The gap is named on the plate, not filled.
    - name: national summary data page (IMF e-GDDS/SDDS)
      publisher: Cục Thống kê (National Statistics Office)
      url: http://nsdp.nso.gov.vn/
      official: true
      notes: >-
        Linked from the NSO homepage. The connection was reset on 2026-10-22.
        If it comes back it may carry SDMX for the quarterly national
        accounts and the monthly CPI, which the PX-Web database does not.
    - name: VN-Index from the exchange itself
      publisher: HOSE (Sở Giao dịch Chứng khoán TP.HCM)
      url: https://www.hsx.vn/
      official: false
      notes: >-
        hsx.vn is a React app with no documented history endpoint. Nobody
        official publishes an index close anyway. Staged from CafeF (below).
        Yahoo was tried and rejected: ^VNI is delisted, ^VNINDEX.VN returns
        a single point, and 0P0000HY8X.VN starts in 2020 and reads the
        2024-12 month-end as 1,254.59 against HOSE's 1,266.78 close. stooq
        serves its 796-byte JS wall under HTTP 200.

macro:
  gdp_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V03.01, Một số chỉ tiêu chủ yếu về tài khoản quốc gia
    url: https://pxweb.nso.gov.vn/pxweb/vi/Tài khoản quốc gia/Tài khoản quốc gia/V03.01.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Sixteen national-accounts aggregates: GDP at current prices (tỷ
      đồng, i.e. bn VND), GDP per person in VND and in USD (converted at
      the average interbank rate), capital formation, final consumption,
      exports and imports of goods and services, GNI, GDP at constant 2010
      prices, real growth, and the expenditure shares of GDP. Years:
      2000–2002, 2009, 2010–2023, "Sơ bộ 2024", "Ước tính 2025". 2003–2008
      are ABSENT from the table, and 2009 and earlier are on the
      pre-revaluation scale (see the header). Verified 2026-10-22: GDP
      2024 = 11,510,329 bn VND, 2025 = 12,847,571 bn VND; GDP per person
      2024 = US$4,700, 2025 = US$5,026. At 101.3mn people that puts 2024
      at about US$476bn, equal to the World Bank's US$476.3bn. Real growth
      2020 2.87%, 2021 2.55%, 2022 8.54%, 2025 8.02%. HTML door only; the
      API 404s for this database.
  gdp_from_adb.csv:
    source: Asian Development Bank — Key Indicators Database, SDMX v5 dataflow ADB,DF_NA (economy VIE)
    url: https://kidb.adb.org/api/v5/sdmx/data/ADB,DF_NA/A..VIE?format=sdmx-csv&startPeriod=2005
    refreshed_by: fetch/fetch_adb.py
    official: false
    notes: >-
      ADB republishes the NSO's national accounts (DATA_SOURCE "National
      Statistics Office") with the 2006–2008 years the NSO's own PX table
      no longer carries: NGDE_XDC (GDP, bn VND, UNIT_MULT 9 → 2006 =
      1,061,565), NGDP_R_PTX_PS (real growth: 2008 5.66, 2009 5.40),
      expenditure components and sector shares, 2005–2025. A redistributor,
      so not official here. The footnote on every pre-2010 row says it is
      on the "unreevaluated scale". It is the only machine source for
      2006–2008 and is never spliced onto the NSO's new-scale 2010+ line.
      Quirk: a Q frequency key returns the annual rows; there is no
      quarterly national-accounts series for Vietnam in KIDB. FOOTNOTE is
      series-level and its leading span ("2005-2010: …") is the span of
      the QUERY, not of the years the note covers; the fetcher carries
      each footnote verbatim in the CSV comments. NGDP_XDC carries
      OBS_STATUS B at 2010 (asserted); levels and shares are split into
      *_old_scale (≤2009) and *_new_scale (≥2010). A sidecar with no
      non-normal OBS_STATUS carries no break_flags column.
  cpi_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V11.08, CPI, gold and USD price indices and core inflation, annual average (previous year = 100)
    url: https://pxweb.nso.gov.vn/pxweb/vi/Chỉ số giá/Chỉ số giá/V11.08.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Annual-average CPI as an index with the previous year = 100.
      Inflation is the value minus 100. Twenty groups, plus the gold price
      index, the USD price index and core inflation (lạm phát cơ bản, from
      2010; earlier cells are null, which is correct). Years 2000,
      2003–2025. Verified: 2008 122.97 (+23.0%, the window's peak), 2011
      118.58, 2023 103.25, 2024 103.63, 2025 103.31. Equal to World Bank
      FP.CPI.TOTL.ZG (2024 3.62, 2025 3.31) and ADB PCPI_PC_PP_PT. The
      gold and USD indices are household-relevant in Vietnam (savings are
      held in both), but they are price indices and not exchange or policy
      rates. Monthly tables V11.01–V11.07 stop at 2025 like the rest of
      the yearbook.

fiscal:
  budget_revenue_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V03.13-14 (Thu ngân sách Nhà nước) and V03.15 (as % of GDP); source of record Ministry of Finance
    url: https://pxweb.nso.gov.vn/pxweb/vi/Tài khoản quốc gia/Tài khoản quốc gia/V03.13-14.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      STATE BUDGET revenue (ngân sách nhà nước: central plus local), bn
      VND, by 21 heads: domestic revenue excluding crude oil, SOEs, FDI
      firms, the non-state sector, personal income tax, lottery, land and
      housing, crude oil, trade taxes net of VAT refunds, and aid. Years
      2000, 2002–2024 and "Ước tính 2025". Verified: total 2006 = 279,472;
      2020 = 1,510,579 (the COVID dip); 2024 = 2,057,544; 2025 estimate
      2,681,469 bn VND. The % of GDP companion V03.15 covers only
      2018–2025 (2024 17.9%, 2025 estimate 20.9%); four of its heads
      (lottery, fuel fee, trade duties/excise, import VAT) are blank in
      every year and are dropped, named in the CSV header. This is a cash,
      state-budget concept. It is not general government (see ADB below)
      and is never spliced with it.
  gg_finance_from_adb.csv:
    source: Asian Development Bank — Key Indicators Database, SDMX v5 ADB,DF_GOV_FIN (general government, GFSM 2014)
    url: https://kidb.adb.org/api/v5/sdmx/data/ADB,DF_GOV_FIN/A..VIE?format=sdmx-csv&startPeriod=2005
    refreshed_by: fetch/fetch_adb.py
    official: false
    notes: >-
      General-government revenue (GR_G14_GG), expense, net lending
      (GXCNL_G14_GG) and tax revenue, bn VND and % of GDP, 2005–2022 ONLY.
      Verified 2006: revenue 262,063 bn VND = 24.7% of GDP, tax revenue
      21.9%, net lending +0.25%. The %GDP denominators before 2010 are the
      old GDP scale, which is why 2006 reads higher than the NSO-based
      state-budget ratio would. Kept beside the NSO's state-budget series
      as a different concept, never spliced. REF_YEAR "Ending 31
      December": calendar years. No OBS_STATUS flags, so no break_flags
      column. ADB and the IMF disagree on 2022: ADB net lending −3.6% of
      GDP, IMF WEO +0.7%. Two publishers, two lines.
  debt_balance_from_imf.csv:
    source: IMF — World Economic Outlook via DataMapper API (GGXWDG_NGDP, GGXCNL_NGDP)
    url: https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP/VNM
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      General-government gross debt and net lending/borrowing, % of GDP.
      Debt 2000–2031, net lending 1998–2031; years after 2025 are WEO
      PROJECTIONS (kind=projection). Verified: debt 2006 30.2, 2010 37.3,
      2020 41.3, 2024 31.2, 2025 30.5, 2026p 28.3; net lending 2020 −2.9,
      2024 −0.9, 2025 0.0. QUIRKS: a browser User-Agent ("Mozilla/5.0")
      gets an Akamai "Access Denied" 403, so send curl's default UA. The
      /VNM path segment does NOT filter: the reply carries ~226 countries,
      so read values[ind]["VNM"]. GGR_NGDP and GGX_NGDP return no rows for
      any country. This is not the MOF's public-debt definition (see
      meta.pending).

spending:
  budget_spending_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V03.16 (Chi ngân sách Nhà nước) and V03.17 (as % of GDP); source of record Ministry of Finance
    url: https://pxweb.nso.gov.vn/pxweb/vi/Tài khoản quốc gia/Tài khoản quốc gia/V03.16.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      State-budget expenditure, bn VND, eleven heads: development
      investment, recurrent spending on education and training, health,
      science and technology, culture, social security (đảm bảo xã hội),
      economic services and environment, administration (state, Party and
      mass organisations), and the financial reserve fund. These are
      budget heads, not COFOG. Years 2005, 2007–2024 and "Ước tính 2025":
      2006 IS MISSING and stays blank. Verified: total 2020 = 1,709,524;
      2024 = 2,148,477; 2025 estimate 3,312,560 bn VND = 25.8% of GDP
      against 18.7% in 2024. That 2025 step is an ESTIMATE ("Ước tính"),
      and the table does not explain it. It is labelled as an estimate and
      checked against the 2025 final accounts (quyết toán) before any
      claim is made of it. % of GDP (V03.17) covers 2018–2025 only; five
      of its heads are blank in every year and are dropped, named in the
      CSV header.

trade:
  trade_totals_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V09.01, Tổng mức lưu chuyển hàng hoá xuất, nhập khẩu; source of record Vietnam Customs
    url: https://pxweb.nso.gov.vn/pxweb/vi/Xuất nhập khẩu/Xuất nhập khẩu/V09.01.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Merchandise exports, imports, total and balance, US$ millions, plus
      growth index, 1990–"Sơ bộ 2025". Customs basis. Verified: exports
      2006 39,826; 2023 354,721 (UN Comtrade's mirror of Vietnam's own
      report reads 353,078); 2024 405,935; 2025 474,998. Balance 2025
      +20,071. Goods only and customs-valued. The BoP basis (V03.20, FOB)
      is a different series, although its 2023 goods-export line equals
      the customs figure (354,721). The balance's growth index is blank in
      every year of the table and is dropped (the header says so).
  exports_by_partner_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V09.06, exports by country bloc, country and territory
    url: https://pxweb.nso.gov.vn/pxweb/vi/Xuất nhập khẩu/Xuất nhập khẩu/V09.06.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      71 rows: TỔNG SỐ, then the blocs (ASEAN, APEC, EU, OPEC), which
      OVERLAP and are never stacked, then countries. US$ millions,
      1995–2025, long format sorted by year. THE NSO PUBLISHES NAMES ONLY,
      NO CODES: `partner` is the label as published (NFC) and
      `partner_iso3` is the fetcher's own mapping (an unmapped new label
      fails the run). China is labelled "CHND Trung Hoa" and Hong Kong
      "ĐKHC Hồng Công (TQ)", so match on partner_iso3, never on the name.
      Some bloc rows are blank in some years (APEC and OPEC in 2025): a
      blank is unpublished, not zero. The TỔNG SỐ rows are asserted equal
      to V09.01. Verified:
      United States 2006 7,845 → 2024 119,478 → 2025 153,135 (the US is the
      largest export market); China 2024 60,878.
  imports_by_partner_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V09.12, imports by country bloc, country and territory
    url: https://pxweb.nso.gov.vn/pxweb/vi/Xuất nhập khẩu/Xuất nhập khẩu/V09.12.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      65 rows, same structure as V09.06 (names only; partner_iso3 is the
      fetcher's mapping), 1995–2025. Verified: total 2024
      381,304, 2025 454,926; Korea 2024 55,985. China is the largest
      import source. The pair with exports is the story: a surplus with
      the US, a deficit with China.
  trade_by_group_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V09.14 (goods exports and imports by group, % of GDP) and V09.15 (services exports and imports)
    url: https://pxweb.nso.gov.vn/pxweb/vi/Xuất nhập khẩu/Xuất nhập khẩu/V09.14.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      V09.14: exports by group (fuels and minerals, manufactures,
      agricultural, forestry, fishery, non-monetary gold) and imports by
      end use, as % of GDP, for 2005 and 2009–2025. 2005 is on the old GDP
      scale and 2006–2008 are absent. V09.15: services trade by type,
      2005–2025. The ratios inherit the GDP scale break in their
      denominator.
  trade_from_comtrade.csv:
    source: UN Comtrade — public preview API, Vietnam as reporter (code 704), HS TOTAL
    url: https://comtradeapi.un.org/public/v1/preview/C/A/HS?reporterCode=704&period=2023&partnerCode=0&flowCode=X&cmdCode=TOTAL
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Cross-check only. Vietnam's report to the UN, 2023 exports
      US$353.08bn against the NSO's 354.72bn (asserted within 0.5%);
      imports 325.44bn against 326.61bn. 2006–2023 staged; 2024 and 2025
      return count 0 (not yet loaded) and are left out, not zero; they are
      re-requested, uncached, on every run. QUIRKS: the preview API takes
      ONE period per call, so the fetcher makes one call per year; HTTP
      429 after two quick calls ("Rate limit is exceeded. Try again in 2
      seconds"), so it sleeps between years and backs off. hs_edition
      records the HS vintage Vietnam reported that year.
  openness_from_wb.csv:
    source: World Bank — WDI NE.TRD.GNFS.ZS (trade in goods and services, % of GDP)
    url: https://api.worldbank.org/v2/country/VNM/indicator/NE.TRD.GNFS.ZS?format=json&date=2006:2025
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      2006–2025. Verified: 2006 138.3, 2010 114.0, 2024 173.9, 2025 190.3.
      The fall from 2006 to 2010 is mostly the GDP revaluation entering the
      denominator in 2010, not a fall in trade. Annotate it.

markets:
  rates_fx_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V03.21, Lãi suất, tỷ giá trung tâm; source of record State Bank of Vietnam
    url: https://pxweb.nso.gov.vn/pxweb/vi/Tài khoản quốc gia/Tài khoản quốc gia/V03.21.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Seventeen series, 2015–"Sơ bộ 2025": average VND deposit rates by
      tenor (demand to over 24 months), average USD deposit rates, average
      VND and USD lending rates (short; medium and long), and the SBV
      central rate VND per USD. Verified: 12-month VND deposit 2020 6.81 →
      2024 4.91 → 2025 5.13; medium/long VND lending 2020 10.25 → 2025
      8.30; central rate 2020 23,208.78 → 2024 24,170.41 → 2025 24,977.20.
      THE CENTRAL RATE IS BLANK FOR 2015–2017 in V03.21: the column starts
      in 2018 (22,605.96), whatever the table's title promises. USD
      deposit rates are 0.15–0.63 in 2015, then 0 from 2016.
      THE USD DEPOSIT ROWS ARE ALL 0.00 AND THAT IS REAL, NOT MISSING: the
      SBV has capped USD deposit rates at 0% since late 2015. Drawing them
      as a flat zero line is correct; dropping them as blanks is not. No
      policy rate here (see meta.pending). The central rate is a managed
      reference; banks trade within a band around it (±5% since October
      2022).
  usdvnd_from_wb.csv:
