security:
  justice_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V14.77 (Hoạt động tư pháp) and V14.78 (prosecutions by crime group, 2025); source of record Supreme People's Procuracy and Supreme People's Court
    url: https://pxweb.nso.gov.vn/pxweb/vi/Y tế, văn hóa và MSDC/Y tế, văn hóa và MSDC/V14.77.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Cases and defendants PROSECUTED (khởi tố), indicted (truy tố) and
      tried (xét xử), 2011–"Sơ bộ 2025". Verified: cases prosecuted 2011
      71,665 → 2024 100,504 → 2025 79,791; cases tried 2013 67,779 → 2024
      81,125. These count what the justice system processed, not what
      happened. A rise is enforcement as much as crime, and the 2025 fall
      is a "Sơ bộ" figure whose cause the table does not give. Say both
      on the plate. V14.78 gives the 2025 split by Penal Code
      chapter (crimes against life and health, property, drugs, public
      order), one year only. No homicide row exists in any NSO table.
  traffic_fire_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V14.86 (Trật tự và an toàn xã hội) and V14.87 (accidents by road type); source of record Ministry of Public Security
    url: https://pxweb.nso.gov.vn/pxweb/vi/Y tế, văn hóa và MSDC/Y tế, văn hóa và MSDC/V14.86.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Traffic accidents, collisions, deaths and injuries; fires and
      explosions, deaths, injuries and damage; 2012–"Sơ bộ 2025". Verified
      traffic deaths: 2012 9,838 → 2021 5,790 → 2022 13,551 → 2024 11,205
      → 2025 10,533. THE 2022 STEP IS A RECLASSIFICATION, NOT A SAFETY
      COLLAPSE. In one year accidents double (11,487 → 23,352) and deaths
      rise 134%, while the separately counted "va chạm" (minor collisions)
      FALL (4,055 → 3,490) and stop being reported after 2023. Incidents
      moved between categories and the death count's scope widened. The
      table carries no footnote saying so, so the fetcher asserts the step
      and the plate annotates it as a definitional break, with two
      segments that are never joined. V14.87 (tngt_* columns, by road type
      and region) covers only 2022–2024 and is NOT a breakdown of V14.86:
      its 2022 mode deaths sum to 6,397 against V14.86's 13,551 (the old
      narrow basis), its 2023–2024 mode sums match V14.86 within 3%
      (asserted), and its own 2024 CẢ NƯỚC row (3,855) does not equal its
      modes (11,101). Use the mode rows, never tngt_*_all for 2024, and
      never compare 2022 with 2023 inside V14.87.
  road_deaths_from_who.csv:
    source: WHO — Global Health Observatory RS_198 (estimated road traffic death rate per 100,000)
    url: https://ghoapi.azureedge.net/api/RS_198?$filter=SpatialDim eq 'VNM'
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      WHO's MODELLED estimate: 2018 24.6, 2019 23.5, 2021 17.7, 2023 12.9
      per 100,000. Before 2022 that is about three times the police count
      (2019: ~23,000 modelled deaths against 7,624 recorded). After the
      2022 redefinition the two converge (2023: ~13,000 against 11,885).
      Two publishers, one idea, and the gap is the finding. Filter
      Dim1=SEX_BTSX.
  homicide_from_who.csv:
    source: WHO — Global Health Observatory VIOLENCE_HOMICIDERATE (Global Health Estimates, modelled)
    url: https://ghoapi.azureedge.net/api/VIOLENCE_HOMICIDERATE?$filter=SpatialDim eq 'VNM' and Dim1 eq 'SEX_BTSX'
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Estimated homicide rate per 100,000, 2000–2021: 2014 1.79, 2019
      1.84, 2021 1.91. A model, not a count: Vietnam publishes no national
      homicide statistic. The plate says that, in words, beside the line.
  homicide_from_wb.csv:
    source: World Bank — WDI VC.IHR.PSRC.P5 (UNODC CTS, intentional homicides per 100,000)
    url: https://api.worldbank.org/v2/country/VNM/indicator/VC.IHR.PSRC.P5?format=json&date=2000:2025
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      The UNODC count as redistributed by the World Bank, 2001–2011 only
      (2006 1.28, 2010 1.53). It ends in 2011 and is not extended by
      anything. The WHO model is a different series and is never spliced
      onto it.

mortality:
  registered_deaths_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V02.34, deaths registered (đăng ký khai tử) by province and timeliness; source of record Ministry of Justice civil registry
    url: https://pxweb.nso.gov.vn/pxweb/vi/Dân số và lao động/Dân số và lao động/V02.34.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      HTML door. Deaths REGISTERED, total, on time and late, 2018–2024. Verified:
      2019 556,015; 2020 583,751; 2021 625,455; 2022 725,035; 2023
      642,391; 2024 629,465. The 2022 peak lags the 2021 COVID wave
      because late registrations land in the year they are filed. The
      "Quá hạn" (late) column measures that, and the plate shows it. No
      cause of death: Vietnam has no national ICD-coded death register in
      any machine-readable form. Because the register begins only in 2018,
      it cannot supply the canonical 2015–2019 excess-deaths baseline; the
      canonical slot remains pending rather than using a 2018–2019 substitute.
  hiv_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V14.19, HIV/AIDS cases and deaths by province; source of record Ministry of Health
    url: https://pxweb.nso.gov.vn/pxweb/vi/Y tế, văn hóa và MSDC/Y tế, văn hóa và MSDC/V14.19.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      New HIV infections and AIDS cases, people living with HIV
      (cumulative to 31 December), deaths from HIV/AIDS in the year,
      2011–2024. The one cause-specific mortality count the NSO publishes.
      New AIDS cases and AIDS living run to 2017 only; cumulative deaths
      start in 2022; the per-100,000 columns exist for 2024 only, and the
      NSO's label on the death-rate row names "2024" whatever the year, so
      do not read it as a series. For a rate over time compute deaths ÷
      population_from_gso.csv. Use the CẢ NƯỚC row. "Không xác định" (unknown province) is a
      separate row and is part of the national total.
  causes_from_who.csv:
    source: WHO — Global Health Estimates (xmart DEX_CMS/GHE_FULL), deaths by cause, VNM
    url: https://xmart-api-public.who.int/DEX_CMS/GHE_FULL?$filter=FLAG_LEVEL eq 1 and DIM_COUNTRY_CODE eq 'VNM' and DIM_SEX_CODE eq 'TOTAL' and DIM_AGEGROUP_CODE eq 'TOTAL'
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      MODELLED deaths (with uncertainty interval), rates and shares by
      cause, 2000–2023 (the current GHE edition runs two years past the
      research pass's 2021), long format: level 0 all causes, 1 the three
      broad groups, 2 cause groups, 3 causes; never sum across levels.
      All causes 2021 708,741 (registered deaths 625,455), 2023 720,006.
      Verified level 1 for 2021, per 100,000: communicable/maternal/perinatal 145.3 (the COVID
      year), noncommunicable 506.7, injuries 64.4. Levels 2–3 give the
      cause detail. This is the only cause-of-death source for Vietnam,
      and it is an estimate. The mortality chapter says so in its title,
      not a footnote. NCDMORT3070 (30–70 NCD mortality probability,
      2000–2023) is a GHO companion and is not staged. COVID-19 is its
      own level-3 cause (code 395, zero before 2020), and self-harm,
      interpersonal violence and road injury are level-3 rows too: the
      modelled sources for the spine's COVID, suicide and homicide slots.

credit:
  credit_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V03.19, credit outstanding of credit institutions at 31 December; source of record State Bank of Vietnam
    url: https://pxweb.nso.gov.vn/pxweb/vi/Tài khoản quốc gia/Tài khoản quốc gia/V03.19.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      Total credit to the economy (dư nợ tín dụng), thousand bn VND, by
      currency (VND / foreign) and tenor (short / medium-long), with
      growth, 2015–"Sơ bộ 2025". Verified: 2015 4,655.9 → 2020 9,192.6 →
      2024 15,619.5 → 2025 18,598.0, about 145% of 2025 GDP. A year-end
      STOCK, never summed. There is no household-debt series anywhere for
      Vietnam. This chapter is "credit to the economy" and says so, which
      is a departure from the spine to record in DATA_NOTES.
  credit_from_adb.csv:
    source: Asian Development Bank — KIDB ADB,DF_MF_MON (depository corporations survey), with ADB,DF_MF_FIN (FSANL_PT, NPL ratio from IMF FSI) folded into the same file
    url: https://kidb.adb.org/api/v5/sdmx/data/ADB,DF_MF_MON/A..VIE?format=sdmx-csv&startPeriod=2005
    refreshed_by: fetch/fetch_adb.py
    official: false
    notes: >-
      Claims on the private sector (FMIR_DC_CPS_XDC_PS, bn VND, 2005–2025:
      2006 693,834; 2024 15,705,613), M2 and M2/GDP (2006 86.9%; 2024
      155.6%), and the NPL ratio (FSANL_PT, 2008–2024; 2024 4.85). The
      2006–2014 years exist only here. The NPL ratio is the
      IMF-FSI-reported figure. The SBV's own "tỷ lệ nợ xấu" is an HTML
      snapshot (meta.pending) and the two are not assumed to agree. The
      M2/GDP denominator carries the 2010 GDP-scale break. DF_MF_FIN is
      not a file of its own: its NPL ratio is the npl_ratio_pct column
      here (https://kidb.adb.org/api/v5/sdmx/data/ADB,DF_MF_FIN/A..VIE?format=sdmx-csv&startPeriod=2005).
      No observation is flagged, so there is no break_flags column.
      Cross-check: claims on the private sector 2024 15,705.6 tn VND
      against the NSO's credit to the economy (V03.19) 15,619.5 tn.
  private_credit_from_wb.csv:
    source: World Bank — WDI FS.AST.PRVT.GD.ZS (domestic credit to private sector, % of GDP)
    url: https://api.worldbank.org/v2/country/VNM/indicator/FS.AST.PRVT.GD.ZS?format=json&date=2006:2025
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      2006 65.4 → 2010 90.4 → 2020 115.5 → 2022 125.0, ending in 2022.
      Part of the 2010 step is the GDP denominator changing scale.
      Annotate it.

migration:
  migrant_stock_from_undesa.csv:
    source: UN DESA Population Division — International Migrant Stock 2024, Table 1 (by destination and origin)
    url: https://www.un.org/development/desa/pd/sites/www.un.org.development.desa.pd/files/undesa_pd_2024_ims_stock_by_sex_destination_and_origin.xlsx
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Vietnam's story is EMIGRATION. Rows with origin code 704 and
      destination World (900) give the stock of people born in Vietnam
      living abroad: 1990 1,128,520; 2005 2,091,843; 2010 2,339,779; 2020
      3,330,404; 2024 3,693,537. The top six destinations by 2024 stock, ranked
      once in the fetcher: United States (1,434,631), Japan (589,874),
      Australia (294,435), Taiwan (263,078), Korea (260,609), Canada
      (179,690); the research pass's "Australia, Canada and France"
      order was wrong. Each destination's figure is on its own basis
      (birth, citizenship, or citizenship plus refugees), recorded in the
      CSV header. Destination 704 and
      origin 900 give the immigrant stock in Vietnam: 2010 84,408; 2020
      200,639; 2024 326,418. Coverage flag "C", type "R": a
      citizenship-based estimate including refugees, NOT country of birth
      (§4a), and the plate says which. Five-yearly points plus 2024. They
      are drawn as points, never interpolated into an annual line. 6 MB
      xlsx; a bare curl gets an HTML error page, so send a browser UA and
      check for the PK zip magic before parsing.
  net_migration_from_wb.csv:
    source: World Bank — WDI SM.POP.NETM (net migration, UN WPP 2024 estimates)
    url: https://api.worldbank.org/v2/country/VNM/indicator/SM.POP.NETM?format=json&date=2006:2025
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Modelled net migration, persons, 2006–2025: 2010 −4,443; 2020
      −6,457; 2022 −78,977; 2023 −81,789; 2025 −48,171. 2006 READS
      +482,399. That is not plausible as an inflow of half a million
      people into a country of emigration. It is an artefact of the WPP
      estimate, cause unverified. The fetcher keeps
      it, the plate either starts the line in 2007 or annotates the
      point, and the choice goes in DATA_NOTES. A residual estimate, not a
      count. SOURCING §4a says to publish the two flows separately where
      they exist. For Vietnam they do not, which is why the stock and the
      remittance panels carry this chapter.
  remittances_proxy_from_adb.csv:
    source: Asian Development Bank — KIDB ADB,DF_GLOB_BOP, BXIS_BP6_USD (secondary income, credit), with NSO V03.20 "Chuyển giao vãng lai - Thu" for 2018–2025
    url: https://kidb.adb.org/api/v5/sdmx/data/ADB,DF_GLOB_BOP/A.BXIS_BP6_USD.VIE?format=sdmx-csv
    refreshed_by: fetch/fetch_adb.py
    official: false
    notes: >-
      The World Bank's personal-remittances series for Vietnam
      (BX.TRF.PWKR.CD.DT) is EMPTY. BX.TRF.PWKR.DT.GD.ZS stops in 2004, so
      the obvious source does not exist. Secondary-income credit is a
      SUPERSET of remittances (it includes other current transfers),
      2007–2025: 2024 US$17.0bn, 2025 19.8bn. It is labelled as
      "secondary income received (includes remittances)", never as
      remittances. The NSO's 2018–2025 rows equal ADB's.
  internal_migration_from_gso.csv:
    source: Cục Thống kê (NSO) — PX-Web V02.21-23, in-migration, out-migration and net migration rates by province
    url: https://pxweb.nso.gov.vn/pxweb/vi/Dân số và lao động/Dân số và lao động/V02.21-23.px/
    refreshed_by: fetch/fetch_nso.py
    notes: >-
      HTML door. Long format (year, status, place, level, rates), sorted
      by year. INTERNAL migration between provinces, per mille, 2005, 2007–2025
      (national in-migration rate 2010 9.7, 2012 7.2). Not international
      migration. At national level in = out by construction, so only the
      provincial rows (Bình Dương, Hồ Chí Minh City in; the Mekong delta
      out) carry information. 71 rows on the pre-2025 63-province map,
      plus Hà Tây (merged into Hà Nội in 2008), so match on names with
      care. The 2025 merger to 34 provinces will re-key every provincial
      table. In this chapter only as the internal half of the story,
      labelled as such.
