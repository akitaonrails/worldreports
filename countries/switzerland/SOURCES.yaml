    source: EFV — Finanzstatistik, Hauptaggregate und Prognosen im FS- und GFS-Modell (main_extern.csv)
    url: https://www.data.finance.admin.ch/static/assets/datasets/fs_dashboard/main_extern.csv
    refreshed_by: fetch/fetch_efv.py
    notes: >-
      text/csv, 462kB, long format: hh (staat = general government, bund,
      ktn = cantons, gdn = communes, sv = social security, bund_ktn_gdn),
      model (fs national model / gfs IMF model), variable, jahr 1990–2030,
      value, source (Rechnung = outturn | Prognosen | Budget/Finanzpläne |
      Hochrechnung). RATIOS ARE FRACTIONS (0.237, not 23.7). Verified
      staat/gfs 2024 (Rechnung): saldo +2,480 CHF mn, defizit_ueberschuss
      +0.29% GDP, staatsquote 31.35%, fiskalquote 26.7%,
      fiskalquote_erweitert 37.3%, schuldenquote (Maastricht) 23.7%,
      bruttoschuldenquote 30.0%, fremdkapitalquote 40.4%; 2020 saldo
      −18,705. 2025 IS STILL "Prognosen" — filter on source and mark the
      last outturn year. The four debt measures and two tax ratios are
      separate columns (header trap 5); the GFS model is the
      internationally comparable one, the FS model is the national one
      (they differ — 2024 saldo FS +3,254 vs GFS +2,480). EFV's revenue and
      expenditure ratios sit 1.5 pt below Eurostat TR/TE for 2024 (31.6/31.4
      vs 33.1/32.8) — more than the GDP vintage explains, so a recording
      difference between the EFV GFS model and Eurostat's ESA table; two
      lines, never one. EFV has no interest-paid column: the spine's
      interest slot uses Eurostat D41PAY. Fixed-path file: delete
      cache/efv_main_extern.csv to refresh.
