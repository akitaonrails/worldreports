demography:
  balance_from_bfs.csv:
    source: BFS — STATPOP/BEVNAT, Demografische Bilanz nach Kanton (px-x-0102020000_101)
    url: https://www.pxweb.bfs.admin.ch/api/v1/de/px-x-0102020000_101/px-x-0102020000_101.px
    refreshed_by: fetch/fetch_bfs.py
    notes: >-
      PxWeb v1 API: GET returns metadata JSON; POST a json-stat-style query
      with "response":{"format":"csv"} → CSV in WINDOWS-1252 (decode
      cp1252, not UTF-8). 1971–2025, by canton (0 = Schweiz), citizenship
      (Swiss/foreign), sex; 16 components: stock 1 Jan, births, deaths,
      natural change, immigration incl. change of population type,
      emigration, net migration, acquisitions of citizenship, stock 31 Dec.
      Verified Schweiz 2025: 1 Jan 9,051,029, births 78,153, deaths 71,904,
      immigration 204,261, emigration 133,829, 31 Dec 9,127,125;
      naturalisations 40,672. BFS publishes 0 for immigration and
      emigration before 1981 although net migration is non-zero: holes, not
      zeros, so the sidecar starts in 1981. Identity pop_31dec = pop_1jan +
      natural change + net + stock adjustment asserted. The PxWeb cache
      files have fixed names (cache/bfs_px_*.csv): delete to refresh. RATE
      LIMIT: the server answers HTTP 429
      ("Too many requests in too short timeframe") after a burst of
      roughly 30 calls in 10 s and stays locked for ~10 s; some tables
      exist only in /de/ (an /en/ request is HTTP 400). Space calls ≥1 s.
