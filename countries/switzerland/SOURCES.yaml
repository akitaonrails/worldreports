trade:
  goods_by_partner_from_bazg.csv:
    source: BAZG — Aussenhandel, saisonbereinigte Daten nach Ländern (SA_COUNTRY_EXP / SA_COUNTRY_IMP)
    url: https://ocean.bazg.admin.ch/open-data-reports/SA_COUNTRY_EXP_en_v1/SA_COUNTRY_EXP_en_v1.csv
    refreshed_by: fetch/fetch_bazg.py
    notes: >-
      3.8MB, SEMICOLON-separated, served as application/octet-stream;
      columns Traffic_direction;country;Country_txt;year;period;Period_txt;
      Nominal_Value;wdAdjusted_*;seasonalAdjusted_*;trend_*;status;Update.
      1995-01 → 2026-09, CHF. 58 partners and aggregates (EU 100302,
      Europe 100800, Asia 100820, North America 100844 …). THE PERIOD
      CODE MIXES MONTHS (1–12) AND QUARTERS (24–27) IN ONE COLUMN —
      summing a year over all rows doubles it; sum 1–12 only. status
      prov for 2026. No World row: build the total from the continents
      and assert it. Verified 2025 exports (months): Europe 160.0bn,
      EU 147.0, North America 58.3, Germany 43.0, China 15.2. This is the
      konjunkturelles Total (Total 1, excl. gold). The quarter rows are
      asserted equal to their months, then dropped. Customs territory = CH +
      Liechtenstein. NAMED TOTAL LINES, never one series: TOTAL1 = sum of
      the six continents (= SNB BoP Total 1 DAT1, 2024 exports 283,005.7);
      TOTAL2 = general total INCLUDING gold, built by streaming the
      CTCI5_EXP/CTCI5_IMP SITC files (open-data-reports/CTCI5_*_en_v1, 4–5
      GB each, 1988+), 2012 onward (= SNB BoP foreign-trade total, 2025
      exports 461,014.1); TOTAL2_PRE2012 = the same file before 1 Jan 2012,
      when gold bars entered special trade — a BREAK, not comparable with
      TOTAL2; GOLD_SITC971 = non-monetary gold (2025 exports 163.8bn,
      imports 179.8bn). Only the CTCI5 monthly aggregates are cached, keyed
      to the object's ETag (cache/bazg_CTCI5_*_monthly.csv), so a re-run
      re-reads the bucket listing but never re-streams the 9 GB unless BAZG
      republishes. The running year is omitted (2026: 9 of 12 months).
