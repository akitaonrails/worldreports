# Data provenance — every planned series for Switzerland.
#
# Written 2026-10-22 BEFORE any CSV exists, as the research pass prescribes;
# the fetch swarm then staged each `*_from_*` sidecar under data/, and the
# consolidation pass (same day) corrected this file to what the eight
# fetchers actually do. Nothing here is curated yet. Every endpoint below
# was curled live on 2026-10-22. The `meta` block is for publishers that
# exist but could not be staged this session; the page's sources table
# ignores it. DATA_NOTES.md carries the cross-file judgement calls.
#
# YEARS: every series here is on the CALENDAR year. The Swiss fiscal year
# is the calendar year; nothing is keyed on an April fiscal year (an early
# brief said otherwise; it was wrong, and the fetchers were checked).
#
# FIVE SWISS TRAPS, which several entries repeat:
#
# 1. VINTAGES OF GDP. The BFS annual national accounts were revised on
#    2026-08-25; Eurostat nama_10_gdp CH and the World Bank still carry the
#    previous vintage. They agree to the decimal through 2022 and part from
#    2023: 2023 CHF 837.2bn (BFS) vs 834.2bn, 2024 860.9bn vs 854.0bn, 2025
#    881.6bn vs 867.5bn. (fetch_bfs.py asserts equality 2006–2022.)
#    Every ratio Eurostat publishes for CH (household debt % GDP, government
#    ratios) is on the OLD denominator. Never divide a BFS numerator by a
#    Eurostat denominator or the reverse.
# 2. GOLD IN TRADE. Switzerland refines most of the world's gold. Foreign-
#    trade "Total 1" (konjunkturelles Total) excludes gold bars, other
#    precious metals, gems, art and antiques; "Total 2" (Generaltotal)
#    includes them. In 2025 non-monetary gold was CHF 149.6bn of 461.0bn
#    goods receipts in the balance of payments. One total per line, named.
#    The BoP foreign-trade receipts equal the customs Total 2 to the franc
#    (2025 461,014.1 CHF mn), but the BoP GOLD line is not the customs gold
#    line: customs SITC 971 exports 2025 = 163.8bn vs BoP gold receipts
#    149.6bn. Never equate them.
# 3. IMMIGRATION INCLUDES CHANGES OF STATUS. BFS (and therefore Eurostat
#    migr_imm1ctz CH) counts "Einwanderung inkl. Änderung des
#    Bevölkerungstyps": a person who has been in the NON-permanent resident
#    population (asylum seekers, S-status, L permits) for 12 months moves
#    into the permanent population and is counted as an immigrant then. The
#    2023 peak (263,081) is largely Ukrainians with S status crossing the
#    12-month line, not 263k arrivals that year. 65,260 S-status holders
#    were in the PERMANENT population at end-2025. EUROSTAT IS NOT ONE
#    DEFINITION: migr_imm1ctz CH equals BFS (type changes included) in
#    2000–2010 and 2023–2024, but EXCLUDES the type changes in 2011–2022
#    (lower by exactly BFS's component, e.g. 2015 153,627 vs 188,515). Two
#    seams inside the harmonised series.
# 4. ASSISTED SUICIDE. BFS counts assisted suicide (Exit, Dignitas) as its
#    own series from 2003. Until 2008 the SAME deaths are also inside
#    "Suizid" in the cause-of-death table; from 2009 they are coded to the
#    underlying disease instead. Never add the two series. A suicide line
#    across 2008/09 falls (1,313 → 1,105) for a reason that is
#    classification.
# 5. FISCAL "DEBT" HAS FOUR NUMBERS, all correct, for the same general
#    government in 2024: Maastricht debt 23.7% GDP (EFV), GFS gross debt
#    30.0% (EFV), GFS total liabilities 40.4% (EFV) = IMF GGXWDG 40.4%, and
#    Eurostat financial-accounts liabilities 40.9% (old GDP vintage). And the
#    tax ratio has two: 26.7% (EFV fiscalquote) vs 37.3% "extended" that
#    adds mandatory health-insurance premiums and occupational pension
#    contributions, which in Switzerland are compulsory but not taxes.
#
# GEOGRAPHY: Switzerland = the 26 cantons (BFS). BAZG trade covers the
# Swiss–Liechtenstein customs territory (certain). Liechtenstein shares the
# franc, but whether each SNB cube (bank credit, BoP, reserves) includes it
# is NOT confirmed from the SNB's notes — an open question (meta.pending).
# Until it is answered, an SNB panel names the SNB as its scope and claims
# neither "Switzerland only" nor "incl. Liechtenstein".

meta:
  pending:
    - name: asylum, permits and the foreign-population register, primary publisher
      publisher: SEM — Staatssekretariat für Migration
      url: https://www.sem.admin.ch/sem/de/home/publiservice/statistik/asylstatistik.html
      official: true
      notes: >-
        Reachable (HTTP 200) on 2026-10-22, but the yearly archive pages
        (…/asylstatistik/archiv/2025.html) now carry only a PDF commentary
        (stat-jahr-2025-kommentar-d.pdf); the monthly/annual xlsx tables
        are no longer linked as static files, and SEM's eight opendata.swiss
        datasets all point at the 2019 archive (stale). Staged instead: the
        Eurostat migr_* asylum and permit tables for CH (SEM is their
        reporting body) and BFS STATPOP by permit type. SEM's register
        (ZEMIS) foreign-population count differs from BFS STATPOP by
        definition (SEM: "faktenblatt-unterschiede-statistiken-d.pdf",
        linked from auslaenderstatistik.html) — two publishers, never one
        line. Hand-curate SEM annual asylum totals at build if needed.
    - name: registered unemployment RATE (SECO), direct
      publisher: SECO — amstat
      url: https://www.amstat.ch/
      official: true
      notes: >-
        The legacy https://www.amstat.ch/v2/index.jsp answers 404. SECO's
        registered-unemployed COUNTS (annual means, 2000–2025) are staged
        via the BFS table je-d-03.03.00.01 (verified), and SECO's real-time
        database carries ur_nsa/ur_sa sheets (verified present, not yet
        parsed). Rate from amstat directly is pending.
    - name: household arrears in the credit system (no delinquency register)
      publisher: none — Switzerland has no published household arrears series from the banks or the SNB
      url: https://data.snb.ch/
      official: true
      notes: >-
        No SNB cube carries household loan delinquency or NPLs (searched the
        186-cube catalogue). The credit chapter's "servicing" panel uses the
        BFS SILC payment-arrears table (social/arrears_from_bfs.csv, survey,
        2013–2024) instead, and says it is a survey of people, not a
        register of loans. A bank-wide NPL ratio (all loans, not households)
        exists as the IMF FSI via WB FB.AST.NPER.ZS (see the spine-gaps
        entry); it is not staged yet.
    - name: Liechtenstein inside the SNB series? (scope question, open)
      publisher: SNB
      url: https://data.snb.ch/
      official: true
      notes: >-
        BAZG trade is the Swiss–Liechtenstein customs area, certainly. For
        the SNB cubes staged here (bakredsekbrm bank credit, bopcurra BoP,
        snbimfra reserves, frsek* financial accounts) the research pass and
        the fetch swarm assumed "currency area incl. Liechtenstein", but no
        SNB note was found that says so per cube (searched 2026-10-22).
        Read each cube's methodological notes before a panel claims a
        scope; until then panels name the SNB as the scope.
    - name: spine slots that exist at a harmonised publisher but are not yet fetched
      publisher: BIS / Eurostat / World Bank (UNODC, IMF FSI, PIP)
      url: https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/Q.CH.H.A.M.770.A
      official: true
      notes: >-
        Probed live 2026-10-22, all answer for CH: BIS WS_TC household
        credit % GDP (2025-Q4 122.9; credit slot 1); Eurostat gov_10a_main
        P51G government GFCF % GDP (2022–2025 2.9–3.2; spending slot 4); WB
        VC.IHR.PSRC.P5 UNODC homicide per 100k (2023 0.60; security slot 1);
        WB FB.AST.NPER.ZS bank NPL ratio = IMF FSI (2024 0.83%, all bank
        loans, not households; credit slot 3); WB SH.STA.TRAF.P5 road deaths
        (to 2019 only). The WB US$8.30 poverty line (SI.POV.UMIC) was
        throttled and not confirmed. Add them to fetch_comparables.py /
        fetch_eurostat.py with sidecars before Phase B draws those slots.
    - name: statutory national minimum wage
      publisher: none — Switzerland has no national minimum wage
      url: https://www.seco.admin.ch/
      official: true
      notes: >-
        There is no statutory national minimum wage; a federal initiative
        for one was rejected in the 2014 popular vote. Some cantons have one
        (Neuchâtel, Jura, Ticino, Geneva, Basel-Stadt), set cantonally and
        not comparable as a national figure. People slot 3 states exactly
        that via ctx.pending, as Italy's does — a true statement, not a gap.
    - name: SMI year-ends from a second redistributor
      publisher: SIX Swiss Exchange via redistributors
      url: https://stooq.com/q/d/l/?s=^smi&i=m
      official: false
      notes: >-
        stooq serves its 796-byte JS proof-of-work page under HTTP 200
        (verified 2026-10-22), same as ^tsx/^ibex/^psi. Yahoo ^SSMI is
        staged and complete for the window, so this is a cross-check only.
    - name: Transparency International CPI, WEF competitiveness
      publisher: Transparency International / IMD / WEF
      url: https://www.transparency.org/en/cpi
      official: false
      notes: Hand-curated at build phase, as France/Canada did.

