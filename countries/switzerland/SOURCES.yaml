  gdp_quarterly_from_seco.csv:
    source: SECO — Quartalsschätzungen BIP, real-time database (gdp_cssa sheet)
    url: https://www.seco.admin.ch/dam/de/sd-web/MPCPHCXIDH6N/realtime-database.xlsx
    refreshed_by: fetch/fetch_seco.py
    notes: >-
      3.4MB xlsx, one sheet per variable (gdp_cssa, gdp, cons_priv, exp,
      imp, cpi_*, ur_*, gdp_us/ea/jp…), each a VINTAGE MATRIX: row 9 =
      release date, row 10 = vintage label (2000q2…2026q2), col A = quarter
      start date, CHF millions real, seasonally (and in gdp_cssa sport-event)
      adjusted. openpyxl needs read_only=True plus ws.reset_dimensions()
      (the sheets report a 1×1 dimension and the workbook references a
      missing drawing1.xml that breaks a normal load). Header rows are one
      cell shorter than data rows; the latest populated vintage column is
      the second-to-last (release 2026-06-01, data to 2026Q1: the sidecar
      STOPS AT 2026Q1 although Eurostat namq has 2026Q2). The URL is
      resolved each download from the site's JSON content API
      (/api/collector/de/weiterfuehrende-informationen-bip.json). The
      cached workbook was first placed by hand; consolidation exercised the
      fetcher's own resolve()+get() path live on 2026-10-22 and it returned
      a byte-identical file (sha256 7a3c16a5…), so the cache is honest.
      Delete cache/seco_realtime-database.xlsx to refresh. Verified
      q/q: 2008Q4 −2.1, 2009Q1 −1.5, 2020Q2 −6.4, 2025Q3 −0.4. SPORT-EVENT
      ADJUSTMENT is Swiss-specific: FIFA/IOC/UEFA licence revenue booked in
      Switzerland moves GDP in championship years; gdp_cssa removes it,
      `gdp` keeps it. The file lags SECO's latest release by one quarter.
