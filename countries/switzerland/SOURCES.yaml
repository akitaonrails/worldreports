      COMMA-separated, long format PERIOD,SECTOR,CLASSIFICATION,UNIT_MEAS,
      VALUE,STATUS. UNIT_MEAS: MCHF (CHF millions, current prices), AC
      (nominal % change), ACPP (real % change at previous-year prices).
      Verified: B1GQ MCHF 2006 562,159.6 · 2024 860,932.1 · 2025 881,571.8;
      ACPP 2009 −1.93, 2020 −2.26, 2025 +1.61. The research pass saw rows
      repeated (1995 twice); the current edition does not repeat them, and
      the fetcher still asserts one value per key. STATUS O = missing. Gold
      split: P61 vs P61XF11 (2025 exports of goods 517.5bn vs 365.0bn ex
      gold). THE VINTAGE TRAP: Eurostat/World Bank hold the pre-2026-08
      vintage (see header), equal through 2022, apart from 2023. 2025 is
