      monthly averages: 2006 116.28, 2011 79.78, 2012 79.79, 2015 121.02,
      2022 131.37, 2024 151.50, 2025 149.65; last value Sep-2026 156.23.
      Direction: YEN PER DOLLAR, so a RISING line is a WEAKER yen (same
      direction as Canada's USDCAD, opposite to the UK's USD-per-GBP).
      Daily twin FXERD04.
  reer_from_boj.csv:
    source: Bank of Japan — FM09 FX180110002 (real effective exchange rate, CY2020=100)
