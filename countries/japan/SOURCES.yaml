migration:
  foreign_residents_from_isa.csv:
    source: Immigration Services Agency — 在留外国人統計 (statistics on foreign residents), semi-annual
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040472260&fileKind=0
    refreshed_by: fetch/fetch_isa.py
    notes: >-
      Stock at end-June and end-December by nationality × status of
      residence; period index (lids) on
      https://www.moj.go.jp/isa/policies/statistics/toukei_ichiran_touroku.html
      (labels in FULL-WIDTH digits — NFKC-normalise; end-2025 lid
      000001486479, table 25-12-01-1). Verified end-2025 在留外国人 =
      4,125,395. DEFINITION: mid- to long-term residents (zairyu-card
      holders) plus special permanent residents — it EXCLUDES short-term
      visitors, diplomats and the undocumented; table 25-12-01-2
      (総在留外国人) is the broader total. HARD BREAK July 2012: the alien
      registration system (登録外国人統計) was abolished and the residence
      card started; pre-2012 "registered foreigners" is a different
      definition (it included some short-stayers) — two segments, never
      one line. Three stocks for one idea, all different and all correct:
      ISA 4.13mn (end-2025), Census 3.84mn (1 Oct 2025), estimates'
      total − Japanese. Citizenship-based throughout: Japan publishes no
      country-of-birth cut, so the Eurostat citizenship/birth contrast is
      not available — the plate says so. SIDECAR (consolidation): persons
      at 31 December, 2006–2025, from each end-December edition's table 1
      / 1-2 (YY-12-01-1; 22-12-01 and 23-12-01 in those years) and, for
      2006–2011, the abolished 登録外国人統計 table 1 in registered_*
      columns. The two regimes NEVER share a row (foreign_residents blank
      to 2011, registered_* blank from 2012). foreign_residents_all_statuses
      = 総在留外国人. Nationality columns: 韓国・朝鮮 (residents_korea_incl_
      north) and 韓国 (residents_korea_south, from 2015) are different
      scopes from different editions, never joined. ISA end-2025 ÷ Census
      foreign 1 Oct 2025 = 1.074.
  entrants_from_isa.csv:
    source: Immigration Services Agency — 出入国管理統計 (immigration control statistics), annual, table 25-00-05 新規入国外国人 by status
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040476160&fileKind=4
    refreshed_by: fetch/fetch_isa.py
    notes: >-
      New entrants (first entry, excluding re-entry) by nationality ×
      status of residence. Year index on
      https://www.moj.go.jp/isa/policies/statistics/toukei_ichiran_nyukan.html
      (CORRECTED: the 2025 lid is 000001486941, not …942; the
      foreign-national tables sit under tclass1=000001012481, the
      procedures tables under …482). The table numbers move: new entrants
      are YY-00-07 and all entrants YY-00-06 through 2021, YY-00-05 and
      YY-00-04 from 2022; picked by title. SIDECAR 2006–2025: entrants_all
      (incl. re-entry), new_entrants, new_entrants_short_stay and
      new_entrants_non_short_stay (computed = new − short stay).
      Verified 2025 total new entrants 39,184,525, of which 短期滞在
      (temporary visitors — tourists) 38,458,105 → NON-short-stay new
      entrants 726,420. Only the latter is migration; a chart of the
      headline total is a tourism chart. 2021–2022 are the border-closure
      collapse (151,726 in 2021). Departures (25-00-06) are events, not
      emigrants. An entry is an event, not a person.
  naturalisation_from_moj.csv:
    source: MOJ Civil Affairs Bureau — 帰化許可申請者数、帰化許可者数及び帰化不許可者数の推移
    url: https://www.moj.go.jp/content/001458302.pdf
    refreshed_by: fetch/fetch_isa.py
    notes: >-
      PDF table from 1952, page https://www.moj.go.jp/MINJI/toukei_t_minj03.html.
      Verified 2025: applications 14,103, granted 9,258 (Korea/North Korea
      2,017, China 3,533, other 3,708), refused 666; 2006 granted 14,108.
      The flow that moves people from the foreign-resident stock to the
      Japanese count without anybody moving — drawn beside the stock.
      SIDECAR 2006–2025: applications, granted (with former nationality:
      韓国・朝鮮 as one category, China, other), refused — decisions on
      different cohorts, not one cohort's outcome. Grants 2023–2025 are
      cross-checked against the by-nationality PDF (001458303.pdf).
  asylum_from_unhcr.csv:
    source: UNHCR Refugee Data Finder API — asylum-applications and asylum-decisions, coa=JPN
    url: https://api.unhcr.org/population/v1/asylum-applications/?coa=JPN&yearFrom=2006&yearTo=2025&cf_type=ISO
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      JSON, items per year × procedure × app_type (N = new, A = appeal) ×
      dec_level (FI first instance, AR appeal/review). Verified 2022 new
      first-instance applications 3,772, appeals 4,461; 2023 new 13,823.
      decisions endpoint returns recognised / complementary ("other") /
      rejected / closed. Applications, decisions, recognitions and people
      present are four numbers, never one line; the national ISA count is
      meta.pending. CORRECTED at consolidation — a BREAK IN 2021: from 2021
      UNHCR reports positive decisions for Japan only at level FA (final,
      all instances combined), written to decisions_final_recognized /
      decisions_final_other; the FI and appeal recognized/other cells are
      blank from 2021 (the API's 0 there is a convention, not an outcome)
      and FI/appeal *_total from then count negative and closed decisions
      only. Blank = no row in the API, not zero. 2024 final recognized =
      1,857 against 187 in 2025 and 289 in 2023: almost certainly ISA's
      refugee recognitions (~190) plus complementary protection (~1,661)
      in one cell — unverified, see meta.pending.
      Decisions endpoint: https://api.unhcr.org/population/v1/asylum-decisions/?coa=JPN&yearFrom=2006&yearTo=2025&cf_type=ISO

