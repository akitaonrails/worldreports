      (2024 = 123,802; −550k, the 14th consecutive fall). THE RE-BASING
      TRAP: the 2025 Census (published 2026-09-29) counts 122,973k on
      1 Oct 2025, while the estimates still run on the 2020-census base
      (the monthly release of 2026-10-20 is "2026年5月令和2年国勢調査を基準
      とする確定値"; 1 Oct 2026 provisional 122.69mn). The 2021–2025
      estimates will be intercensally revised onto the 2025 census later;
