      2006 X 75,246,173,392 / M 67,344,293,072; 2024 X ¥107.09tn / M
      ¥112.72tn; 2025 X ¥110.40tn / M ¥113.33tn. THE MONTHLY FILE
      ZERO-FILLS THE FUTURE: d41ma.csv carries 2026/09 … 2026/12 as
      "0 ,0" — a presence test would count twelve months in October.
      2026 has 8 real months today; the fetcher counts non-zero months
      (zeros must be strictly trailing) and the plate says "2026: 8 of 12
      months". Customs value goods only (exports FOB, imports CIF) — NOT
      the BoP series below; never spliced. SIDECAR: ¥ BILLION (÷1,000,000
