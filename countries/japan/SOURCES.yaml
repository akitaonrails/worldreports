  current_account_from_boj.csv:
    source: Bank of Japan / MOF — Balance of Payments (BPM6), BP01 BPBP6JYNCB
    url: https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=json&lang=en&db=BP01&code=BPBP6JYNCB&startDate=200601
    refreshed_by: fetch/fetch_boj.py
