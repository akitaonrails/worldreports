# Data provenance — every planned series for Japan.
#
# Written 2026-10-22 BEFORE any CSV exists, as the research pass prescribes;
# the fetch swarm then stages each `*_from_*` sidecar under data/. Nothing
# here is curated yet.
#
# CORRECTED at consolidation (2026-10-22) to what the eleven fetchers
# actually read and write: every entry below has a sidecar and every
# sidecar an entry. Where a note gives a unit, it is the SIDECAR's unit
# (most yen series are converted to ¥ billion by the fetcher; the
# published unit is named beside it). DATA_NOTES.md carries the
# cross-file caveats; where DISCOVERY.md disagrees with this file, this
# file is right.
#
# Every endpoint below was curled live on 2026-10-22 and the payload shape
# recorded in the notes. The pending block under `meta` is for publishers
# that exist but could not be reached or staged this session — the page's
# sources table ignores `meta`.
#
# THE e-STAT TRAP, which almost every Statistics Bureau / MHLW / ISA / NPA
# entry depends on. e-Stat (www.e-stat.go.jp) is the national portal for
# nearly every ministry's statistics. Its API (api.e-stat.go.jp/rest/3.0)
# REQUIRES a registered application ID: without one, every call returns
# HTTP 200 with {"RESULT":{"STATUS":100,"ERROR_MSG":"認証に失敗しました。
# アプリケーションIDを確認して下さい。"}} — an auth failure dressed as a
# success. No appId exists on this machine and none was registered (that
# is a person's decision: registration needs an email account at
# https://www.e-stat.go.jp/mypage/user/preregister). It is NOT needed for
# v1: e-Stat's FILE layer is anonymous —
#   https://www.e-stat.go.jp/stat-search/file-download?statInfId={12 digits}&fileKind={0|1|4}
# (0 = Excel, 1 = CSV, 4 = Excel "report" layout) returns the file with a
# content-disposition filename, and the listing pages
#   https://www.e-stat.go.jp/stat-search/files?page=1&layout=datalist&lid={lid}
# are scrapeable HTML from which statInfIds are read. statInfIds are
# per-edition (a new one each release), so fetchers resolve them from the
# listing page at fetch time and assert the table number and title they
# expect; the ids written below are today's, for the record.
#
# Other cross-cutting quirks every Japanese fetcher must handle:
#   - Shift_JIS (cp932) is the default encoding of CSVs and many HTML
#     pages (customs, MOF, stat.go.jp CSVs, e-Stat CSV downloads); xlsx
#     is UTF-8 inside. Decode explicitly; never trust the header.
#   - Japanese era dates (wareki): 昭和/平成/令和 year labels, often with
#     the era written once and the year number alone after it (MHLW long
#     series), or "S49.9.24"/"H18.1.4"/"R8.9.30" (MOF JGB CSV). R1 = 2019,
#     H1 = 1989, S1 = 1926. Convert with an explicit table and assert a
#     known date.
#   - Units are Japanese myriads: 万人 (10,000 persons — the LFS), 億円
#     (100 million yen — BoJ, MOF), 千円 (1,000 yen — customs, MOF
#     settlement tables), 10億円 (¥bn — national accounts). An
#     order-of-magnitude error is one misread header away.
#   - Fiscal year = April–March, keyed on the STARTING year
#     (`fiscal_year: 2024` = Apr 2024 – Mar 2025), as Canada/UK/USA.
#
# NOTES FOR PHASE B (recorded, not acted on — the brief forbids it here):
#   - `ja` is a NEW locale. core/sitebuild.py AFFIX needs a `ja` column
#     for every spec (en/fr/pt/es/ko today), CURRENCY_AFFIX needs JPY
#     (no decimals; ¥ prefix in en/pt, 兆円/億円 suffix units in ja), and
#     site/ui.json needs `ja` chrome. test_every_locale_can_be_formatted and
#     test_the_currency_is_one_the_site_can_write fail until then — intended.
#   - core/style.py's script-font table has `ko` but no `ja`: add
#     "ja": ["Noto Sans CJK JP", ...]. matplotlib on this machine sees
#     "Noto Sans CJK JP" and "Noto Serif CJK JP" (verified), so JP is the
#     native face here, not a fallback.
#   - Every OTHER country's country.yaml needs a `name.ja` entry once a
#     page publishes in ja (test_the_comparison_names_every_country_in_
#     every_language) — e.g. フランス, ブラジル, アルゼンチン, 韓国, 米国,
#     カナダ, スペイン, 英国, イタリア, ポルトガル.
#   - Wordmark 日本 with mark_bearing 0 (CJK em box, Hangul precedent).

meta:
  pending:
    - name: e-Stat API (database layer)
      publisher: Statistics Bureau of Japan / National Statistics Center — e-Stat API v3
      url: https://api.e-stat.go.jp/rest/3.0/app/json/getStatsData
      official: true
      notes: >-
        Needs an application ID (appId). Verified 2026-10-22: getStatsList
        and getStatsData without one, and with appId= empty, both answer
        HTTP 200 with RESULT.STATUS 100 "認証に失敗しました。アプリケーション
        IDを確認して下さい。" (authentication failed, check the application
        ID). Registration is free but needs a person's email account; it
        was not done. Every series in this manifest is reachable through
        the anonymous FILE layer instead (see header), so nothing blocks.
        With an appId, the DB tables (e.g. 人口動態統計 year-series and the
        普通貿易統計 by-partner cube) would replace several per-year file
        loops. A fetcher that ever uses the API must treat STATUS != 0 as
        failure regardless of the HTTP code.
    - name: BoJ policy-rate target (the decided rate, not the market rate)
      publisher: Bank of Japan — Statements on Monetary Policy
      url: https://www.boj.or.jp/en/mopo/mpmdeci/index.htm
      official: true
      notes: >-
        The Time-Series API carries the REALISED uncollateralised overnight
        call rate (FM01/FM02) and the basic loan rate (IR01), but no series
        for the policy target, and the target itself changed kind three
        times inside the window: an overnight-call target to 2013, the
        monetary base (QQE) April 2013 – Sept 2016, the −0.1% rate on the
        Policy-Rate Balance plus yield-curve control Jan 2016 – Mar 2024,
        then an overnight-call target again (0–0.1% Mar-2024, 0.25%
        Jul-2024, 0.5% Jan-2025, and — read off the realised call rate,
        unverified against the statements — about 0.75% from Dec-2025 and
        1.0% from mid-2026). Hand-curate the decision dates and levels from
        the statements at build time; draw the realised rate as the line
        and the regimes as annotated segments, never as one series.
        Consolidation read of the staged data (still unverified against the
        statements): the daily call rate (FM01) steps to ~0.727 on
        2025-12-22, ~0.978 on 2026-06-17 and ~1.227 on 2026-09-24, and the
        basic loan rate (IR01, = target + 0.25 since 2024) reads 1.0 from
        Dec-2025, 1.25 from Jun-2026 and 1.5 from Sep-2026 — i.e. targets of
        0.75%, 1.0% and 1.25%. The discovery list stopped at 1.0%. The
        Sep-2026 monthly call-rate average (1.043) straddles the hike.
    - name: Monthly Labour Survey (wages, real wage index)
      publisher: MHLW — 毎月勤労統計調査 (toukei 00450071)
      url: https://www.e-stat.go.jp/stat-search/files?page=1&toukei=00450071&tstat=000001011791
      official: true
      notes: >-
        Listing verified live; the long-series file statInfId was not
        pinned this session (the tree is five levels deep). Known break to
        annotate: the 2019 irregular-sampling scandal — large Tokyo
        establishments were sampled at one third from 2004 without
        reweighting; MHLW re-estimated only from 2012, so pre-2012 levels
        are not comparable with the corrected series. Two segments, never
        a splice.
    - name: asylum applications and recognitions, national count
      publisher: Immigration Services Agency — annual press release 我が国における難民庇護の状況等
      url: https://www.moj.go.jp/isa/refugee/index.html
      official: true
      notes: >-
        ISA publishes asylum numbers as an annual press-release PDF, not as
        an e-Stat table; the release URL was not located from the refugee
        index page or the press index (/isa/publications/press/index.html)
        at discovery or consolidation. Staged instead: the UNHCR Refugee
        Data Finder API (migration/asylum_from_unhcr.csv). Hand-curate the
        ISA figures (applications, first-instance recognitions,
        complementary protection from Dec-2023, humanitarian permission to
        stay) when the migration plate is built — four numbers, never one.
        This is now NEEDED, not optional: UNHCR's 2024 final-level
        "recognized" is 1,857, which looks like ISA's refugee recognitions
        (~190) PLUS complementary protection (~1,661, mostly Ukrainians)
        folded into one cell; 2025 drops back to 187. Unverified against
        the ISA release — do not draw UNHCR's 2024 recognitions as refugee
        status until it is checked.
    - name: Japanese nationals living abroad (the emigration side)
      publisher: MOFA — 海外在留邦人数調査統計
      url: https://www.mofa.go.jp/mofaj/toko/page22_003338.html
      official: true
      notes: >-
        HTTP 403 from this machine on 2026-10-22. Japan has no emigration
        register: ISA's 出国日本人 counts departures (mostly travel), not
        emigrants. MOFA's annual count of Japanese residing abroad (stock,
        1 October) is the only national measure of the other side. Retry
        with a browser UA from another network or hand-curate.
    - name: Transparency International CPI
      publisher: Transparency International
      url: https://www.transparency.org/en/cpi
      official: false
      notes: Hand-curated at build phase, France/Canada pattern.

macro:
  gdp_from_esri.csv:
    source: Cabinet Office ESRI — Quarterly Estimates (QE), 2026 Apr–Jun second preliminary, gaku-mcy / gaku-mfy / gaku-jcy
    url: https://www.esri.cao.go.jp/jp/sna/data/data_list/sokuhou/files/2026/qe262_2/tables/gaku-mcy2622.csv
    refreshed_by: fetch/fetch_esri.py
    notes: >-
      Expenditure-side GDP, 2020 benchmark (2020-base chained yen, 2008
      SNA), ¥ BILLIONS (10億円), Shift_JIS CSV with a five-row bilingual
      header; row labels "2024/1-12." (calendar) and fiscal-year twins in
      gaku-mfy. Verified: nominal CY2024 = ¥636,893.3bn, CY2025 =
      ¥666,440.7bn, CY2006 = ¥540,566.0bn. Real (gaku-jcy) is chained 2020
      yen. THE RELEASE DIRECTORY MOVES every QE (qe262_2 = 2026 Q2 second
      preliminary, published 2026-09-08; the file suffix 2622 changes
      with it): resolve the current menu from
      https://www.esri.cao.go.jp/jp/sna/sokuhou/sokuhou_top.html, never
      hardcode. The 2020 benchmark revision (late 2025) raised nominal
      levels against the 2015-base vintage; never mix vintages. Calendar
      and fiscal-year totals are separate files and separate columns.
      SIDECAR (consolidation): 1994–2025, ¥bn; *_cy columns from
      gaku-mcy/gaku-jcy and *_fy columns (FY keyed on its starting year)
      from gaku-mfy/gaku-jfy; nominal CY expenditure components
      (consumption, residential, non-residential, government consumption,
      public investment, exports, imports) and GNI. The fetcher asserts the
      spot values above and that ESRI CY2024 ÷ BoJ's 151.50 lands within
      1.5% of the World Bank (it is +0.33%).
  gdp_quarterly_from_esri.csv:
    source: Cabinet Office ESRI — QE real seasonally adjusted series, gaku-jk
    url: https://www.esri.cao.go.jp/jp/sna/data/data_list/sokuhou/files/2026/qe262_2/tables/gaku-jk2622.csv
    refreshed_by: fetch/fetch_esri.py
    notes: >-
      Real GDP, SA, chained 2020 yen, ¥bn, 1994 Q1 – 2026 Q2. ANNUALISED:
      the header says "＊年率で表示している" — the quarterly levels are at
      annual rates (2026 Q2 = ¥598,950.5bn), so the annual figure is the
      MEAN of four quarters, never the sum. Quarter labels "2007/ 1- 3."
      carry the year only on Q1 rows ("4- 6.", "7- 9.", "10-12." follow).
      This is the series the bands in country.yaml were dated from
      (q/q sign, today's vintage). Raw (non-SA) twins are gaku-jg/gaku-mg.
      SIDECAR (consolidation): real (gaku-jk) and nominal (gaku-mk) SA
      levels at annual rates, plus ESRI's PUBLISHED q/q % changes
      (ritu-jk, ritu-mk) and published annualised real rate (nritu-jk) —
      not computed here. Quarter labels written YYYY-Qn. The 2024 H1 band
      rests on −0.1 / −0.1 published (−0.4 / −0.5 annualised).
  cpi_from_stat.csv:
    source: Statistics Bureau of Japan (MIC) — Consumer Price Index, 2020-base and 2025-base national long series (e-Stat 中分類指数 and 前年同月比)
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000032103842&fileKind=1
    refreshed_by: fetch/fetch_stat.py
    notes: >-
      CORRECTED at consolidation: the sidecar is built from e-Stat's long
      monthly series on EACH base (2020=100: index statInfId 000032103842,
      published 12-month rates 000032103932; 2025=100: 000040482943 and
      000040482953 — ids are per edition and resolved from the listing on
      every run), 2006-01 → 2026-08. The *_yoy_pct columns are the
      PUBLISHED rates, not computed. stat.go.jp's three-decimal files
      (zmi2020aa / zmi2025aa) are only the month-by-month check. Columns
      all / core (ex fresh food) / corecore (ex fresh food and energy) per
      base. The 2025-base rates before 2026 repeat the 2020-base published
      rates (240 of 240 months identical); 3 months of 2026 differ, so a
      rate line stays on one base. What discovery recorded follows.
      Monthly index, Shift_JIS CSV, one column per item (col 1 総合 all
      items, 生鮮食品を除く総合 "core" ex-fresh-food, 持家の帰属家賃を除く
      総合 ex-imputed-rent). Three files, verified: zmi2020aa.csv (2020=100,
      3 decimals, 2020-01 → 2026-08); zmi2025aa.csv (2025=100, from
      2025-01 → 2026-08 — the CPI was REBASED to 2025 in 2026; both bases
      are being published in parallel); and the long rounded series
      zmi2020s.csv from 1970-01 via e-Stat
      (file-download?statInfId=000032103842&fileKind=1). Annual-average
      check from the 2020-base file: 2022 +2.5%, 2023 +3.3%, 2024 +2.7%,
      2025 +3.2% (computed from the rounded index; the official annual
      rates are computed from unrounded indices and can differ by a tenth
      — take the published rate where it is published). The rebase seam
      is annotated; rates are taken within one base, never across the seam.
      Headline vs "core" (ex fresh food, the BoJ's reference) are two
      columns.
  cpi_tokyo_from_stat.csv:
    source: Statistics Bureau of Japan — CPI, Tokyo ku-area (preliminary), 2025 base, e-Stat long series
    url: https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040482965&fileKind=1
    refreshed_by: fetch/fetch_stat.py
    notes: >-
      CORRECTED at consolidation: from the e-Stat 2025-base Tokyo long
      series (index 000040482965, published rates 000040482975), checked
      against stat.go.jp's tmi2025aa.csv; 2006-01 → 2026-09. Same columns
      as the national file, 2025 base only; before 2026 its rates repeat
      the rates first published on the 2020 base. Runs one month ahead
      (2026-09 present on 2026-10-22, national stops at 2026-08). Tokyo
      only — a leading indicator, never drawn as the national rate.

fiscal:
  tax_revenue_from_mof.csv:
    source: MOF — 一般会計税収の推移 (general-account tax revenue since FY1979)
    url: https://www.mof.go.jp/tax_policy/summary/condition/zeisyu.xls
    refreshed_by: fetch/fetch_mof.py
    notes: >-
      Legacy .xls, published in ¥100 MILLION (億円); the SIDECAR is ¥
      BILLION (÷10). FISCAL years keyed by era year and Western year (both
      in the sheet, asserted to agree), FY1979–FY2025. Columns:
      general-account tax revenue, income tax, corporation tax, consumption
      tax (blank before FY1989). Verified FY2006 = 490,691 (¥49.1tn),
      FY2024 = 752,321 (¥75.2tn), FY2025 = 842,226. RESOLVED at fetch:
      FY2025 IS the settlement — the fetcher reads the 令和7年度決算概要
      予算決算比較表 PDF (pdftotext) and asserts zeisyu's last row equals
      its settlement 税収. Equals general_account_from_mof.csv
      tax_settlement in every overlapping year. Read with an in-fetcher
      BIFF8 reader (no xlrd). NATIONAL general account only — not local
      taxes, not social contributions, not general government.
  general_account_from_mof.csv:
    source: MOF — 財政統計 第1表 明治初年度以降一般会計歳入歳出予算決算 (and 第2表 from FY1963)
    url: https://www.mof.go.jp/policy/budget/reference/statistics/01.xlsx
    refreshed_by: fetch/fetch_mof.py
    notes: >-
      Budget and settlement of the general account by fiscal year. The
      statistics page (…/statistics/data.htm) lists 01.xlsx … 35.xlsx with
      a table number each (第1表 … 第34表; 19a/19b split one table); the
      file number is not the table number everywhere, so the fetcher picks
      the link by its 第N表 label and asserts the title and unit cells.
      CORRECTED at consolidation — three tables, three units: 第1表 totals
      in ¥1,000 (千円); 第4表 一般会計歳入主要科目別決算 (tax incl. stamp
      revenue, 公債金 bond revenue) in ¥ MILLION (百万円), not ¥1,000;
      第20表 主要経費別 (国債費 debt service, 社会保障関係費) in 千円. The
      SIDECAR converts all to ¥ BILLION. bond_dependency_pct = bond revenue
      ÷ settled expenditure, computed. FY2025 has budget columns only (its
      settlement is not yet in the statistics tables); FY2005's settlement
      is missing from table 1 itself. Settlement (決算) and budget (予算)
      are different columns; plates draw settlement and label FY.
  gg_accounts_from_esri.csv:
    source: Cabinet Office ESRI — Annual national accounts FY2024 (2020 base), table 6(2) 一般政府の部門別勘定
    url: https://www.esri.cao.go.jp/jp/sna/data/data_list/kakuhou/files/2024/tables/2024s6_2_jp.xlsx
    refreshed_by: fetch/fetch_esri.py
    notes: >-
      General government sector accounts, FISCAL years 1994–2024, ¥bn,
      two sheets (経常・資本取引 current and capital transactions;
      金融資産・負債 financial transactions). Each fiscal year spans
      several columns — central government, local government, social
      security funds, consolidation and general government — so the
      fetcher maps the column header block before reading; verified that
      net lending/borrowing (純貸出/純借入) is present. The FY2025 annual
      estimate is due December 2026 (2025_kaku_top.html is 404 today).
      This is the national-accounts deficit; MOF's general account is a
      different (narrower, cash) object. Two files, never spliced.
      SIDECAR (consolidation): table 6-2 is the GFS layout (IMF GFSM 2014),
      FY1994–FY2024, ¥bn. gg_* = consolidated general government: revenue,
      taxes, social contributions, expense (incl. consumption of fixed
      capital), interest, social benefits, net operating balance, net
      acquisition of non-financial assets, net lending (= NOB − NANFA; the
      financial account's own net-lending row differs by a statistical
      discrepancy and is not used), and END-YEAR balance-sheet stocks at
      market value (financial assets, liabilities, net financial worth;
      social-security pension entitlements are not recorded as
      liabilities). central/local/ssf net lending are the unconsolidated
      subsectors. FY2024 net lending −1.4% of FY GDP (IMF CY2024 −1.7).
  cofog_from_esri.csv:
    source: Cabinet Office ESRI — Annual national accounts FY2024, table 7 一般政府の機能別支出 (COFOG)
    url: https://www.esri.cao.go.jp/jp/sna/data/data_list/kakuhou/files/2024/tables/2024s7_jp.xlsx
    refreshed_by: fetch/fetch_esri.py
    notes: >-
      General-government expenditure by function, ONE SHEET PER FISCAL
      YEAR named in wareki (平成１７ … 令和６ = FY2005 … FY2024), ¥bn.
      Table 8 (2024s8_jp.xlsx) is final consumption by function — a
      subset, not the same thing. Social protection dominates (ageing);
      the spending plate says so. SIDECAR (consolidation): FY2005–FY2024,
      ten COFOG divisions. ESRI PUBLISHES NO TOTAL COLUMN: each function's
      figure is the sum of the seven published transaction columns (final
      consumption, subsidies, social benefits other than in kind, other
      current transfers, GFCF, inventories, capital transfers), computed
      by the fetcher, which asserts the ten functions add to ESRI's 合計
      row in every column. Interest and net land purchases are not in the
      table and GFCF is, so total_expenditure is a different aggregate
      from the GFS expense in gg_accounts_from_esri.csv.
  central_debt_from_mof.csv:
    source: MOF — 国債及び借入金並びに政府保証債務現在高, 最近5年間の推移
    url: https://www.mof.go.jp/jgbs/reference/gbb/suii.xls
    refreshed_by: fetch/fetch_mof.py
    notes: >-
      Central-government debt at FACE value, quarter-ends, published in
      ¥100 MILLION; the SIDECAR is ¥ BILLION. CORRECTED at consolidation:
      total = 内国債 (JGBs: general bonds, FILP bonds, other) + 借入金
      borrowings + 政府短期証券 financing bills, and it EXCLUDES
      government-guaranteed debt (政府保証債務), which is a contingent
      liability in its own column — not "plus guaranteed debt" as first
      written. general_bonds and filp_bonds are parts of jgb. Verified
      June 2026 total = 13,466,833 (¥1,346.7tn), Dec-2006 ¥832.3tn.
      HISTORY RESOLVED (no longer pending): the live suii.xls carries five
      years (Sept 2021 → June 2026); 2006–2021 come from MOF's own earlier
      editions in the National Diet Library web archive (WARP captures
      20160205, 20190501 and 20230501 of suii.xls, and for 2006–2010 the
      per-quarter HTML pages of the 20110328 capture). Every quarter is
      taken from the newest edition carrying it, overlaps are asserted to
      agree (they do, to 0 億円), and an `edition` column names the source
      of each row. CENTRAL government — the third of Japan's debts; see
      the IMF and flow-of-funds entries.
  gg_liabilities_from_boj.csv:
    source: Bank of Japan — Flow of Funds (2008 SNA), General government, stocks (L900 − L700 liabilities; L300, L200, A900, L700)
    url: https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=json&lang=en&db=FF&code=FOF_FFAS420L900,FOF_FFAS420L700,FOF_FFAS420A900,FOF_FFAS420L300,FOF_FFAS420L200&startDate=200601
    refreshed_by: fetch/fetch_boj.py
    notes: >-
      CORRECTED at consolidation — the discovery note was wrong.
      FOF_FFAS420L900 "Liabilities/Total/General government" is NOT the
      government's liabilities: a flow-of-funds liabilities column closes
      on L700 "Difference between financial assets and liabilities", so
      L900 equals total financial ASSETS (A900) to the unit every quarter
      (2025 Q4: 9,486,308 both — the ¥948.6tn first recorded here as the
      debt is the asset side). Liabilities proper = L900 − L700 =
      13,992,259 (¥1,399.2tn) at 2025 Q4. Verified independently at
      consolidation against the API: the nine general-government liability
      instruments (L200 loans, L300 debt securities, L334 equity, L340
      derivatives, L500 deposits money, L510 trade credits, L520 accounts
      payable, L550 other external, L600 others) sum to exactly L900 − L700
      in 2006 Q4, 2016 Q4 and 2025 Q4. Published in ¥100 MILLION; SIDECAR
      in ¥ BILLION, one row per year at its December quarter (running year
      at its latest quarter, asof_quarter), columns gg_liabilities,
      debt_securities (L300) and loans (L200) as parts, gg_financial_assets
      (A900) and net_financial_position (L700). The annual end-March twin
      FOF_FFYS420L900 is asserted to equal the March quarter. Securities at
      MARKET value and the flow-of-funds consolidation: 2024 ¥1,443.6tn =
      227% of CY GDP, against MOF's face-value central debt (207%) and the
      IMF gross general-government debt (213.6%). Three debts, three files;
      the plate never draws one as if it were another.

markets:
  rates_from_boj.csv:
    source: Bank of Japan — Time-Series Data Search API, FM02 STRACLUCON / FM01 STRDCLUCON / IR01 MADR1M
    url: https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=csv&lang=en&db=FM02&code=STRACLUCON&startDate=200601
    refreshed_by: fetch/fetch_boj.py
    notes: >-
      The BoJ API (anonymous, no key; manual at
      https://www.stat-search.boj.or.jp/info/api_manual_en.pdf; ≤250
      series and ≤60,000 data points per request, NEXTPOSITION for paging,
      "excessive access may be restricted") returns JSON or CSV: an 11-line
      STATUS/PARAMETER preamble, then rows SERIES_CODE, NAME (quoted,
      contains commas — use a CSV parser), UNIT, FREQUENCY, CATEGORY,
      LAST_UPDATE, SURVEY_DATES, VALUES. STATUS 200 + MESSAGEID M181000I
      is success; assert it. Verified STRACLUCON (uncollateralised
      overnight call, monthly average, % p.a.): Dec-2006 0.255, Dec-2016
      −0.044 (negative-rate era), Mar-2024 0.022, Aug-2024 0.227, Feb-2025
      0.478, Dec-2025 0.557, Sep-2026 1.043. This is the REALISED rate;
      the decided target is meta.pending. MADR1M is the basic loan rate
      (the old official discount rate). SIDECAR: calendar years,
      call_rate_avg (mean of the monthly averages), call_rate_dec, and the
      basic loan rate; FM01 STRDCLUCON (daily) is fetched only to check
      that its monthly means reproduce FM02, never written.
  usdjpy_from_boj.csv:
