  household_debt_from_boj.csv:
    source: Bank of Japan — Flow of Funds, Households, Liabilities/Loans (FOF_FFAS430L200), housing loans (L241), consumer credit (L242)
    url: https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=json&lang=en&db=FF&code=FOF_FFAS430L200,FOF_FFAS430L241,FOF_FFAS430L242&startDate=200601
    refreshed_by: fetch/fetch_boj.py
    notes: >-
      SIDECAR: ¥ BILLION (published ¥100 MILLION ÷ 10), one row per year
      at its December (Q4) stock, running year at its latest quarter
      (asof_quarter); housing loans and consumer credit are parts of
      loans. Loans 2024 Q4 = 59.2% of CY GDP; BIS WS_TC households+NPISH
      (market value, 4-quarter GDP) 61.8% (checked live at consolidation,
      not staged). Quarterly stocks, ¥100 MILLION; the FF database metadata is 8.7MB
      (34,714 rows) — fetch by code, never the whole DB. Verified 2025 Q4
      household loans 3,884,339 (¥388.4tn), of which private housing
      loans 2,209,066; 2006 Q4 3,147,719. Stocks — never summed across
      quarters. The debt-to-income ratio needs household disposable
      income from the ESRI annual accounts (household sector table, FY)
      — the ratio's two halves are on different period conventions
      (quarter-end stock vs fiscal-year flow) and the plate says which.

