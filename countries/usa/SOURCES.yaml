# Data provenance — every series in this repo.
#
# The committed CSVs under data/ are the source of truth for the charts.
# Where a public official API exists, fetch/fetch_*.py can refresh them;
# fetchers write to *_from_api.csv / *_from_omb.csv sidecars so curated data
# is never clobbered, and fetch/curate.py is the deliberate step that
# accepts a sidecar into the committed file.
#
# FRED is deliberately absent. It was unreachable for the whole of this
# build, and every series below is taken from the body that produces it
# rather than from an aggregator — which is the better arrangement anyway.
#
# Retrieved: 2026-10-21.

macro:
  economy_wdi.csv:
    source: 'World Bank — World Development Indicators (NE.GDI.FTOT.ZS, SL.UEM.TOTL.ZS)'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/NE.GDI.FTOT.ZS?format=json'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of economy_from_wb.csv. gfcf_pct_gdp, whole-economy
      gross fixed capital formation % of GDP, is the spine's investment
      rate (spending slot 3). unemployment_pct is the ILO modelled estimate,
      kept as a cross-check of the BLS headline rather than drawn.
  gdp.csv:
    source: Bureau of Economic Analysis — NIPA tables 1.1.1, 1.1.5, 7.1
    url: https://apps.bea.gov/national/Release/XLS/Survey/Section1All_xls.xlsx
    refreshed_by: fetch/fetch_bea.py
    notes: >-
      nominal_usdbn is A191RC, real_growth A191RL, gdp_per_capita_usd A939RC
      and population_mn B230RC. Current-dollar quarterly NIPA series are
      SEASONALLY ADJUSTED ANNUAL RATES, so an annual figure is the MEAN of
      its quarters and not their sum. 2026 is built from 2 published
      quarters and is drawn and labelled as a part year.
  cpi.csv:
    source: Bureau of Labor Statistics — CPI-U, series CUUR0000SA0 and CUUR0000SA0L1E
    url: https://api.bls.gov/publicAPI/v1/timeseries/data/CUUR0000SA0
    refreshed_by: fetch/fetch_bls.py
    notes: >-
      The annual index is BLS's own M13 annual average where it is
      published, otherwise the mean of the published months. December 2025
      carries no October value: the October 2025 CPI was cancelled by the
      shutdown and BLS states it cannot be collected retroactively.
  unemployment.csv:
    source: Bureau of Labor Statistics — Current Population Survey, LNS14000000 (U-3) and LNS13327709 (U-6); CES0000000001 payrolls
    url: https://api.bls.gov/publicAPI/v1/timeseries/data/LNS14000000
    refreshed_by: fetch/fetch_bls.py
    notes: >-
      2025 has ELEVEN months, not twelve. The October 2025 household survey
      was never collected because of the 43-day shutdown and BLS says it
      cannot be collected retroactively, so October 2025 has no
      unemployment rate and never will. The `months` column records the
      count and the plate says so in words. U-3 is a SUBSET of U-6 and is
      labelled as one wherever both are drawn.
  fed_funds.csv:
    source: Federal Reserve Bank of New York — effective federal funds rate and the FOMC target
    url: https://markets.newyorkfed.org/api/rates/unsecured/effr/search.json
    refreshed_by: fetch/fetch_rates.py
    notes: >-
      The TARGET is the policy series and the average is the market one.
      effr_last is kept but never used as a headline: EFFR can dislocate on
      the final business day of a year — it printed 3.06% on 31 December
      2007 against a 4.25% target.
  treasury.csv:
    source: US Department of the Treasury — daily par yield curve
    url: https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all
    refreshed_by: fetch/fetch_rates.py
    notes: >-
      spread_10y_2y_avg is the average over the year, which says whether
      the curve was inverted for the year rather than merely on its last
      day. The 30-year was not issued between 2002 and 2006, so each tenor
      keeps its own series and a missing tenor does not drop the day.
  dollar.csv:
    source: Federal Reserve Board — H.10, broad nominal dollar index
    url: https://www.federalreserve.gov/releases/h10/summary/jrxwtfb_nm.htm
    refreshed_by: fetch/fetch_rates.py
    notes: >-
      Based at JANUARY 2006 = 100, which is the first month of this atlas.
      broad_index_dec is December specifically, not the latest month: a
      part year has no year-end reading and passing September off as one
      would be a silent lie. The Board's Data Download Program is not used
      because it serves nothing without an opaque package hash.
  mortgage.csv:
    source: Freddie Mac — Primary Mortgage Market Survey
    url: https://www.freddiemac.com/pmms/docs/PMMS_history.csv
    refreshed_by: fetch/fetch_rates.py
    notes: >-
      Freddie Mac is a government-sponsored enterprise under FHFA
      conservatorship, not a federal agency. There is no federal-agency
      series for the retail mortgage rate since FHFA retired the Monthly
      Interest Rate Survey, so this is the published series. Weekly, so a
      year is the average of its weeks and the count is recorded.
  economy_from_wb.csv:
    source: 'World Bank — World Development Indicators (NE.GDI.FTOT.ZS, SL.UEM.TOTL.ZS)'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/NE.GDI.FTOT.ZS?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      gfcf_pct_gdp is whole-economy gross fixed capital formation, % of
      GDP (spending slot 3). unemployment_pct is the ILO modelled
      estimate, % of the labour force — harmonised, and not the national
      LFS headline, which stays the national line. Columns:
      gfcf_pct_gdp, unemployment_pct.

fiscal:
  general_government.csv:
    source: 'IMF — World Economic Outlook and Fiscal Monitor, via DataMapper (GGR_G01_GDP_PT, G_X_G01_GDP_PT, GGXCNL_NGDP, GGXONLB_G01_GDP_PT, GGXWDG_NGDP)'
    url: 'https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of general_government_from_imf.csv: general
      government (federal, state and local), % of GDP, calendar years.
      This is the spine's canonical fiscal perimeter. The federal budget
      in budget.csv and debt.csv is the national line drawn beside it: a
      narrower perimeter on a fiscal year ending 30 September. 2025 may be
      an IMF estimate.
  interest.csv:
    source: 'OECD — annual national accounts, Table 12 (government deficit/surplus, revenue, expenditure), OECD.SDD.NAD,DSD_NASEC10@DF_TABLE12_EXP, S13 D41 payable'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NASEC10@DF_TABLE12_EXP,/A.USA.S13..D.D41..........'
    refreshed_by: fetch/fetch_oecd.py, fetch/curate.py
    official: false
    notes: >-
      General-government interest payable (SNA D41), US$ millions at
      current prices; the plate divides by BEA nominal GDP (gdp.csv). It
      runs 1-2% below BEA's own government interest payments (NIPA 3.1,
      A180RC), which BEA says include interest accrued on government
      employees' defined-benefit pension liabilities — so this line carries
      that convention too. The OECD has not yet published 2025.
  cofog.csv:
    source: 'OECD — National Accounts at a Glance, chapter 6A, OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_OTEF, measure OTES13F'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_OTEF,/A.USA.OTES13F...'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of cofog_from_oecd.csv: general-government
      expenditure by COFOG division, % of GDP. The spine's seven groups
      are built on the plate: defence and public order are added, and
      "other" is the total less the six named groups (housing, recreation
      and culture, and religion; the US reports no environmental-protection
      division, which BEA folds into other functions).
  public_investment.csv:
    source: 'OECD — National Accounts at a Glance, chapter 6, OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI, measure P51GS13'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI,/A.USA.P51GS13...'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of public_investment_from_oecd.csv: general-
      government gross fixed capital formation, % of GDP.
  interest_from_oecd.csv:
    source: 'OECD — annual national accounts, Table 12, S13 D41 payable'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NASEC10@DF_TABLE12_EXP,/A.USA.S13..D.D41..........'
    refreshed_by: fetch/fetch_oecd.py
    official: false
    notes: >-
      Sidecar; curate.py copies it to interest.csv.
  budget.csv:
    source: OMB Historical Tables 1.1 and 1.2 (FY2027 edition) for FY2006-2025; Treasury Monthly Treasury Statement for FY2026
    url: https://www.whitehouse.gov/wp-content/uploads/2026/04/hist01z1_fy2027.xlsx
    refreshed_by: fetch/fetch_omb.py, fetch/fetch_treasury.py, fetch/curate.py
    notes: >-
      ONE publisher per row, recorded in the `source` column. OMB and
      Treasury do not agree: for FY2019 and FY2021 they are within $2bn,
      but for FY2020 OMB's outlays are $6,516.8bn against Treasury's
      $6,551.9bn — $35bn, half a percent, apart, because OMB revises
      history as loan-programme costs are re-estimated under credit reform
      while the Monthly Treasury Statement is the cash position reported at
      the time. Neither is wrong and they are never averaged. OMB's current
      edition stops at FY2025, which is why FY2026 comes from Treasury; its
      GDP denominator has 3 of 4 quarters, recorded in `gdp_quarters`.
      Treasury's API is never asked for a subset of columns: narrowing with
      `fields` makes Fiscal Data group by what is left and sum the rest,
      which silently returned FY2025 receipts of $10,152.7bn — the current
      and prior year-to-date rows added together.
  debt.csv:
    source: Treasury Fiscal Data — Debt to the Penny
    url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny
    refreshed_by: fetch/fetch_treasury.py
    notes: >-
      Read at the last business day of each September, the fiscal year end.
      Debt held by the public is a SUBSET of gross federal debt — the rest
      is intragovernmental, mostly the Social Security and Medicare trust
      funds — and is labelled as a subset wherever both are drawn.
  spending.csv:
    source: OMB Historical Table 3.2 — outlays by function and subfunction (FY2027 edition)
    url: https://www.whitehouse.gov/wp-content/uploads/2026/04/hist03z2_fy2027.xlsx
    refreshed_by: fetch/fetch_omb.py
    notes: >-
      The `estimate` column marks a projected year; those are drawn dashed
      or hatched and never as actuals. Education, training, employment and
      social services shows FY2022 $677.3bn then FY2023 -$2.2bn: the
      student-loan forgiveness accrual booked in FY2022 was reversed, not
      spent. That break is annotated on the plate, never smoothed. The
      workbooks are loaded WITHOUT openpyxl's read_only mode: they carry no
      worksheet dimension record, and in read_only mode openpyxl returns a
      single cell and the table reads as empty without erroring.
  federal_from_api.csv:
    source: Bureau of Economic Analysis — NIPA table 3.2, federal government current receipts and expenditures
    url: https://apps.bea.gov/national/Release/XLS/Survey/Section3All_xls.xlsx
    refreshed_by: fetch/fetch_bea.py
    notes: >-
      A CROSS-CHECK ONLY; no plate draws it. This is the national-accounts
      basis — calendar year and accrual — where the budget is fiscal year
      and cash, and the two differ by roughly a percentage point of GDP.
      Receipts are W005RC, "Current receipts". NOT W006RC, which is
      "Current tax receipts" — a subset excluding contributions for
      government social insurance, about a third of federal revenue. Used
      as the total it put FY2006 receipts at 11.1% of GDP against OMB's
      17.6%, which is how the error was caught.
  cofog_from_oecd.csv:
    source: 'OECD — National Accounts at a Glance, chapter 6A, OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_OTEF, measure OTES13F'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_OTEF,/A.USA.OTES13F...'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      General-government total expenditure by COFOG division, % of GDP
      (the OECD derives it from table 11, which itself carries only
      national-currency levels). Columns: total, social_protection,
      health, education, general_public_services, economic_affairs,
      defence, public_order, housing, recreation_culture. The fetcher
      checks the divisions sum to the total within 0.15 pt. The US
      reports no environmental-protection division (GF05) to the OECD,
      so that column is absent.
  general_government_from_imf.csv:
    source: 'IMF — World Economic Outlook and Fiscal Monitor, via DataMapper (GGR_G01_GDP_PT (Fiscal Monitor), G_X_G01_GDP_PT (Fiscal Monitor), GGXCNL_NGDP (WEO), GGXONLB_G01_GDP_PT (Fiscal Monitor), GGXWDG_NGDP (WEO))'
    url: 'https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      General government, % of GDP, calendar years. Balance and gross
      debt are WEO indicators; revenue, expenditure and the primary
      balance are not WEO codes on DataMapper (GGR_NGDP, GGX_NGDP and
      GGXONLB_NGDP do not exist there) and come from the Fiscal Monitor,
      served from the same database — the fetcher checks the WEO and
      Fiscal Monitor balances agree within 0.1 pt before writing. Stops
      at 2025: later IMF years are staff projections. 2025 itself may be
      an IMF estimate. Columns: revenue_pct_gdp, expenditure_pct_gdp,
      balance_pct_gdp, primary_balance_pct_gdp, gross_debt_pct_gdp.
  public_investment_from_oecd.csv:
    source: 'OECD — National Accounts at a Glance, chapter 6, OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI, measure P51GS13'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI,/A.USA.P51GS13...'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      gov_gfcf_pct_gdp: general-government gross fixed capital
      formation, % of GDP (spending slot 4).

trade:
  trade.csv:
    source: Bureau of Economic Analysis — NIPA table 4.1 (goods and services, balance-of-payments basis)
    url: https://apps.bea.gov/national/Release/XLS/Survey/Section4All_xls.xlsx
    refreshed_by: fetch/fetch_bea.py
    notes: >-
      Goods AND services, on a balance-of-payments basis. Cross-checked
      against NIPA table 1.1.5, which agrees exactly on net exports.
  goods.csv:
    source: Census Bureau — trade in goods by country
    url: https://www.census.gov/foreign-trade/balance/country.xlsx
    refreshed_by: fetch/fetch_trade.py
    notes: >-
      The CENSUS BASIS: goods only, at customs value. This must never be
      added to or spliced with the BEA figures in trade.csv; for 2024 the
      two differ by about $300bn, mostly the services surplus. The plate
      draws both and says they are two definitions of the same trade.
      Census ZERO-FILLS months it has not yet published, so the month count
      tests for a non-zero value; a presence test read twelve months in
      August.
  partners.csv:
    source: Census Bureau — trade in goods by country
    url: https://www.census.gov/foreign-trade/balance/country.xlsx
    refreshed_by: fetch/fetch_trade.py
    notes: >-
      Shares are computed against the Census goods total with BLOCS
      excluded: Census gives a country group a code beginning with 0, and
      summing every row would count Germany once as Germany and again
      inside the European Union. The European Union is drawn as one partner
      because US trade policy treats it as one. Written through the csv
      module: "Korea, South" contains a comma, which silently turned a
      six-column row into seven and shifted every later column.
  trade_from_wb.csv:
    source: 'World Bank — World Development Indicators (NE.EXP.GNFS.ZS, NE.IMP.GNFS.ZS)'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/NE.EXP.GNFS.ZS?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Exports and imports of goods AND services, national-accounts
      basis, % of GDP — not a customs goods series. The trade balance is
      their difference and is not stored. Columns: exports_pct_gdp,
      imports_pct_gdp.

markets:
  sp500.csv:
    source: S&P Dow Jones Indices, via Yahoo Finance
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC
    refreshed_by: fetch/fetch_markets.py
    notes: >-
      The ONE series here not taken from the body that produces it. The
      S&P 500 is private intellectual property, licensed commercially, with
      no free official archive and no federal-agency equivalent; Yahoo
      Finance is a redistributor and is named as one on the plate. What
      makes it usable is that it is checkable: the fetcher asserts seven
      published year-end closes and stops if any disagrees. All seven agree
      to the cent. Robert Shiller's ie_data.xls, the standard academic
      series, was rejected because it now ends in September 2023.
      drawdown_pct is the largest fall from a running peak inside the year,
      which is what a holder lived through; the year's high minus its low
      would overstate it whenever the low came first.

social:
  population_july1.csv:
    source: 'Census Bureau — resident population on 1 July: intercensal estimates 2000-2010 (us-est00int-tot.csv), intercensal estimates 2010-2020 (nc-est2020int-agesex-res.csv), Vintage 2025 (NST-EST2025-ALLDATA.csv)'
    url: https://www2.census.gov/programs-surveys/popest/datasets/2010-2020/intercensal/national/asrh/nc-est2020int-agesex-res.csv
    refreshed_by: fetch/fetch_census.py --spine, fetch/curate.py
    notes: >-
      One continuous 1 July series, re-anchored on the census at each end,
      so there is no step at 2020 (the Vintage 2019 estimates in
      population.csv have 1.99 million fewer people in 2019). It is the
      denominator of every rate these plates compute, and it equals the
      World Bank's SP.POP.TOTL exactly in every year 2006-2025, which the
      fetcher checks. The `series` column names the estimate each year is
      from.
  components.csv:
    source: Census Bureau — population estimates, components of change, published rates per 1,000 (RBIRTH, RDEATH, RNATURALINC / RNATURALCHG, RNETMIG), Vintages 2019 and 2025
    url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/state/totals/NST-EST2025-ALLDATA.csv
    refreshed_by: fetch/fetch_census.py --spine, fetch/curate.py
    notes: >-
      Rates per 1,000 as the Bureau publishes them, on its July-to-June
      estimate year (2025 is July 2024 to June 2025). Two vintages, kept
      apart in the `vintage` column and drawn as two segments: 2011-2019
      from Vintage 2019 and 2021-2025 from Vintage 2025. Each vintage's
      base year (2010, 2020) covers only April to June and is left empty.
  gini.csv:
    source: Census Bureau — CPS ASEC historical income table H-4, Gini index of household money income, all races
    url: https://www2.census.gov/programs-surveys/cps/tables/time-series/historical-income-households/h04.xlsx
    refreshed_by: fetch/fetch_income.py --gini, fetch/curate.py
    notes: >-
      Gini x 100. Three columns, one per method, overlapping in the break
      years: the income questions were redesigned in 2013 and the
      processing system was replaced in 2017, and Census prints both
      years on both bases. Pre-tax money income, so not comparable in
      level with the World Bank's consumption-and-income Gini, which is
      drawn beside it.
  death_rates.csv:
    source: CDC — WONDER Underlying Cause of Death 1999-2020 (D76); NCHS provisional injury series (t6u2-f84c); Monthly Provisional Counts of Deaths by Select Causes (9dzk-mvmi); VSRR quarterly provisional mortality indicators (489q-934x)
    url: https://wonder.cdc.gov/ucd-icd10.html
    refreshed_by: fetch/fetch_cdc_rates.py, fetch/curate.py
    notes: >-
      Published crude rates per 100,000. suicide_rate is WONDER's final
      rate to 2020 and the provisional dashboard's after (the two agree on
      2019 and are 0.1 apart on 2020). COVID-19 is the UNDERLYING cause
      (U07.1): 2020 from the final file, 2021-2022 as provisional COUNTS
      (NCHS publishes no rate for them there, so the plate divides by
      population_july1.csv), 2023-2024 as VSRR's published rate for the
      twelve months ending in Q4. `*_basis` says which. The provisional
      dashboards' rates for recent years appear to sit on an older
      population estimate than Vintage 2025 (2025's 14.7 implies about 334
      million people), which DATA_NOTES.md records.
  road_deaths.csv:
    source: NHTSA — Fatality Analysis Reporting System, national data files
    url: https://static.nhtsa.gov/nhtsa/downloads/FARS/2024/National/FARS2024NationalCSV.zip
    refreshed_by: fetch/fetch_fars.py, fetch/curate.py
    notes: >-
      Deaths within 30 days of a crash on a public road, the sum of FATALS
      over each year's accident table. The newest year is NHTSA's Annual
      Report File and is replaced by a final file about a year later
      (2021 moved from 42,939 to 43,230). Not the CDC's death-certificate
      "motor vehicle accidents" count, which includes some non-traffic
      deaths; the two are never joined. The rate per 100,000 is computed
      on the plate with population_july1.csv.
  demography_wdi.csv:
    source: 'World Bank — World Development Indicators (SP.POP.TOTL, SP.POP.TOTL.FE.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN, SM.POP.NETM)'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/SP.DYN.CBRT.IN?format=json'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of demography_from_wb.csv. For the United States the
      crude birth and death rates are the NCHS vital-statistics rates
      (2019's 8.697 deaths per 1,000 is NCHS's 869.7 per 100,000), and the
      population is the Census series in population_july1.csv. net_migration
      is the UN World Population Prospects estimate, a count; it is drawn
      per 1,000 beside the Census rate because the two disagree by a factor
      of two in 2023-2024.
  security_intl.csv:
    source: 'World Bank — World Development Indicators: VC.IHR.PSRC.P5 (UNODC), SH.STA.SUIC.P5 and SH.STA.TRAF.P5 (WHO Global Health Estimates)'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/VC.IHR.PSRC.P5?format=json'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of security_from_wb.csv, drawn as the harmonised
      line beside each national series: UNODC homicide (police-recorded,
      via the FBI), WHO suicide (AGE-STANDARDISED, so lower than the crude
      national rate) and WHO road-traffic deaths (modelled).
  poverty_intl.csv:
    source: 'World Bank — Poverty and Inequality Platform, SI.POV.UMIC'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/SI.POV.UMIC?format=json'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of poverty_from_wb.csv: share of people below
      US$8.30 a day (2021 PPP), the cross-country line beside the Census
      measures.
  road_deaths_from_fars.csv:
    source: NHTSA — Fatality Analysis Reporting System
    url: https://static.nhtsa.gov/nhtsa/downloads/FARS/
    refreshed_by: fetch/fetch_fars.py
    notes: Sidecar; curate.py copies it to road_deaths.csv.
  death_rates_from_cdc.csv:
    source: CDC WONDER and NCHS provisional mortality datasets
    url: https://wonder.cdc.gov/ucd-icd10.html
    refreshed_by: fetch/fetch_cdc_rates.py
    notes: Sidecar; curate.py copies it to death_rates.csv.
  population_july1_from_census.csv:
    source: Census Bureau — intercensal and Vintage 2025 population estimates
    url: https://www2.census.gov/programs-surveys/popest/datasets/
    refreshed_by: fetch/fetch_census.py --spine
    notes: Sidecar; curate.py copies it to population_july1.csv.
  components_from_census.csv:
    source: Census Bureau — population estimates, components of change
    url: https://www2.census.gov/programs-surveys/popest/datasets/
    refreshed_by: fetch/fetch_census.py --spine
    notes: Sidecar; curate.py copies it to components.csv.
  gini_from_census.csv:
    source: Census Bureau — CPS ASEC table H-4
    url: https://www2.census.gov/programs-surveys/cps/tables/time-series/historical-income-households/h04.xlsx
    refreshed_by: fetch/fetch_income.py --gini
    notes: Sidecar; curate.py copies it to gini.csv.
  income.csv:
    source: Census Bureau — Current Population Survey ASEC, table H-8
    url: https://www2.census.gov/programs-surveys/cps/tables/time-series/historical-income-households/h08.xlsx
    refreshed_by: fetch/fetch_income.py
    notes: >-
      Both dollar bases come from the same table, so the deflator is
      Census's own. A redesign year is published twice, once on each
      processing basis; the first occurrence is taken, which is the basis
      Census itself charts.
  poverty.csv:
    source: Census Bureau — "Poverty in the United States" P60 report, tables 3 and 8
    url: https://www2.census.gov/programs-surveys/demo/tables/p60/290/table_8_spm_hist.xlsx
    refreshed_by: fetch/fetch_income.py
    notes: >-
      TWO measures, side by side, never spliced. The official measure (OPM)
      compares pre-tax money income against a threshold set in 1963 and
      moved only by the CPI; it counts no tax credit and no in-kind
      benefit, so by construction it cannot see the EITC, the Child Tax
      Credit, SNAP or housing subsidies. The supplemental measure (SPM)
      counts those, subtracts tax, medical and work costs, and varies the
      threshold by housing cost; Census publishes it from 2009. In 2021 the
      expanded Child Tax Credit cut SPM child poverty to 5.1% while OPM
      child poverty read 15.3%. Everything is taken from ONE P60 release so
      the vintage is consistent, and the release number is probed rather
      than hardcoded.
  minimum_wage.csv:
    source: Department of Labor, Wage and Hour Division — history of federal minimum wage rates under the FLSA
    url: https://www.dol.gov/agencies/whd/minimum-wage/history/chart
    refreshed_by: hand-curated from the DOL chart; see fetch/fetch_income.py
    notes: >-
      Not fetched: DOL publishes effective dates rather than a series, and
      there are four values across this atlas. Recorded at 1 January and 31
      December of each year because three of the four changes took effect
      on 24 July, mid-year, and a single annual figure would have to pick
      one and hide the other. Unchanged at $7.25 since 24 July 2009.
  population.csv:
    source: Census Bureau — population estimates, vintages 2019 and 2025
    url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/state/totals/NST-EST2025-ALLDATA.csv
    refreshed_by: fetch/fetch_census.py
    notes: >-
      Growth is only computed WITHIN a vintage. Across the 2019/2020
      boundary the jump is the 2020 Census re-basing the estimate upward,
      not people: it reads as +1.0% against a real +0.5%, which would be
      the fastest growth on the chart and is an artefact. A vintage's base
      year carries THREE MONTHS of components, not twelve — BIRTHS2020 is
      894,123 where a real year is about 3.6 million — so base-year
      components are dropped rather than drawn as a collapse in births.
      Components before 2010 are not published and are left empty. A
      Census estimate year runs 1 July to 30 June.
  projections.csv:
    source: Census Bureau — 2023 National Population Projections, middle series
    url: https://www2.census.gov/programs-surveys/popproj/datasets/2023/2023-popproj/np2023_d1_mid.csv
    refreshed_by: fetch/fetch_census.py
    notes: >-
      A projection, not a measurement. The all-groups row is SEX=0,
      ORIGIN=0, RACE=0; the file already contains those totals, so summing
      the group rows would double-count every person.
  mortality.csv:
    source: CDC WONDER Underlying Cause of Death 1999-2020 (final); CDC provisional COVID-19 death counts (Socrata r8kw-7aab)
    url: https://wonder.cdc.gov/controller/datarequest/D76
    refreshed_by: fetch/fetch_cdc.py
    notes: >-
      The two files do NOT measure the same thing and are never spliced.
      WONDER counts the UNDERLYING cause; the provisional file counts
      deaths that INVOLVED the condition. Measured at the 2020 overlap:
      all-cause agrees to 0.2% (a vintage difference, so all-cause IS one
      continuous column with the vintage recorded), COVID-19 is 9.9% apart,
      influenza 47.9% and pneumonia 639.5% — most 2020 pneumonia deaths
      involved pneumonia but were caused by COVID-19. Each measure keeps
      its own column and the plate draws them as two lines whose step at
      2020 is visibly a change of definition. The underlying-cause series
      stops at 2020 because the final file does; WONDER's provisional
      dataset D176 would extend it but its request form is built in the
      browser and is not published as a parameter list, so it is left out
      rather than guessed at. Certificate-based influenza counts badly
      understate flu mortality against CDC's modelled burden estimates.
      ICD-10 J17 is absent from the pneumonia set because it can never be
      an underlying cause and WONDER rejects it.
  violence.csv:
    source: CDC WONDER Underlying Cause of Death 1999-2020 (final); CDC provisional injury counts (Socrata t6u2-f84c); VSRR provisional overdose counts (Socrata xkb8-kh2a)
    url: https://wonder.cdc.gov/controller/datarequest/D76
    refreshed_by: fetch/fetch_cdc.py
    notes: >-
      The seam between final and provisional was MEASURED, not assumed:
      homicides 2019 final 18,918 against provisional 19,141 (+1.2%) and
      2020 24,352 against 24,576 (+0.9%); overdoses agree to under 1% over
      2015-2020. The `vintage` column records which file each year came
      from. VSRR is used for overdoses in preference to the injury
      dashboard's Drug_OD, which runs about 5% below CDC's published counts.
      Firearm homicides are a SUBSET of firearm deaths and synthetic
      opioids a SUBSET of overdoses; both are labelled as subsets and the
      share is drawn rather than left to be divided by eye. Police
      intervention (Y35) is a known UNDERCOUNT and stops at 2020: the code
      follows whoever certifies the death, and research puts roughly half
      of these deaths under ordinary homicide. It is drawn because it is
      the official series, not because it is right.
  hdi.csv:
    source: UN Development Programme — Human Development Report 2025, composite indices time series
    url: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
    refreshed_by: fetch/fetch_worldbank.py
    notes: >-
      One vintage for the whole series. UNDP recomputes history under the
      current methodology with each report, so mixing report years produces
      steps that are methodology rather than development.
  demography_from_wb.csv:
    source: 'World Bank — World Development Indicators (SP.POP.TOTL, SP.POP.TOTL.FE.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN, SM.POP.NETM), from the UN World Population Prospects and national vital statistics'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/SP.POP.TOTL.FE.IN?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Mid-year population (total and female), so a rate per 100,000
      women can be computed on a mid-year denominator. Crude birth and
      death rates are per 1,000 people. net_migration is a COUNT of
      people (WPP estimate), not a rate: per 1,000 = net_migration /
      population x 1,000 for the same year. WPP figures for recent years
      are estimates and are revised with each WPP. Columns: population,
      population_female, birth_rate_per_1000, death_rate_per_1000,
      net_migration.
  poverty_from_wb.csv:
    source: 'World Bank — Poverty and Inequality Platform, SI.POV.UMIC'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/SI.POV.UMIC?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      poverty_830_pct: share of people below US$8.30 a day, 2021 PPP.
      Survey years only; the gaps are years without a survey, not zeros.
      The cross-country line beside the national poverty definition,
      never spliced into it.
  security_from_wb.csv:
    source: 'World Bank — World Development Indicators: VC.IHR.PSRC.P5 (UNODC), SH.STA.SUIC.P5 and SH.STA.TRAF.P5 (WHO Global Health Estimates)'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/VC.IHR.PSRC.P5?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      All per 100,000 people. Intentional homicide is UNODC's harmonised
      count, which usually differs from the national police or death-
      certificate series in both directions. Suicide and road-traffic
      deaths are WHO modelled estimates (suicide age-standardised),
      ending 2021 and 2019 respectively in this release; later years are
      blank, not zero. Columns: homicide_per_100k, suicide_per_100k,
      road_deaths_per_100k.

credit:
  household_credit.csv:
    source: 'BIS — total credit statistics, WS_TC Q.US.H.A.M.770.A'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/Q.US.H.A.M.770.A?format=csv'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of household_credit_from_bis.csv: credit to
      households and NPISHs, % of GDP, Q4. Wider than the FRBNY Consumer
      Credit Panel in household_debt.csv: non-profits and every lender are
      in it.
  household_debt.csv:
    source: Federal Reserve Bank of New York — Quarterly Report on Household Debt and Credit
    url: https://www.newyorkfed.org/medialibrary/interactives/householdcredit/data/xls/hhd_c_report_2026q2.xlsx
    refreshed_by: fetch/fetch_credit.py
    notes: >-
      Built from the FRBNY Consumer Credit Panel, a 5% anonymised sample of
      Equifax credit reports. This is NOT the same universe as the Board's
      Z.1 financial accounts, which count household-sector liabilities
      including items that never appear on a credit report; the levels
      differ by roughly a trillion dollars and the two must not be mixed. A
      stock is taken at Q4 and a rate is averaged; the `quarters` column
      records how many quarters a year actually has.
  credit_access.csv:
    source: Federal Reserve Bank of New York — Quarterly Report on Household Debt and Credit, page 10
    url: https://www.newyorkfed.org/microeconomics/hhdc
    refreshed_by: fetch/fetch_credit.py
    notes: >-
      The credit card limit is the closest published measure of how much
      credit households can actually draw on. Utilisation is balance over
      limit, which is what availability means from the borrower's side
      rather than the lender's.
  delinquency.csv:
    source: Federal Reserve Bank of New York — Quarterly Report on Household Debt and Credit, page 12
    url: https://www.newyorkfed.org/microeconomics/hhdc
    refreshed_by: fetch/fetch_credit.py
    notes: >-
      Student loan delinquency goes from 0.57% in 2024 to 9.21% in 2025.
      That is the end of the pandemic credit-reporting pause — a change in
      what is reported, not in what borrowers did — and it is annotated on
      the plate rather than smoothed.
  rates.csv:
    source: Federal Reserve Board — G.19 Consumer Credit, terms of credit
    url: https://www.federalreserve.gov/releases/g19/HIST/cc_hist_tc_levels.html
    refreshed_by: fetch/fetch_credit.py
  debt_service_from_bis.csv:
    source: 'BIS — debt service ratios, WS_DSR Q.US.H'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_DSR/1.0/Q.US.H?format=csv'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Interest plus amortisation on household debt as % of household
      disposable income. A BIS estimate built on an assumed average
      maturity and the aggregate lending rate. Q4 value, quarter mean
      and the number of quarters, as in the credit file.
  household_credit_from_bis.csv:
    source: 'BIS — total credit statistics, WS_TC Q.US.H.A.M.770.A'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/Q.US.H.A.M.770.A?format=csv'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Credit to households and NPISHs from all sectors, market value, %
      of GDP, adjusted for breaks. hh_credit_pct_gdp_q4 is the Q4 (year-
      end) value the spine draws; _qavg is the mean of the quarters
      published and _quarters says how many, so the running year reads
      as one quarter, not a year. Wider than bank-loan series: every
      lender and debt securities are in it.

migration:
  stock_acs.csv:
    source: Census Bureau — American Community Survey 1-year table B05002
    url: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/1YRData/acsdt1y2024-b05002.dat
    refreshed_by: fetch/fetch_migration.py
    notes: >-
      National resident population. Foreign-born is birthplace; naturalized
      and noncitizen partition that stock by citizenship. Annual 2020 is
      absent because no standard ACS 1-year estimates were released.

international:
  world.csv:
    source: 'World Bank — World Development Indicators (NY.GDP.PCAP.CD, FI.RES.TOTL.CD)'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/FI.RES.TOTL.CD?format=json'
    refreshed_by: fetch/fetch_harmonised.py, fetch/curate.py
    official: false
    notes: >-
      The curated copy of world_from_wb.csv. Reserves include gold, which
      the World Bank values at year-end London prices, so the line moves
      with the gold price as much as with policy.
  corruption.csv:
    source: Transparency International — Corruption Perceptions Index (CPI 2025 results workbook; CPI 2011 data package)
    url: https://images.transparencycdn.org/images/CPI2025_Results.xlsx
    refreshed_by: fetch/fetch_ti.py, fetch/curate.py
    official: false
    notes: >-
      score is the 2012 method, 0-100, the only span TI calls comparable.
      score_pre2012 is the old 0-10 method as TI published it; only 2011
      is fetchable at a stable address. The plate draws it x10 as a
      separate point, never joined to the 2012 line. Higher is cleaner.
  corruption_from_ti.csv:
    source: Transparency International — Corruption Perceptions Index
    url: https://images.transparencycdn.org/images/CPI2025_Results.xlsx
    refreshed_by: fetch/fetch_ti.py
    official: false
    notes: Sidecar; curate.py copies it to corruption.csv.
  worldbank.csv:
    source: World Bank — World Development Indicators
    url: https://api.worldbank.org/v2/country/USA/indicator/NY.GDP.MKTP.CD
    refreshed_by: fetch/fetch_worldbank.py
    notes: >-
      Kept only where the authoritative publisher is an international body
      or where the point of the measure is the comparison. Where a US
      agency publishes the same measure on its own definition, that agency
      wins: poverty comes from the Census Bureau, not from the World Bank's
      harmonised dollar-a-day lines, which say almost nothing about the
      United States. us_share_world_gdp is at MARKET EXCHANGE RATES; on a
      purchasing-power basis the share is markedly lower and the two are
      not interchangeable.
  world_from_wb.csv:
    source: 'World Bank — World Development Indicators (NY.GDP.PCAP.CD, FI.RES.TOTL.CD)'
    url: 'https://api.worldbank.org/v2/country/USA/indicator/NY.GDP.PCAP.CD?format=json'
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: >-
      Current US$: GDP, GDP per person, and total reserves including
      gold (year-end, IMF IFS via the WDI). A harmonised cross-country
      series for the world chapter, not the national accounts; spot-
      checked and cross-checked in the fetcher. Columns:
      gdp_per_person_usd, reserves_usd.
