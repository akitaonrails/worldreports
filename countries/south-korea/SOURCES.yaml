# Provenance for every committed CSV in this repository.
#
# core/page.py prints this manifest as the sources table on every page of
# this country, and it reads the CSVs as well as this file: the coverage
# shown there is measured from the data, not copied from here, so the page
# cannot claim years the file does not have. A CSV with no entry here fails
# the build (tests/test_sources.py).
#
# Fields
#   title      what the series is, in the publisher's own terms where useful
#   publisher  the agency that computed the number
#   url        where a reader can check it
#   series     the table/indicator identifiers, so the fetch is reproducible
#   fetcher    the script that writes the file, or `curated` for hand entry
#   unit       what the numbers are in
#   caveats    things that would make a reader wrong if they did not know them
#
# `caveats` is the point of this file. Most of the real work in this atlas was
# finding out which official number is which.

meta:
  country: Republic of Korea
  window: 2006-2026
  note: >-
    Korea renamed its statistics office in 2025: 통계청 / Statistics Korea
    became 국가데이터처 / the Ministry of Data and Statistics, and moved from
    kostat.go.kr to mods.go.kr. Releases published before the change still
    carry the old name, and both appear in this file where they are the
    accurate attribution for the document actually used.

files:

  # ------------------------------------------------------------ macro
  macro/gdp.csv:
    title: Gross domestic product — nominal level, real growth, per capita, population
    publisher: Bank of Korea (national accounts)
    url: https://ecos.bok.or.kr/
    series: ECOS 200Y113 (nominal, 10106), 200Y110 (real, 10601), 901Y028 (population, I35A)
    fetcher: fetch/fetch_bok.py
    unit: ₩ trillion; % per year; current US$; millions of people
    caveats:
      - >-
        Real growth is computed here from the chained real GDP series rather
        than read from a published growth table, so the level and the growth
        rate in this file can never disagree with each other.
      - >-
        The national accounts were rebased from 2015 to 2020 prices in the
        2024 benchmark revision. The whole series is on the current base; a
        growth rate quoted from an older release will differ slightly.
      - >-
        GDP per capita is nominal GDP converted at the annual average
        exchange rate and divided by the population — the same construction
        the Bank of Korea uses, but computed here, so it is not a quotation.
      - 2026 carries population only; the national accounts for it do not exist yet.

  macro/cpi.csv:
    title: Consumer price index, all items — annual inflation
    publisher: Statistics Korea, via Bank of Korea ECOS
    url: https://ecos.bok.or.kr/
    series: ECOS 901Y009 (item 0, 2020=100)
    fetcher: fetch/fetch_bok.py
    unit: "% change on the previous year"
    caveats:
      - >-
        Computed from the 2020=100 index rather than taken from a published
        inflation series, for the same reason as GDP growth. The result
        matches the World Bank's independent series for Korea exactly.

  macro/base_rate.csv:
    title: Bank of Korea base rate
    publisher: Bank of Korea
    url: https://ecos.bok.or.kr/
    series: ECOS 722Y001 (0101000), monthly
    fetcher: fetch/fetch_bok.py
    unit: "% per year"
    caveats:
      - >-
        The year-end *level*, not the annual average. A policy rate is a
        decision, not a flow, and averaging it describes no moment that
        existed.
      - 2026 is the level in the latest published month, not a year-end.

  macro/won.csv:
    title: Won per US dollar — annual average and year-end close
    publisher: Bank of Korea
    url: https://ecos.bok.or.kr/
    series: ECOS 731Y006 (0000003), monthly close
    fetcher: fetch/fetch_bok.py
    unit: KRW per USD
    caveats:
      - >-
        `eop` is December's close specifically, not the last row the API
        happened to serve — which is December only by luck of ordering, and
        would silently become September in a partial year.

  macro/reserves.csv:
    title: Official foreign exchange reserves
    publisher: Bank of Korea
    url: https://ecos.bok.or.kr/
    series: ECOS 732Y001 (item 99), monthly
    fetcher: fetch/fetch_bok.py
    unit: US$ billion, end of period
    caveats:
      - Published in thousands of US dollars; divided by 1e6 here.

  macro/external.csv:
    title: International investment position — external assets, liabilities and the net
    publisher: Bank of Korea
    url: https://ecos.bok.or.kr/
    series: ECOS 311Y001 — 대외금융자산 (1000000), 대외금융부채 (2000000)
    fetcher: fetch/fetch_bok.py
    unit: US$ billion
    caveats:
      - >-
        ECOS publishes the two sides and not the net, so the net column is
        computed. It crosses zero in 2014: that year is when Korea stopped
        being a net debtor to the rest of the world.
      - >-
        This is the whole country's balance sheet, not the state's. Reserves
        (macro/reserves.csv) are one line inside the asset side.

  macro/unemployment.csv:
    title: Unemployment rate
    publisher: Statistics Korea (Economically Active Population Survey), via ECOS
    url: https://ecos.bok.or.kr/
    series: ECOS 901Y027 (I61BC)
    fetcher: fetch/fetch_bok.py
    unit: "% of the labour force, annual average"
    caveats:
      - >-
        2026 is the mean of the months published so far, not a full year, and
        the plate marks it as partial.
      - >-
        Korea's headline unemployment rate is low partly because its
        participation definitions treat a great deal of involuntary
        part-time and family work as employment. The rate is comparable
        across years; it is not a measure of labour-market slack.

  macro/minimum_wage.csv:
    title: Statutory minimum wage
    publisher: Minimum Wage Commission / Ministry of Employment and Labour
    url: https://www.minimumwage.go.kr/
    series: annual determination
    fetcher: curated
    unit: ₩ per hour
    caveats:
      - >-
        The 2006 figure covers a sixteen-month application period: the
        determination year was realigned to the calendar year that year, and
        2006 is the rate that applied from January 2006.
      - >-
        The real line on plate 06 is this series deflated by macro/cpi.csv,
        chained backwards from the latest year, so a reader can check it
        against the inflation panel of plate 01.

  macro/household_credit.csv:
    title: Household credit — loans and card/instalment credit
    publisher: Bank of Korea (flow of funds)
    url: https://ecos.bok.or.kr/
    series: ECOS 151Y001 — 가계신용 (1000000), 가계대출 (1100000), 판매신용 (1200000)
    fetcher: fetch/fetch_bok.py
    unit: ₩ trillion, end of period; % of GDP
    caveats:
      - >-
        가계신용 (household credit) is the broadest official measure: it
        covers banks, non-bank lenders and card companies. It is larger than
        the bank-only figures that are sometimes quoted for the same idea.
      - >-
        The share of GDP is computed against macro/gdp.csv, so it moves with
        the national-accounts base year as well as with the debt.

  macro/credit_terms.csv:
    title: What credit costs and how much of it goes unpaid
    publisher: Bank of Korea
    url: https://ecos.bok.or.kr/
    series: >-
      ECOS 121Y006 — weighted-average lending rates on new business
      (BECBLA03 households, BECBLA0302 housing, BECBLA03051 unsecured);
      901Y054 — delinquency rates (MO3AB households, MO3AA corporates)
    fetcher: fetch/fetch_bok.py
    unit: "% per year; % of loans overdue"
    caveats:
      - >-
        Rates are on *newly extended* loans by deposit banks, weighted by
        amount. They are the price of borrowing now, not the average rate
        households are currently paying on the stock of their debt.
      - >-
        Delinquency covers deposit banks only. Arrears at non-bank lenders,
        where the riskiest household credit sits, are higher and are not in
        this series.

  # ------------------------------------------------------------ fiscal
  fiscal/government.csv:
    title: General government revenue, expenditure and net lending
    publisher: Bank of Korea (SNA general government account)
    url: https://ecos.bok.or.kr/
    series: ECOS 200Y153 (total revenue 1401, total expenditure 1400, net lending 1309, interest 1208, GFCF 1305; sector 1 = general government)
    fetcher: fetch/fetch_bok.py
    unit: "% of GDP"
    caveats:
      - >-
        `interest_paid` is 소득계정_이자, interest *paid* by general
        government (property income paid is interest plus other property
        income, and the second is zero every year), so it is the gross
        interest bill. The IMF's net interest — its primary balance minus
        its overall balance — is a fraction of it, because the National
        Pension Service's assets earn interest back: 1.42% gross against
        0.3% net in 2025. No second publisher of Korea's gross general-
        government interest could be reached (the OECD table 12 endpoint
        returned no data for Korea), so the cross-check is internal: the
        series equals property income paid every year.
      - >-
        `gov_gfcf` is general-government gross fixed capital formation. It
        matches the OECD's P51GS13 (fiscal/public_investment_from_oecd.csv)
        to the second decimal: 4.77% against 4.775% in 2019.
      - >-
        The plates draw revenue, expenditure and the balance from this file
        only for the years before 2012, where the IMF's general-government
        series for Korea does not reach, as separate segments rather than
        spliced onto the IMF line. The two differ by about 0.6 pt of GDP
        where they overlap.
      - >-
        This is the SNA net lending/borrowing of general government. Korean
        budget debate uses 관리재정수지, the managed fiscal balance, which
        excludes the social-security surpluses and is therefore several
        points of GDP worse. The two are not interchangeable and this atlas
        draws the SNA measure throughout.

  fiscal/tax_burden.csv:
    title: Tax burden — total tax revenue as a share of GDP
    publisher: Statistics Korea / Ministry of Economy and Finance, via ECOS
    url: https://ecos.bok.or.kr/
    series: ECOS 901Y081 (G2A)
    fetcher: fetch/fetch_bok.py
    unit: "% of GDP"
    caveats:
      - >-
        The source table is in 억원 (hundred millions of won) while GDP is in
        조원 (trillions); the ratio needs the factor of ten between them, and
        getting it wrong produces a plausible-looking number ten times off.
      - >-
        Tax only. Social insurance contributions are excluded, which is why
        this is lower than the OECD's "tax and social contributions" ratio
        for Korea by roughly seven points of GDP.

  fiscal/debt.csv:
    title: Public debt on the two official definitions, D1 and D2
    publisher: Ministry of Economy and Finance, via e-National Indicators
    url: https://www.index.go.kr/
    series: index.go.kr 420901/1106 (D1), 501801/5018 (D2)
    fetcher: fetch/fetch_index_kr.py
    unit: "% of GDP"
    caveats:
      - >-
        D1 is central plus local government debt — the number Korean
        political argument uses. D2 adds non-profit public institutions and
        is the general-government measure the IMF and OECD compare. D2 for
        2012, 2020, 2023 and 2024 matches the IMF's general-government gross
        debt for Korea exactly.
      - >-
        D3, which adds the non-financial public corporations, exists and is
        larger again. It is not drawn here.
      - D2 begins in 2011; there is no earlier published value on this basis.

  fiscal/investment.csv:
    title: Gross fixed capital formation
    publisher: Bank of Korea (national accounts)
    url: https://ecos.bok.or.kr/
    series: ECOS 200Y113
    fetcher: fetch/fetch_bok.py
    unit: ₩ trillion; % of GDP
    caveats:
      - Whole-economy investment, not government investment.

  fiscal/spending_by_function.csv:
    title: General government expenditure by COFOG function
    publisher: Bank of Korea
    url: https://ecos.bok.or.kr/
    series: ECOS 200Y152, functions 110/107/109/104/101/102/103 against total 201
    fetcher: fetch/fetch_bok.py
    unit: "% of GDP"
    caveats:
      - >-
        `other` is the published total minus the seven named functions, not a
        published residual, so the columns always sum to the total.
      - Ends in 2024; the COFOG breakdown is published with a long lag.

  fiscal/spending_by_function_krw.csv:
    title: General government expenditure by COFOG function, in won
    publisher: Bank of Korea
    url: https://ecos.bok.or.kr/
    series: ECOS 200Y152
    fetcher: fetch/fetch_bok.py
    unit: ₩ trillion
    caveats:
      - The same series as spending_by_function.csv, before dividing by GDP.

  fiscal/rnd.csv:
    title: Research and development expenditure
    publisher: World Bank (from OECD/UNESCO)
    url: https://data.worldbank.org/indicator/GB.XPD.RSDV.GD.ZS
    series: GB.XPD.RSDV.GD.ZS
    fetcher: fetch/fetch_international.py
    unit: "% of GDP"
    caveats:
      - >-
        Gross domestic expenditure on R&D by every sector, not the government
        budget for it. Korea's figure is overwhelmingly private: it is the
        second highest in the world after Israel.
      - Ends in 2023.

  # ------------------------------------------------------------- trade
  trade/trade.csv:
    title: Merchandise exports, imports and the trade balance
    publisher: Korea Customs Service, via Bank of Korea ECOS
    url: https://ecos.bok.or.kr/
    series: ECOS 901Y092, annual and monthly
    fetcher: fetch/fetch_bok.py
    unit: US$ billion, customs basis
    caveats:
      - >-
        2026 is a cumulative January–September total, not a year, and every
        panel that draws it says so. It already exceeds all of 2025, which
        is real: the AI/semiconductor cycle. MOTIE's own September release
        gives US$814.5bn cumulative against the US$814.7bn here, a rounding
        difference between the customs and the ministry cuts.
      - >-
        Customs basis, so it differs from the balance-of-payments goods
        account by freight and insurance treatment.

  trade/destinations.csv:
    title: Exports by destination country
    publisher: Korea Customs Service, via Bank of Korea ECOS
    url: https://ecos.bok.or.kr/
    series: ECOS 901Y121
    fetcher: fetch/fetch_bok.py
    unit: "% of total exports"
    caveats:
      - >-
        Four partners are drawn. They are not the whole total, and the shares
        do not sum to 100.

  trade/exports_products.csv:
    title: Exports by product group, at five snapshot years
    publisher: Korea, as reported to UN Comtrade
    url: https://comtradeapi.un.org/
    series: HS 8542, 8703, 8708, 89, 2710, 39, 72, 8517 — annual, flow X, partner world
    fetcher: fetch/fetch_products.py
    unit: US$ billion
    caveats:
      - >-
        HS headings, not the MTI categories Korea's own trade statistics and
        press releases use. MTI 반도체 is wider than HS 8542, and the
        ministry's semiconductor figure for 2025 is US$173.4bn against the
        US$142.8bn here. Both are correct about different definitions; the
        panel states which one it draws.
      - >-
        Chapter-level codes are used where no single heading covers the
        product: 89 ships, 72 iron and steel, 39 plastics and
        petrochemicals.
      - Five snapshot years only, not an annual series.

  # ----------------------------------------------------------- markets
  markets/kospi.csv:
    title: KOSPI composite index, year-end close
    publisher: Korea Exchange (index), retrieved via Yahoo Finance
    url: https://finance.yahoo.com/quote/%5EKS11
    series: ^KS11, daily closes
    fetcher: fetch/fetch_markets.py
    unit: index points
    caveats:
      - >-
        The year-end value is the last *trading day by date*, so a gap in the
        series or a partial final year cannot silently promote some other day
        to year-end.
      - >-
        Taken from the index feed rather than transcribed. Second-hand
        year-end figures for the KOSPI are frequently wrong — one search
        result gave 2,486 for 2020 against the actual 2,873.47.
      - 2026 is the latest close, not a year-end.

  markets/sp500.csv:
    title: S&P 500 index, year-end close
    publisher: S&P Dow Jones Indices, retrieved via Yahoo Finance
    url: https://finance.yahoo.com/quote/%5EGSPC
    series: ^GSPC, daily closes
    fetcher: fetch/fetch_markets.py
    unit: index points
    caveats:
      - Price index, no dividends, on both sides of the comparison.

  # ------------------------------------------------- international scores
  intl/openness.csv:
    title: Trade openness — exports plus imports as a share of GDP
    publisher: World Bank (national accounts)
    url: https://data.worldbank.org/indicator/NE.TRD.GNFS.ZS
    series: NE.TRD.GNFS.ZS
    fetcher: fetch/fetch_international.py
    unit: "% of GDP"
    caveats:
      - >-
        Goods *and* services on the national-accounts basis, which is not
        trade/trade.csv divided by GDP — that would be goods only, on the
        customs basis, several points of GDP away.

  intl/cpi.csv:
    title: Corruption Perceptions Index — Korea's score and rank
    publisher: Transparency International
    url: https://www.transparency.org/en/cpi
    series: CPI 2006-2025 (0-100 score from 2012; 0-10 score before)
    fetcher: curated, from intl/cpi_from_ti.csv plus the current release
    unit: score out of 100; rank
    caveats:
      - >-
        The plate draws the score, not the rank: the number of countries
        assessed changes every year, so a rank is not comparable across the
        window.
      - >-
        Scores before 2012 were computed differently on a 0-10 scale. They
        are kept in their own column, `score_0_10`, as Transparency
        International published them (2006 5.1, 2007 5.1, 2008 5.6, 2009
        5.5, 2010 5.4, 2011 5.4, read off transparency.org/en/cpi/<year>),
        and the world plate draws them ×10 as paler bars beside the 0-100
        series, a seam rather than a splice.
      - >-
        Ranks are published in the time series only from 2017; earlier years
        are blank here rather than filled from secondary sources.

  intl/cpi_from_ti.csv:
    title: Corruption Perceptions Index time series, as published
    publisher: Transparency International
    url: https://images.transparencycdn.org/images/CPI2024-Results-and-trends.xlsx
    series: CPI 2012-2024 results spreadsheet, "CPI Timeseries" sheet
    fetcher: fetch/fetch_international.py
    unit: score out of 100; rank
    caveats:
      - >-
        Sidecar, not drawn. It stops at the edition whose spreadsheet is
        published; the curated intl/cpi.csv adds the current year.
      - >-
        The spreadsheet's own header capitalisation is inconsistent — the
        2012 and 2013 columns read "CPI Score", every later one "CPI score" —
        so the reader matches case-insensitively. Matching exactly drops the
        two oldest years with no error at all.

  # ------------------------------------------------------------ social
  social/population.csv:
    title: Population, share aged 65 and over, and total fertility rate
    publisher: Statistics Korea — Population Projections (2024 revision)
    url: https://kosis.kr/
    series: ECOS 901Y028 (I35A population, elderly share, total fertility rate)
    fetcher: fetch/fetch_bok.py
    unit: millions of people; %; children per woman
    caveats:
      - >-
        Observed to the latest vital-statistics year and projected after it,
        to 2072. The plate draws the projected part dashed and says so.
      - >-
        The medium variant. The projection was revised upwards in 2024
        relative to the 2021 one; an older chart of the same series will show
        a steeper fall.

  social/vital.csv:
    title: Births, deaths, natural change, fertility and life expectancy
    publisher: Statistics Korea / Ministry of Data and Statistics — Vital Statistics
    url: https://www.index.go.kr/
    series: index.go.kr 101101/1011 — 출생 사망 추이
    fetcher: fetch/fetch_index_kr.py
    unit: people per year; children per woman; years
    caveats:
      - >-
        2020 is the crossing year: 272,337 births against 304,948 deaths.
        Korea has had more deaths than births every year since.
      - >-
        `crude_birth_rate` and `crude_death_rate` are the published rates
        per 1,000 (조출생률, 조사망률), on the registered-population
        denominator of the vital statistics. The demography plate draws
        them as published and takes natural increase as their difference.
      - >-
        The confirmed registration basis, which is what the Causes of Death
        release uses. The provisional February release of the same year
        differs: 363,400 deaths for 2025 against the 362,968 here.
      - >-
        `natural_change` is computed from the two columns beside it rather
        than read, so the three can never disagree.
      - >-
        `tfr` duplicates the same column in social/population.csv, which
        comes from a different portal page. They agree to three decimals
        across the whole window, which is the point of keeping both.
      - >-
        Life expectancy drops in 2022 — 83.6 to 82.7 — and recovers. That is
        the pandemic, and it is the only year in the window where it falls.

  social/mortality.csv:
    title: Death rates by cause
    publisher: Statistics Korea / Ministry of Data and Statistics — Causes of Death Statistics
    url: https://www.index.go.kr/
    series: index.go.kr 101201/1012 — 사망원인별 사망률 추이
    fetcher: fetch/fetch_index_kr.py
    unit: deaths per 100,000 population
    caveats:
      - >-
        The denominator is 주민등록 연앙인구, the mid-year registered
        population (index.go.kr 1012, 수치해석 방법), which covers Korean
        nationals — the same scope as the deaths counted, which are
        Koreans' death registrations. `all_causes` is the 전체 row, the
        crude death rate on that denominator, and is how the plates put
        a count from the same release (homicide) on the same denominator:
        deaths ÷ (all_causes / 100,000) recovers it, 51.04 million in 2024
        against the 51.75 million total resident population that includes
        foreigners.
      - >-
        `cerebrovascular` is 뇌혈관 질환, drawn as "stroke" in the mortality
        lens.
      - >-
        `transport` is 운수사고, the cause-of-death category, which covers
        rail, water and air as well as roads and is assigned from the death
        certificate. It is not social/road.csv, the police count, and the two
        differ by about a third.
      - >-
        Influenza is not in this table. Korea's headline cause-of-death
        release does not publish it as a separate series; the respiratory
        infection it does publish is 폐렴, pneumonia, which has been the
        country's third largest cause of death since 2015 and is drawn here.
        An annual influenza series exists only in the 104-item KOSIS table,
        which requires an API key.
      - >-
        The whole table is one consistent cut of one release, which is why it
        is used in preference to the portal's standalone 자살률 indicator —
        that one lags this one by several years.

  social/covid.csv:
    title: COVID-19 deaths
    publisher: Statistics Korea / Ministry of Data and Statistics — Causes of Death Statistics
    url: https://mods.go.kr/
    series: annual releases, 2020 through 2025
    fetcher: curated
    unit: deaths; deaths per 100,000
    caveats:
      - >-
        Counted from death certificates (ICD U07.1, U07.2, U10.9) for Korean
        residents, which is *not* the KDCA surveillance count. The release
        says so itself; the two differ by thousands.
      - >-
        Assembled from the per-year releases rather than from the trend table
        inside the latest one. That trend table prints 0 for 2020, because
        the row only exists from the year COVID entered the summary
        classification — while the 2020 release itself published 950 deaths.
        An official table and an official release disagree, and the releases
        win.

  social/homicide.csv:
    title: Deaths from assault (가해/타살)
    publisher: Statistics Korea / Ministry of Data and Statistics — Causes of Death Statistics
    url: https://mods.go.kr/
    series: "table 5, 주요 사망원인별 사망자 수 추이, in the 2024 and 2025 releases"
    fetcher: curated
    unit: deaths per year
    caveats:
      - >-
        Begins in 2014. The trend table prints alternate years, so the two
        most recent releases together give every year from 2014; earlier
        years would need older releases. The overlapping years agree.
      - >-
        Stored as a count because the published rate is given to one decimal,
        which rounds a sub-1.0 series into uselessness. Plate 09 converts it
        with the release's own denominator — total deaths (social/vital.csv)
        ÷ the all-cause rate (social/mortality.csv) × 100,000, the mid-year
        registered Korean-national population — and reproduces the
        published one-decimal rate (0.6 in 2024). It used to divide by the
        projection population in macro/gdp.csv, which counts foreign
        residents the deaths do not cover and was 0.7 million larger in
        2024 (51.75 against 51.04 million), so the old rate ran about 1.4%
        low.

  social/road.csv:
    title: Road traffic deaths
    publisher: National Police Agency, via e-National Indicators
    url: https://www.index.go.kr/
    series: index.go.kr 426101/4261
    fetcher: fetch/fetch_index_kr.py
    unit: deaths per 100,000 population
    caveats:
      - >-
        Deaths on the road within 30 days of the crash, counted by the
        police. See the note on social/mortality.csv for why this is not the
        same as the 운수사고 cause-of-death rate.

  social/workplace.csv:
    title: Industrial accidents — injury rate, fatal accident rate, deaths, disease cases
    publisher: Ministry of Employment and Labour, via e-National Indicators
    url: https://www.index.go.kr/
    series: index.go.kr 151401/1514
    fetcher: fetch/fetch_index_kr.py
    unit: "% of workers; deaths per 10,000 workers; people"
    caveats:
      - >-
        The rate and the count tell opposite stories and both are correct.
        사고사망만인율, the fatal-accident rate per 10,000 workers, more than
        halved. 사망자수, the death count, did not fall, because the
        workforce grew and because the deaths counted include occupational
        disease — whose case count more than tripled over the same window.
        Plate 09 draws both and says which is which.
      - >-
        Covers workplaces inside the industrial accident compensation
        scheme. Self-employed and platform workers are largely outside it.

  social/gini.csv:
    title: Gini coefficient of disposable income, by survey
    publisher: Statistics Korea, via e-National Indicators
    url: https://www.index.go.kr/
    series: index.go.kr 422501/4225
    fetcher: fetch/fetch_index_kr.py
    unit: coefficient, 0 to 1
    caveats:
      - >-
        Two surveys, never spliced. `hfws` is 가계금융복지조사, the current
        basis, from 2011. `hies` is 가계동향조사, discontinued for this
        purpose after 2016. Both are disposable-income Gini coefficients —
        they differ by survey universe, not by income concept — and they
        differ by about 0.05, which is most of the apparent improvement in
        any chart that joins them.

  social/poverty.csv:
    title: Relative poverty, whole population and at 65 and over
    publisher: Statistics Korea, via e-National Indicators
    url: https://www.index.go.kr/
    series: index.go.kr 505601/5056 (whole population), 102401/1024 (65 and over)
    fetcher: fetch/fetch_index_kr.py
    unit: "% below half the median equivalised income"
    caveats:
      - >-
        Both columns are 가계금융복지조사 on the same basis; they come from
        two indicator pages only because the portal splits them.
      - >-
        The age base is 65 and over throughout. The retirement-age base, 66
        and over, is what Statistics Korea headlines and what the OECD
        comparison uses; it runs about two points higher, and the two get
        quoted interchangeably.
      - >-
        `elderly_65_market` is the same population before taxes and
        transfers. The difference between the two columns is the size of
        the transfer system: 54.9% against 35.9% in 2024.

  social/hdi.csv:
    title: Human Development Index
    publisher: UNDP, Human Development Report Office
    url: https://hdr.undp.org/data-center
    series: HDR 2025 composite indices complete time series, hdi_YYYY for KOR
    fetcher: fetch/fetch_international.py
    unit: index, 0 to 1
    caveats:
      - >-
        Read from the exact `hdi_YYYY` columns only. The same file carries
        `hdi_rank_YYYY`, `hdi_f_YYYY` and `hdi_m_YYYY`, and a prefix match
        would mix a rank into the index.
      - Ends in 2023.

  social/gini_from_wb.csv:
    title: Gini index, World Bank harmonised
    publisher: World Bank
    url: https://data.worldbank.org/indicator/SI.POV.GINI
    series: SI.POV.GINI
    fetcher: fetch/fetch_international.py
    unit: index, 0 to 100
    caveats:
      - >-
        Sidecar, not drawn. Kept so a reader can see how far the harmonised
        series sits from Korea's own, and so the two are never confused.

  social/poverty_from_wb.csv:
    title: Poverty headcount at the international lines
    publisher: World Bank
    url: https://data.worldbank.org/indicator/SI.POV.UMIC
    series: SI.POV.UMIC, SI.POV.DDAY
    fetcher: fetch/fetch_international.py
    unit: "% of population"
    caveats:
      - >-
        Sidecar, not drawn. Korea's poverty measure is relative — below half
        the median — and absolute dollar lines put almost nobody in Korea
        below them, which measures the scale rather than the problem.

  # ------------------------------------------- curated from harmonised
  intl/world.csv:
    title: GDP and GDP per person in current US dollars
    publisher: World Bank (World Development Indicators)
    url: https://data.worldbank.org/indicator/NY.GDP.MKTP.CD?locations=KR
    series: NY.GDP.MKTP.CD (as US$ bn), NY.GDP.PCAP.CD
    fetcher: curated, from intl/world_from_wb.csv
    official: false
    unit: US$ bn; US$
    caveats:
      - >-
        Copied across from the sidecar after review, GDP rescaled to
        billions. GDP per person matches the Bank of Korea construction in
        macro/gdp.csv within 1% (36,227 against 36,441 in 2025).

  fiscal/general_government_imf.csv:
    title: General government revenue, expenditure, balances and gross debt
    publisher: IMF (World Economic Outlook and Fiscal Monitor)
    url: https://www.imf.org/external/datamapper/GGXWDG_NGDP@WEO/KOR
    series: GGR_G01_GDP_PT, G_X_G01_GDP_PT, GGXCNL_NGDP, GGXONLB_G01_GDP_PT, GGXWDG_NGDP
    fetcher: curated, from fiscal/general_government_from_imf.csv
    official: false
    unit: "% of GDP"
    caveats:
      - >-
        Begins in 2012: the IMF publishes no general-government series for
        Korea before it. The fiscal plate draws the Bank of Korea's own
        account (fiscal/government.csv) for the earlier years as a separate
        segment.
      - >-
        Gross debt is Korea's own D2 (general government): 33.5% in 2012
        in both. 2025 may be an IMF estimate.

  trade/trade_gdp.csv:
    title: Exports and imports of goods and services, % of GDP
    publisher: World Bank (national accounts)
    url: https://data.worldbank.org/indicator/NE.EXP.GNFS.ZS?locations=KR
    series: NE.EXP.GNFS.ZS, NE.IMP.GNFS.ZS
    fetcher: curated, from trade/trade_from_wb.csv
    official: false
    unit: "% of GDP"
    caveats:
      - >-
        Goods and services on the national-accounts basis. The trade
        balance on the plate is their difference. The customs goods balance
        in US$ (trade/trade.csv) is a different measure and is quoted in a
        note.

  macro/household_bis.csv:
    title: Household debt and debt service ratio, BIS
    publisher: BIS (total credit statistics, debt service ratios)
    url: https://data.bis.org/topics/TOTAL_CREDIT
    series: WS_TC Q.KR.H.A.M.770.A; WS_DSR Q.KR.H — Q4 values
    fetcher: curated, from macro/household_credit_from_bis.csv and macro/debt_service_from_bis.csv
    official: false
    unit: "% of GDP; % of disposable income"
    caveats:
      - >-
        Year-end (Q4) values. 2026, with one quarter published, is left out.
        Credit covers households and NPISHs from every lender, so it reads
        well above the Bank of Korea's 가계신용 ratio (88.1% against 73.9%
        of GDP in 2025); the credit plate draws both and says which is which.

  social/security_intl.csv:
    title: Homicide, suicide and road-death rates, international estimates
    publisher: UNODC (homicide) and WHO (suicide, road deaths), via the World Bank
    url: https://data.worldbank.org/indicator/VC.IHR.PSRC.P5?locations=KR
    series: VC.IHR.PSRC.P5, SH.STA.SUIC.P5, SH.STA.TRAF.P5
    fetcher: curated, from social/security_from_wb.csv
    official: false
    unit: per 100,000 people
    caveats:
      - >-
        Drawn beside the national series as the comparison line. WHO's
        suicide estimate is modelled and age-standardised, so it runs
        above Statistics Korea's crude rate; its road-death estimate runs
        above the police count. Both end before the national series do.

  social/poverty_wb.csv:
    title: Poverty headcount at US$8.30 a day (2021 PPP)
    publisher: World Bank (Poverty and Inequality Platform)
    url: https://data.worldbank.org/indicator/SI.POV.UMIC?locations=KR
    series: SI.POV.UMIC
    fetcher: curated, from social/poverty_from_wb.csv
    official: false
    unit: "% of population"
    caveats:
      - >-
        The spine's international line, drawn beside Korea's relative
        measure. It puts almost nobody in Korea below it, which is the point
        of drawing both.

  social/gini_wb.csv:
    title: Gini index, World Bank
    publisher: World Bank (Poverty and Inequality Platform)
    url: https://data.worldbank.org/indicator/SI.POV.GINI?locations=KR
    series: SI.POV.GINI
    fetcher: curated, from social/gini_from_wb.csv
    official: false
    unit: index, 0 to 100
    caveats:
      - Irregular years; drawn as a thin comparison line beside the two national surveys.

  # ------------------------------------------- filled for the spine
  markets/bond_10y.csv:
    title: 10-year Korea Treasury Bond yield, annual average
    publisher: Bank of Korea
    url: https://ecos.bok.or.kr/
    series: ECOS 721Y001 (5050000, 국고채 10년), cycle A
    fetcher: fetch/fetch_bok.py
    unit: "% per year"
    caveats:
      - >-
        The annual average ECOS publishes. Cross-checked against the OECD's
        long-term rate for Korea (FRED IRLTLT01KRA156N): 5.15 in 2006, 1.70
        in 2019 and 2.89 in 2025 in both.

  social/migration.csv:
    title: International migration — arrivals, departures and net migration
    publisher: Statistics Korea — International Migration Statistics, via e-National Indicators
    url: https://www.index.go.kr/
    series: index.go.kr 101401/1014 — 국제인구이동 (계 = Koreans and foreigners)
    fetcher: fetch/fetch_migration.py
    unit: people per year
    caveats:
      - >-
        Koreans and foreigners together, the 계 rows of the table. The
        demography plate divides net migration by Statistics Korea's
        mid-year total population (social/population.csv), which includes
        foreign residents, the same scope as the count. Cross-check: the
        World Bank's WPP estimate (social/demography_from_wb.csv) gives
        128,622 for 2019 against 31,775 here — the WPP smooths across
        years and is a model, not a count, which is why the national count
        is drawn.
      - >-
        2021 is the one negative year (-65,978): borders closed and
        arrivals fell to 410,398.
      - >-
        An international migrant is a person entering or leaving Korea for
        more than 90 days. This is not the Ministry of Justice count of all
        border crossings. The source table was reviewed through 2025: 2024
        has 727,357 arrivals, 601,954 departures and net 125,403; 2025 has
        685,242, 610,860 and 74,382.

  migration/flows_by_citizenship.csv:
    title: International migration by Korean and foreign citizenship
    publisher: Statistics Korea — International Migration Statistics, via e-National Indicators
    url: https://www.index.go.kr/unify/idx-info.do?idxCd=1014
    series: index.go.kr 101401/1014 — 국제인구이동, 내국인 and 외국인 groups
    fetcher: fetch/fetch_migration.py
    unit: people per year
    caveats:
      - >-
        The Korean- and foreign-citizen rows use the same more-than-90-day
        definition and revision vintage as the total flow in
        social/migration.csv. For every year, the two citizenship components
        sum exactly to the total arrivals, departures and net migration.
      - >-
        Citizenship is not birthplace. A naturalised Korean is in the Korean
        group even if born abroad. The migration plate uses these rows only
        for its explicitly labelled citizenship lens.
      - >-
        Known-value check for 2024: Korean citizens 276,490 in, 248,843 out,
        net +27,647; foreign citizens 450,867 in, 353,111 out, net +97,756.

  migration/foreign_residents_census.csv:
    title: Resident population by Korean and foreign citizenship
    publisher: Statistics Korea — Population and Housing Census (register-based census)
    url: https://www.kostat.go.kr/board.es?act=view&bid=11739&list_no=439063&mid=a20108010000
    series: 2024 Population and Housing Census, major-indicators table
    fetcher: fetch/fetch_migration.py
    unit: thousand people; percent of total census population
    caveats:
      - >-
        Stock at 1 November, on the census's citizenship definition and its
        own same-date population denominator. It is not a foreign-born
        series, and the plate never calls it one. Counts in the English
        release are rounded to the nearest thousand; the shares are the
        publisher's displayed one-decimal values.
      - >-
        The audited release provides 2022–2024 in one consistent table:
        resident foreign citizens 1.752m (3.4%), 1.935m (3.7%) and 2.043m
        (3.9%), against census populations 51.692m, 51.775m and 51.806m.
        This deliberately does not mix the census numerator with the
        mid-year projection denominator used for annual migration flows.

  # ------------------------------------------------ harmonised
  fiscal/cofog_from_oecd.csv:
    title: 'National Accounts at a Glance, chapter 6A, OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_OTEF, measure OTES13F'
    publisher: 'OECD'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_OTEF,/A.KOR.OTES13F...'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        General-government total expenditure by COFOG division, % of GDP
        (the OECD derives it from table 11, which itself carries only
        national-currency levels). Columns: total, social_protection,
        health, education, general_public_services, economic_affairs,
        defence, public_order, environment, housing, recreation_culture.
        The fetcher checks the divisions sum to the total within 0.15
        pt. Matches the BOK's own COFOG total
        (fiscal/spending_by_function.csv) for 2019 to 0.01 pt.

  fiscal/general_government_from_imf.csv:
    title: 'World Economic Outlook and Fiscal Monitor, via DataMapper (GGR_G01_GDP_PT (Fiscal Monitor), G_X_G01_GDP_PT (Fiscal Monitor), GGXCNL_NGDP (WEO), GGXONLB_G01_GDP_PT (Fiscal Monitor), GGXWDG_NGDP (WEO))'
    publisher: 'IMF'
    url: 'https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        General government, % of GDP, calendar years. Balance and gross
        debt are WEO indicators; revenue, expenditure and the primary
        balance are not WEO codes on DataMapper (GGR_NGDP, GGX_NGDP and
        GGXONLB_NGDP do not exist there) and come from the Fiscal
        Monitor, served from the same database — the fetcher checks the
        WEO and Fiscal Monitor balances agree within 0.1 pt before
        writing. Stops at 2025: later IMF years are staff projections.
        2025 itself may be an IMF estimate. Columns: revenue_pct_gdp,
        expenditure_pct_gdp, balance_pct_gdp, primary_balance_pct_gdp,
        gross_debt_pct_gdp. The IMF's general-government series for
        Korea begin in 2012; earlier years are blank. Korea's own GG
        account is fiscal/government.csv.

  fiscal/public_investment_from_oecd.csv:
    title: 'National Accounts at a Glance, chapter 6, OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI, measure P51GS13'
    publisher: 'OECD'
    url: 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.NAD,DSD_NAAG_VI@DF_NAAG_VI,/A.KOR.P51GS13...'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        gov_gfcf_pct_gdp: general-government gross fixed capital
        formation, % of GDP (spending slot 4).

  intl/world_from_wb.csv:
    title: 'World Development Indicators (NY.GDP.MKTP.CD, NY.GDP.PCAP.CD, FI.RES.TOTL.CD)'
    publisher: 'World Bank'
    url: 'https://api.worldbank.org/v2/country/KOR/indicator/NY.GDP.MKTP.CD?format=json'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        Current US$: GDP, GDP per person, and total reserves including
        gold (year-end, IMF IFS via the WDI). A harmonised cross-country
        series for the world chapter, not the national accounts; spot-
        checked and cross-checked in the fetcher. Columns: gdp_usd,
        gdp_per_person_usd, reserves_usd.

  macro/debt_service_from_bis.csv:
    title: 'debt service ratios, WS_DSR Q.KR.H'
    publisher: 'BIS'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_DSR/1.0/Q.KR.H?format=csv'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        Interest plus amortisation on household debt as % of household
        disposable income. A BIS estimate built on an assumed average
        maturity and the aggregate lending rate. Q4 value, quarter mean
        and the number of quarters, as in the credit file.

  macro/economy_from_wb.csv:
    title: 'World Development Indicators (NE.GDI.FTOT.ZS, SL.UEM.TOTL.ZS)'
    publisher: 'World Bank'
    url: 'https://api.worldbank.org/v2/country/KOR/indicator/NE.GDI.FTOT.ZS?format=json'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        gfcf_pct_gdp is whole-economy gross fixed capital formation, %
        of GDP (spending slot 3). unemployment_pct is the ILO modelled
        estimate, % of the labour force — harmonised, and not the
        national LFS headline, which stays the national line. Columns:
        gfcf_pct_gdp, unemployment_pct.

  macro/household_credit_from_bis.csv:
    title: 'total credit statistics, WS_TC Q.KR.H.A.M.770.A'
    publisher: 'BIS'
    url: 'https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/Q.KR.H.A.M.770.A?format=csv'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        Credit to households and NPISHs from all sectors, market value,
        % of GDP, adjusted for breaks. hh_credit_pct_gdp_q4 is the Q4
        (year-end) value the spine draws; _qavg is the mean of the
        quarters published and _quarters says how many, so the running
        year reads as one quarter, not a year. Wider than bank-loan
        series: every lender and debt securities are in it. Reads above
        the BOK's 가계신용 ratio (macro/household_credit.csv), which covers
        fewer lenders and excludes NPISHs.

  social/demography_from_wb.csv:
    title: 'World Development Indicators (SP.POP.TOTL, SP.POP.TOTL.FE.IN, SP.DYN.TFRT.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN, SM.POP.NETM), from the UN World Population Prospects and national vital statistics'
    publisher: 'World Bank'
    url: 'https://api.worldbank.org/v2/country/KOR/indicator/SP.POP.TOTL.FE.IN?format=json'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        Mid-year population (total and female), so a rate per 100,000
        women can be computed on a mid-year denominator. Crude birth and
        death rates are per 1,000 people. net_migration is a COUNT of
        people (WPP estimate), not a rate: per 1,000 = net_migration /
        population x 1,000 for the same year. WPP figures for recent
        years are estimates and are revised with each WPP. Columns:
        population, population_female, fertility, birth_rate_per_1000,
        death_rate_per_1000, net_migration.

  social/security_from_wb.csv:
    title: 'World Development Indicators: VC.IHR.PSRC.P5 (UNODC), SH.STA.SUIC.P5 and SH.STA.TRAF.P5 (WHO Global Health Estimates)'
    publisher: 'World Bank'
    url: 'https://api.worldbank.org/v2/country/KOR/indicator/VC.IHR.PSRC.P5?format=json'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        All per 100,000 people. Intentional homicide is UNODC's
        harmonised count, which usually differs from the national police
        or death-certificate series in both directions. Suicide and
        road-traffic deaths are WHO modelled estimates (suicide age-
        standardised), ending 2021 and 2019 respectively in this
        release; later years are blank, not zero. Columns:
        homicide_per_100k, suicide_per_100k, road_deaths_per_100k.

  trade/trade_from_wb.csv:
    title: 'World Development Indicators (NE.EXP.GNFS.ZS, NE.IMP.GNFS.ZS)'
    publisher: 'World Bank'
    url: 'https://api.worldbank.org/v2/country/KOR/indicator/NE.EXP.GNFS.ZS?format=json'
    fetcher: fetch/fetch_harmonised.py
    official: false
    caveats:
      - >-
        Exports and imports of goods AND services, national-accounts
        basis, % of GDP — not a customs goods series. The trade balance
        is their difference and is not stored. Columns: exports_pct_gdp,
        imports_pct_gdp.
