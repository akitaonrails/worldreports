# Data provenance — every series for China  (verification pass 1–2 applied;
# fetch phase applied for the live sources — see refreshed_by)
#
# Written before any CSV, per SOURCING_A_COUNTRY.md §3. Endpoints were
# curl'd live on 2026-10-22; the marker under each entry records the outcome.
# Files now staged under data/ are listed with the fetcher that refreshes
# them; a file listed here but parked under `pending` has no CSV yet and
# nothing may invent one.
#
# THE CHINA RULE (COUNTRIES.md row 7): the NBS publishes a full set of numbers;
# the atlas publishes what NBS publishes, marked official: true, and beside it
# the World Bank / IMF / UN reading of the SAME quantity, marked official:
# false, with a note stating where the two disagree and by how much. TWO LINES,
# NEVER ONE SPLICED LINE. The NBS machine layer is 403-blocked from this
# machine (see pending), so today only the international side of each pair is
# staged; the official side rides beside it in the same file or joins when the
# block lifts — never spliced, never averaged, never substituted.
#
# LIVE-PROBE SUMMARY (2026-10-22, from this machine):
#   World Bank API ............ LIVE  (JSON, lastupdated 2026-10-08)
#   IMF DataMapper API ........ LIVE  (JSON; /CHN doesn't filter — see quirks;
#                                      Akamai 403s curl's TLS fingerprint — the
#                                      fetchers' urllib browser UA gets through)
#   UNDP HDR25 CSV ............ LIVE  (200, text/csv, ~2.0 MB)
#   Yahoo 000001.SS ........... LIVE  (chart v8 JSON; SSE Composite)
#   UN Comtrade public preview  LIVE  (200, no key, all partners returned for
#                                      C/A/HS period=2023; 429s if polled fast)
#   NBS data.stats.gov.cn ..... 403 BLOCKED (easyquery.htm refuses; portal HTML reachable)
#   GACC customs.gov.cn ....... 412 BLOCKED (anti-bot precondition)
#   PBoC pbc.gov.cn ........... portal 200 (machine endpoint not yet isolated)
#   SAFE safe.gov.cn .......... portal 200
#   MOF  mof.gov.cn ........... portal 200
#
# OFFICIAL-BLOCKED = the authoritative publisher exists but its machine layer is
# unreachable from here (403/412); parked on the pending list, never scraped.

# --------------------------------------------------------------------------
# economy — GDP (level, growth, per-head). NBS-official beside WB/IMF.
# --------------------------------------------------------------------------
economy:
  gdp_growth_intl.csv:
    source: World Bank NY.GDP.MKTP.KD.ZG + IMF DataMapper NGDP_RPCH (ISO3=CHN)
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.MKTP.KD.ZG?date=2006:2025&format=json ; https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/CHN"
    refreshed_by: "fetch/fetch_harmonised.py → sidecars economy/gdp_growth_intl_from_wb.csv + economy/gdp_growth_intl_from_imf.csv; curated staged from both, values unchanged (2026-10-22)"
    official: false
    notes: >-
      VERIFIED 2026-10-22 and refetched by the fetcher the same day. WB annual
      real growth (JSON [meta,[obs]]): 2025 4.96, 2024 4.96, 2023 5.42,
      2022 3.13, 2021 8.57, 2020 2.34 (%). IMF CHN annual: 2006 12.7, 2007 14.2,
      2008 9.6, 2009 9.4, 2010 10.6, 2011 9.5, 2012 7.8, 2013 7.8, 2014 7.5,
      2015 7.0, 2016 6.8, 2017 6.9, 2018 6.8, 2019 6.1, 2020 2.3, 2021 8.6,
      2022 3.1, 2023 5.4, 2024 5.0, 2025 5.0. Confirmed programmatically again
      at fetch time: ZERO negative annual real-growth years for CHN across the
      whole WEO body — the band evidence behind `bands: []`. The NBS official
      reading (pending, 403-blocked) is usually a few tenths off these (e.g.
      NBS 2023 5.2 vs WB 5.42 vs IMF 5.4); when it opens it joins as its own
      labelled column, and the three are never averaged or spliced. DATAMAPPER
      QUIRK: the `/CHN` path segment does NOT filter — the response carries all
      229 countries under values.<IND>; the fetcher reads values.<IND>.CHN.
  gdp_growth_intl_from_wb.csv:
    source: World Bank — NY.GDP.MKTP.KD.ZG
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.MKTP.KD.ZG?format=json&per_page=200&date=2005:2026"
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: "Fetcher sidecar behind gdp_growth_intl.csv; diff before adopting."
  gdp_growth_intl_from_imf.csv:
    source: IMF DataMapper — NGDP_RPCH (WEO, outturn years only; WEO projections beyond 2025 are never cached as data)
    url: "LIVE — https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/CHN"
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: "Fetcher sidecar behind gdp_growth_intl.csv; diff before adopting."
  gdp_usd.csv:
    source: World Bank — NY.GDP.MKTP.CD (ISO3=CHN)
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.MKTP.CD?date=2006:2025&format=json"
