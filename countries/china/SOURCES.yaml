    official: false
    notes: >-
      VERIFIED. Reserves incl. gold, current US$, year-end: 2025
      3,748,744,952,817.94 (US$3.75tn), 2024 US$3.46tn. The gold-revaluation
      step in 2024-25 lifts the IFS figure; the SAFE national figure is the one
