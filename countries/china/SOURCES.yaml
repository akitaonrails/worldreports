    official: false
    notes: >-
      VERIFIED. CHN row (the `/CHN` segment does NOT filter — extract
      values.GGXWDG_NGDP.CHN from the 226-country body): 2006 25.2, 2009 33.9,
      2010 33.1, then a steep climb 2018 55.7 -> 2020 70.6 -> 2023 84.1 ->
      2025 98.6 (% of GDP; WEO projections past 2025 are not staged). This is
      the IMF's broad general-government perimeter — a far larger number than
      the MOF's narrow on-budget debt (pending, mof.gov.cn), because it
      includes the local-government/LGFV-adjacent bodies the on-budget figure
      excludes. That several-dozen-point gap IS the finding. Drawn beside the
      MOF figure with the perimeter stated; never spliced.
  debt_intl_pct_gdp_from_imf.csv:
