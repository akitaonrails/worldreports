# --------------------------------------------------------------------------
# migration — diaspora/international stock (small) vs INTERNAL floating pop (big).
# --------------------------------------------------------------------------
migration:
  migrant_stock_intl.csv:
    source: World Bank — SM.POP.TOTL.ZS (UN DESA migrant stock, % of population)
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/SM.POP.TOTL.ZS?date=2006:2024&format=json"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: >-
      VERIFIED. 2024 = 0.1% of population (2023 null). China's INTERNATIONAL
      migration is marginal on this definition — the real migration story is
      internal. Flow vs stock in separate panels.
  floating_population_nbs.csv:
    source: NBS — floating / migrant population (流动人口) and hukou vs resident pop
    url: "OFFICIAL-BLOCKED (403) — census bulletins + population communiqués on the portal"
    refreshed_by: "pending — fetch/fetch_nbs.py (Phase B)"
    official: true
    notes: >-
      Hukou (registered) vs permanent-resident population is the definitional
      split; the floating population is the difference (hundreds of millions).
      Census years rebase — annotate; do NOT interpolate across the census boundary.

# --------------------------------------------------------------------------
# world / comparables — the legibility layer.
# --------------------------------------------------------------------------
international:
  hdi.csv:
    source: UNDP — Human Development Report 2025, composite indices complete time series
    url: "LIVE — https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: >-
      VERIFIED. 200, text/csv, ~2.0 MB, one row per country; the CHN row is
      present and its HDI sub-index climbs from ~0.49 (1990) to ~0.80 (latest).
      ONE VINTAGE throughout — the HDR recomputes the whole back-series at each
      methodology change, so a trend assembled across report years is partly an
      artefact of the reports.

# --------------------------------------------------------------------------
# PENDING — unreachable / not-yet-verified. Do not block; the lane moves on.
# --------------------------------------------------------------------------
pending:
  - id: nbs-api-blocked
    what: >-
      NBS machine API (data.stats.gov.cn/easyquery.htm) returned HTTP 403 on
      every variant tried today — root, /english/, with and without a browser
      User-Agent, annual (hgyr) and the trade query shape (~1-1.8s each). The
      plain portals www.stats.gov.cn and stats.gov.cn/english/ DO return HTTP 200
      (root slow, ~6s). So NBS-official series (GDP level, quarterly growth,
      urban unemployment, Gini, births/deaths, floating population) cannot be
      pulled from the API here. Do not scrape a 403. Next session: try an
      authenticated/alternate NBS route, the English HTML portal tables, or take
      the official figure from a named NBS communiqué and cite the document.
  - id: gacc-blocked
    what: >-
      General Administration of Customs www.customs.gov.cn returned HTTP 412
      (Precondition Failed / anti-bot) from this machine. Goods-trade-by-partner
      is parked. UN Comtrade (live preview) and the NBS English portal are the
      reachable cross-checks; GACC itself needs an alternate route in Phase B.
  - id: pboc-safe-mof-endpoints
    what: >-
      PBoC, SAFE and MOF portals are reachable (all 200) but the machine-readable
      series endpoints (LPR history, USD/CNY fixing vs CFETS close, reserves,
      budget execution) were not isolated this session. Named in refreshed_by as
      fetch_pboc.py / fetch_safe.py / fetch_mof.py for the fetch swarm.
  - id: security-homicide-none
    what: >-
      Security/homicide: likely NO credible public series. China does not publish
      an accessible criminal-homicide series comparable to other atlas countries.
      Pending honestly — do NOT scrape an estimate. If nothing official surfaces,
      the Security chapter departs from the spine (record in DATA_NOTES.md in a
      later phase, as SOURCING_A_COUNTRY.md §1 requires for departures).
  - id: quarterly-band-confirm
    what: >-
      bands: [] is justified on annual evidence (no negative real-GDP year in the
      window in either WB or IMF — verified today) and the known single-quarter
      COVID contraction (Q1 2020 negative q/q, Q2 2020 sharply positive). A
      two-consecutive-quarter test needs the QUARTERLY series, which is blocked
      with NBS (403). Confirm the q/q signs when an NBS route opens; the 2020
      shock and the 2022 / 2024-25 slowdowns are PLATE EVENTS, not bands, either way.
