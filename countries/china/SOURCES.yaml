      population_intl.csv (WB/UN projection), never spliced.
  population_intl.csv:
    source: World Bank — SP.POP.TOTL (UN World Population Prospects)
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/SP.POP.TOTL?date=2006:2025&format=json"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
