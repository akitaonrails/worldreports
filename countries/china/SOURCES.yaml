# --------------------------------------------------------------------------
# PENDING — unreachable / not-yet-isolated publishers. Do not block; the lane
# moves on. These entries are PROVENANCE CLAIMS about planned files, not a
# dataset list: nothing under data/ exists for them yet, and no number may be
# invented to fill one. Each names the file, the publisher, the blocked or
# unisolated channel, and what a later phase must do instead of scraping.
# --------------------------------------------------------------------------
pending:
  - id: nbs-api-blocked
    files: >-
      economy/gdp_growth_nbs.csv (official: true), economy/gdp_level_nbs.csv
      (official: true), people/unemployment_nbs.csv (official: true),
      people/gini_nbs.csv (official: true), demography/population_nbs.csv
      (official: true), migration/floating_population_nbs.csv (official: true)
    what: >-
      NBS machine API (data.stats.gov.cn/easyquery.htm, dbcode hgyr annual /
      hgjd quarterly, zb codes like A020101 for GDP) returned HTTP 403 on
      every variant tried 2026-10-22 — root, /english/, with and without a
      browser User-Agent, annual and the trade query shape (~1-1.8s each,
      295-313-byte error bodies). The plain portals www.stats.gov.cn and
      stats.gov.cn/english/ DO return HTTP 200 (root slow, ~6s). So the
      NBS-official series the atlas wants (GDP level in CNY and real growth,
      surveyed urban unemployment — the ~5% headline, distinct from the older
      REGISTERED rate, national Gini last published ~2022, births/deaths/life
      expectancy with census rebases at 2010 and 2020, and the hukou-vs-
      resident floating population) cannot be pulled from the API here.
      Do not scrape a 403. Next session: an authenticated/alternate NBS
      route, the English HTML portal tables, or take the figure from a named
      NBS communiqué/census bulletin and cite the document by title and date.
      Every official NBS line joins BESIDE the staged international twin in
      the same chapter, never spliced.
  - id: gacc-blocked
    files: >-
      trade/trade_goods_nbs_gacc.csv (official: true, goods exports/imports
      by partner and total, customs basis)
    what: >-
      General Administration of Customs www.customs.gov.cn returned HTTP 412
      (Precondition Failed / anti-bot) from this machine. Goods-trade-by-
      partner is parked. UN Comtrade (staged beside, see trade/) and the NBS
      English portal are the reachable cross-checks; GACC itself needs an
      alternate route in a later phase. GACC counts goods at customs value at
      the border; the staged BoP-basis openness series is a different,
      larger quantity (services included) — two labelled lines, never spliced.
  - id: pboc-safe-mof-endpoints
    files: >-
      markets/policy_rate.csv (official: true; PBoC LPR since Aug 2019 +
      benchmark lending rate before — a definitional break, two columns,
      never one line), markets/usdcny.csv (official: true; PBoC/CFETS central
      parity 中间价 AND the CFETS market close, two series, never one; CNY
      per USD so a rising line is a WEAKER renminbi), markets/reserves_nbs_safe.csv
      (official: true; SAFE reserve-assets series,
      ~US$3.2-3.7tn, beside the staged reserves_intl.csv), fiscal/
      fiscal_balance_mof.csv (official: true; MOF announced budget deficit —
      a narrow general-public-budget concept, NOT the general-government
      balance), fiscal/debt_narrow_mof.csv (official: true; MOF on-budget
      central+local debt, excluding LGFVs, beside the staged IMF broad
      perimeter).
    what: >-
      PBoC, SAFE and MOF portals are reachable (all 200: pbc.gov.cn 2.75s,
      safe.gov.cn 3.46s, mof.gov.cn 1.61s) but the machine-readable series
      endpoints (LPR history, USD/CNY fixing vs CFETS close, reserves,
      budget execution) were not isolated on 2026-10-22. Planned fetchers:
      fetch/fetch_pboc.py, fetch/fetch_safe.py, fetch/fetch_mof.py. Where a
      communiqué is the only readable route, the figure is curated BY HAND
      with the document named in the notes — never invented, never rounded
      off a secondary report.
  - id: security-homicide-none
    what: >-
      Security/homicide: likely NO credible public series. China does not publish
