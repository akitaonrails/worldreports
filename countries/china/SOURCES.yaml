fiscal:
  debt_intl_pct_gdp.csv:
    source: IMF DataMapper — GGXWDG_NGDP (general government gross debt, % of GDP)
    url: "LIVE — https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP/CHN"
    refreshed_by: "fetch/fetch_harmonised.py → sidecar fiscal/debt_intl_pct_gdp_from_imf.csv; curated staged from it, values unchanged (2026-10-22)"
    official: false
    notes: >-
      VERIFIED. CHN row (the `/CHN` segment does NOT filter — extract
      values.GGXWDG_NGDP.CHN from the 226-country body): 2006 25.2, 2009 33.9,
      2010 33.1, then a steep climb 2018 55.7 -> 2020 70.6 -> 2023 84.1 ->
      2025 98.6 (% of GDP; WEO projections past 2025 are not staged). This is
      the IMF's broad general-government perimeter — a far larger number than
      the MOF's narrow on-budget debt (pending, mof.gov.cn), because it
      includes the local-government/LGFV-adjacent bodies the on-budget figure
      excludes. That several-dozen-point gap IS the finding. Drawn beside the
      MOF figure with the perimeter stated; never spliced.
  debt_intl_pct_gdp_from_imf.csv:
    source: IMF DataMapper — GGXWDG_NGDP (outturn years to 2025; projections beyond are never cached as data)
    url: "LIVE — https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP/CHN"
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: "Fetcher sidecar behind debt_intl_pct_gdp.csv; diff before adopting."

# --------------------------------------------------------------------------
# trade — goods exports/imports by partner. GACC/NBS (blocked) vs UN Comtrade.
# --------------------------------------------------------------------------
trade:
  trade_intl_openness.csv:
    source: World Bank — NE.TRD.GNFS.ZS plus NE.EXP.GNFS.ZS / NE.IMP.GNFS.ZS
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/NE.TRD.GNFS.ZS?date=2006:2025&format=json (and the EXP/IMP indicators)"
    refreshed_by: "fetch/fetch_harmonised.py → sidecar trade/trade_intl_openness_from_wb.csv; curated staged from it, values unchanged (2026-10-22)"
    official: false
    notes: >-
      VERIFIED. 2025 = 37.96% of GDP (exports 21.07 + imports 16.89; the
      fetcher asserts the two parts sum to the total within 0.1). Goods+
      services, BoP basis — the spine's trade slot-1 unit; fell from the
      mid-2000s high (~60%+) — the openness story. It is a cross-check on
      GACC's customs-goods figures, NOT the same quantity: a BoP total
      includes services and is counted on a different basis (SOURCING §4).
      GACC itself is 412-blocked (pending); nothing is spliced.
  trade_intl_openness_from_wb.csv:
    source: World Bank — NE.TRD.GNFS.ZS, NE.EXP.GNFS.ZS, NE.IMP.GNFS.ZS
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/{code}?format=json&per_page=200&date=2005:2026"
    refreshed_by: fetch/fetch_harmonised.py
    official: false
    notes: "Fetcher sidecar behind trade_intl_openness.csv; diff before adopting."
  trade_comtrade_partner.csv:
    source: UN Comtrade public preview (reporter 156 = China), HS goods by partner
    url: "LIVE — https://comtradeapi.un.org/public/v1/preview/C/A/HS?reporterCode=156&period=2023&cmdCode=TOTAL (no key)"
    refreshed_by: "fetch/fetch_comtrade.py → sidecar trade/trade_comtrade_partner_from_comtrade.csv; curated staged from it, values unchanged (2026-10-22)"
    official: false
    notes: >-
      VERIFIED 200 (no auth). 2023 snapshot: World rows US$3,379,747,834,884
      (X) / US$2,556,763,018,595 (M), asserted at fetch time and matching
      GACC's announced 2023 customs totals (~US$3.38tn / ~US$2.56tn) in order
      of magnitude; the 220 partner rows sum EXACTLY to the World totals, so
      this query is not row-capped and top-10 shares are true shares.
      Comtrade is on its own harmonised definition — a cross-check on partner
      totals, never a substitute for the GACC national figure and never
      spliced with it or with the BoP-basis openness series. Quirks: 842 is
      Comtrade's legacy United States, 344 is Hong Kong China; partner 156
      (re-imports in processing trade, $104.3bn of M) is kept out of the
      panel but inside the World denominator; Comtrade's China report carries
      no Taiwan partner code — the ~$200bn GACC books as Taiwan imports lands
      in the 'Other Asia nes' residual (490), and that attribution is the
      atlas's reading, flagged in the CSV header, not a Comtrade field.
  trade_comtrade_partner_from_comtrade.csv:
    source: UN Comtrade public preview — period 2023, flows X and M, cmdCode TOTAL, all partners
    url: "LIVE — https://comtradeapi.un.org/public/v1/preview/C/A/HS?reporterCode=156&period=2023&cmdCode=TOTAL"
    refreshed_by: fetch/fetch_comtrade.py
    official: false
    notes: "Fetcher sidecar behind trade_comtrade_partner.csv; the World row and all partner sums are shape-asserted before caching."

