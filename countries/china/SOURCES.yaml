# Data provenance — every series for China  (verification pass 1–2 applied)
#
# Written before any CSV, per SOURCING_A_COUNTRY.md §3. No data/ files exist
# yet; this is the plan of record the fetch swarm will fill in. Endpoints were
# curl'd live on 2026-10-22; the marker under each entry records the outcome.
#
# THE CHINA RULE (COUNTRIES.md row 7): the NBS publishes a full set of numbers;
# the atlas publishes what NBS publishes, marked official: true, and beside it
# the World Bank / IMF / UN reading of the SAME quantity, marked official:
# false, with a note stating where the two disagree and by how much. TWO LINES,
# NEVER ONE SPLICED LINE.
#
# LIVE-PROBE SUMMARY (2026-10-22, from this machine):
#   World Bank API ............ LIVE  (JSON, lastupdated 2026-10-08)
#   IMF DataMapper API ........ LIVE  (JSON; /CHN segment does NOT filter — see quirks)
#   UNDP HDR25 CSV ............ LIVE  (200, text/csv, ~2.0 MB)
#   Yahoo 000001.SS ........... LIVE  (chart v8 JSON; SSE Composite)
#   UN Comtrade public preview  LIVE  (200, no key, row-capped preview)
#   NBS data.stats.gov.cn ..... 403 BLOCKED (easyquery.htm refuses; portal HTML reachable)
#   GACC customs.gov.cn ....... 412 BLOCKED (anti-bot precondition)
#   PBoC pbc.gov.cn ........... portal 200 (machine endpoint not yet isolated)
#   SAFE safe.gov.cn .......... portal 200
#   MOF  mof.gov.cn ........... portal 200
#
# UNVERIFIED = endpoint named but not curl'd this session.
# OFFICIAL-BLOCKED = the authoritative publisher exists but its machine layer is
# unreachable from here (403/412); parked on the pending list, never scraped.

# --------------------------------------------------------------------------
# economy — GDP (level, growth, per-head). NBS-official beside WB/IMF.
# --------------------------------------------------------------------------
economy:
  gdp_growth_nbs.csv:
    source: NBS (国家统计局) — national accounts, real GDP growth (annual + quarterly)
    url: "OFFICIAL-BLOCKED — https://data.stats.gov.cn/easyquery.htm?m=QueryData&dbcode=hgjd (quarterly) / hgyr (annual): HTTP 403 from this machine. Portal stats.gov.cn and stats.gov.cn/english/ return 200 (english portal ~1.9s, root ~6s)."
    refreshed_by: "pending — fetch/fetch_nbs.py (Phase B); blocked pending below"
    official: true
    notes: >-
      The NBS's own real GDP growth series (the headline the country reports:
      ~10% 2006-2012, easing to ~5% by 2024-25). Machine API (easyquery.htm)
      returned HTTP 403 on every variant tried (root, /english/, with and
      without a browser UA, ~1-1.8s each). The annual figures are also in NBS
      statistical communiqués on the reachable portal. Drawn beside
      gdp_growth_intl.csv; the two disagree by tenths of a point (see notes
      there) and are never spliced.
  gdp_growth_intl.csv:
    source: World Bank NY.GDP.MKTP.KD.ZG + IMF DataMapper NGDP_RPCH (ISO3=CHN)
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.MKTP.KD.ZG?date=2006:2025&format=json ; https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/CHN"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: >-
      VERIFIED 2026-10-22. WB annual real growth (JSON [meta,[obs]]): 2025 4.96,
      2024 4.96, 2023 5.42, 2022 3.13, 2021 8.57, 2020 2.34 (%). IMF CHN annual:
      2006 12.7, 2007 14.2, 2008 9.6, 2009 9.4, 2010 10.6, 2011 9.5, 2012 7.8,
      2013 7.8, 2014 7.5, 2015 7.0, 2016 6.8, 2017 6.9, 2018 6.8, 2019 6.1,
      2020 2.3 — NO negative annual year in the window (this is the band
      evidence). The NBS official reading is usually a few tenths from these
      (e.g. NBS 2023 5.2 vs WB 5.42); the two are drawn side by side and the
      gap stated, never averaged or spliced.
  gdp_level_nbs.csv:
    source: NBS — GDP at current prices, CNY (national accounts)
    url: "OFFICIAL-BLOCKED — data.stats.gov.cn easyquery.htm dbcode=hgyr zb=A020101; HTTP 403 this session"
    refreshed_by: "pending — fetch/fetch_nbs.py (Phase B)"
    official: true
    notes: >-
      NBS publishes the level in current CNY (and an index), not in dollars.
      This is the official level; the WB/IMF USD level below is a different
      conversion and is a cross-check, not a substitute.
  gdp_usd.csv:
    source: World Bank — NY.GDP.MKTP.CD (ISO3=CHN)
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.MKTP.CD?date=2006:2025&format=json"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: >-
      VERIFIED. Current US$: 2025 19,498,039,388,042.6 (US$19.50tn), 2024
      18,729,668,435,848, 2023 18,270,356,654,533, 2022 18,316,765,021,690,
      2021 18,201,698,719,564. Magnitude check ~US$18-19tn PASSES. CAUTION:
      the current-USD LEVEL DIPS from 2022 to 2023 (18.32tn -> 18.27tn) purely
      from the exchange rate, while real growth was +5.4% that year — the
      current-USD series is a size reading, never a growth reading. Drawn beside
      the NBS CNY level, never spliced.
  gdp_pc_usd.csv:
    source: World Bank — NY.GDP.PCAP.CD
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.PCAP.CD?date=2006:2025&format=json"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: "VERIFIED. 2025 = US$13,861.97 per person (current US$, harmonised)."

# --------------------------------------------------------------------------
# markets — policy rate, currency, index, reserves. PBoC/SAFE official + market.
# --------------------------------------------------------------------------
markets:
  policy_rate.csv:
    source: PBoC (中国人民银行) — LPR (since Aug 2019) + benchmark lending rate (before)
    url: "UNVERIFIED — portal pbc.gov.cn LIVE (200, 2.75s). Machine series endpoint not isolated this session. LPR reprinted by WB/IMF as a cross-check."
    refreshed_by: "pending — fetch/fetch_pboc.py (Phase B)"
    official: true
    notes: >-
      DEFINITIONAL BREAK, map it as two columns: the benchmark one-year lending
      rate (pre-2019) and the Loan Prime Rate (LPR, monthly since Aug 2019) are
      different instruments — never one line. The 2019 switch is annotated.
      The deposit-reserve ratio and OMO rates are further series.
  usdcny.csv:
    source: PBoC / CFETS (中国外汇交易中心) — central parity (中间价) + market close
    url: "UNVERIFIED — CFETS chinamoney.com.cn / PBoC daily fixing. Not isolated this session."
    refreshed_by: "pending — fetch/fetch_pboc.py (Phase B)"
    official: true
    notes: >-
      TWO SERIES, NEVER ONE: the PBoC daily central parity / fixing (中间价)
      and the CFETS market closing rate are different quantities. Both kept as
      separate columns. Direction CNY per USD — a RISING line is a WEAKER renminbi.
  reserves_nbs_safe.csv:
    source: SAFE (国家外汇管理局) — international reserve assets
    url: "UNVERIFIED — portal safe.gov.cn LIVE (200, 3.46s). Machine series endpoint not isolated. Cross-check below is live."
    refreshed_by: "pending — fetch/fetch_safe.py (Phase B)"
    official: true
    notes: >-
      SAFE publishes the official reserve-assets figure monthly (China holds the
      world's largest reserves, ~US$3.2-3.7tn). Drawn beside reserves_intl.csv
      (the IMF IFS reading via WB), never spliced.
  reserves_intl.csv:
    source: World Bank — FI.RES.TOTL.CD (IMF IFS), ISO3=CHN
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/FI.RES.TOTL.CD?date=2006:2025&format=json"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: >-
      VERIFIED. Reserves incl. gold, current US$, year-end: 2025
      3,748,744,952,817.94 (US$3.75tn), 2024 US$3.46tn. The gold-revaluation
      step in 2024-25 lifts the IFS figure; the SAFE national figure is the one
      of record and this is the harmonised cross-check beside it.
  sse_index.csv:
    source: market — SSE Composite (上证综合指数), redistributed by Yahoo Finance
    url: "LIVE — https://query1.finance.yahoo.com/v8/finance/chart/000001.SS?period1=…&period2=…&interval=1mo (needs a browser User-Agent)"
    refreshed_by: "pending — fetch/fetch_markets.py (Phase B)"
    official: false
    notes: >-
      VERIFIED. JSON chart object; meta: symbol 000001.SS, exchange SHH
      (Shanghai), instrumentType INDEX, currency CNY, firstTradeDate 1997-07
      (867807000). Year-end closes from monthly bars. Nobody publishes a stock
      index as a statistic, so official: false and labelled on the plate.
      stooq is JS-walled from this machine (per brief) — Yahoo is the source.

# --------------------------------------------------------------------------
# fiscal — revenue, deficit, debt. MOF (narrow) + IMF (broad), side by side.
# --------------------------------------------------------------------------
fiscal:
  fiscal_balance_mof.csv:
    source: MOF (财政部) — budget execution (revenue/expenditure), announced fiscal deficit
    url: "UNVERIFIED — portal mof.gov.cn LIVE (200, 1.61s). Machine release not isolated."
    refreshed_by: "pending — fetch/fetch_mof.py (Phase B)"
    official: true
    notes: >-
      China's headline deficit is the BUDGET deficit the MOF announces (a narrow
      general-public-budget concept). It is NOT the general-government balance on
      the national-accounts basis (fiscal_balance_intl.csv) — different perimeter,
      different definition, two labelled columns.
  debt_narrow_mof.csv:
    source: MOF — central + local government debt (the official "government debt")
    url: "UNVERIFIED — mof.gov.cn; not isolated."
    refreshed_by: "pending — fetch/fetch_mof.py (Phase B)"
    official: true
    notes: >-
      The MOF's on-budget government debt EXCLUDES local government financing
      vehicles (LGFVs). This narrow perimeter is the official figure; the IMF
      broad perimeter below is the adjacent number. Two lines, both labelled.
  debt_intl_pct_gdp.csv:
    source: IMF DataMapper — GGXWDG_NGDP (general government gross debt, % of GDP)
    url: "LIVE — https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP/CHN"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: >-
      VERIFIED. CHN row (JSON keyed by iso): 2006 25.2, 2009 33.9, 2010 33.1 …
      (rising through the window). This is the IMF's broad general-government
      perimeter — a different number from the MOF's narrow on-budget debt. Drawn
      beside the MOF figure and the perimeter stated; never spliced.

# --------------------------------------------------------------------------
# trade — goods exports/imports by partner. GACC/NBS (blocked) vs UN Comtrade.
# --------------------------------------------------------------------------
trade:
  trade_goods_nbs_gacc.csv:
    source: GACC (海关总署) goods trade; NBS mirrors the same goods figures
    url: "OFFICIAL-BLOCKED — GACC customs.gov.cn HTTP 412 (anti-bot precondition) from this machine. NBS goods-trade series 403 (see economy). Reachable fallbacks below."
    refreshed_by: "pending — fetch/fetch_gacc.py (Phase B); GACC pending below"
    official: true
    notes: >-
      GACC counts goods at customs value as they cross the border; the
      balance-of-payments basis (incl. services) is a different, larger number.
      GACC is 412-blocked and the NBS trade series rides the 403 easyquery; the
      UN Comtrade preview and the open NBS English portal are the reachable
      stand-ins until the fetch swarm gets an authenticated/alternative route.
  trade_intl_openness.csv:
    source: World Bank — NE.TRD.GNFS.ZS (trade % of GDP)
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/NE.TRD.GNFS.ZS?date=2006:2025&format=json"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: >-
      VERIFIED. 2025 = 37.96% of GDP (goods+services, BoP basis). Fell from the
      mid-2000s high (~60%+) — the openness story. Comparables layer and
      magnitude cross-check on the customs goods figures.
  trade_comtrade_partner.csv:
    source: UN Comtrade public preview (reporter 156 = China), HS goods by partner
    url: "LIVE — https://comtradeapi.un.org/public/v1/preview/C/A/HS?reporterCode=156&period=2023&cmdCode=87 (no key; preview row-capped)"
    refreshed_by: "pending — fetch/fetch_comtrade.py (Phase B)"
    official: false
    notes: >-
      VERIFIED 200 (no auth). Public preview endpoint is row-capped and is a
      cross-check on partner totals, NOT a substitute for the GACC national
      figure. Comtrade is on its own harmonised definition; keep it a separate
      series, never spliced with the customs values.

# --------------------------------------------------------------------------
# people — labour, income, inequality. NBS vs ILO/WB.
# --------------------------------------------------------------------------
people:
  unemployment_nbs.csv:
    source: NBS — surveyed urban unemployment rate (城镇调查失业率)
    url: "OFFICIAL-BLOCKED — data.stats.gov.cn easyquery 403. Series also reaches ILO/WB (see unemployment_intl.csv)."
    refreshed_by: "pending — fetch/fetch_nbs.py (Phase B)"
    official: true
    notes: >-
      TWO DEFINITIONS: the surveyed urban unemployment rate (current headline,
      ~5%) and the older REGISTERED (登记) unemployment rate are different series;
      the registered rate undercounts. Draw the current headline and say which
      it is. The ILO-modeled WB series (SL.UEM.TOTL.ZS) is a third reading.
  gini_nbs.csv:
    source: NBS — national Gini coefficient of disposable income
    url: "OFFICIAL-BLOCKED (403) — published in statistical bulletins; last NBS-published value ~2022"
    refreshed_by: "pending — fetch/fetch_nbs.py (Phase B)"
    official: true
    notes: >-
      The NBS stopped publishing an official Gini after 2022 (VERIFY in Phase B).
      A hole after 2022 is a hole, not a collapse. Drawn beside gini_intl.csv;
      the two are not one quantity twice read (different income definitions).
  gini_intl.csv:
    source: World Bank — SI.POV.GINI (harmonised, own income definition)
    url: "LIVE — https://api.worldbank.org/v2/country/CHN/indicator/SI.POV.GINI?date=2006:2024&format=json"
    refreshed_by: "pending — fetch/fetch_comparables.py (Phase B)"
    official: false
    notes: >-
      VERIFIED. 2022 = 36.0; 2023 and 2024 are null — the WB series LAGS, and the
      nulls stay null (a hole is a hole). Different income definition from the
      NBS Gini; two columns, never spliced.

