# China. The seventh queued country. COUNTRIES.md row 7: the problem is not
# the language, it is source reliability. The atlas publishes what the NBS
# publishes, marked as such, beside the World Bank / IMF / UN series where
# those exist, and says in the notes where the two disagree and by how much.
# Never spliced.
#
# Endpoints were curl'd live on 2026-10-22 and the outcome is recorded per
# series in SOURCES.yaml: World Bank, IMF DataMapper, UNDP HDR25, Yahoo
# 000001.SS and UN Comtrade are LIVE and fetched; the NBS machine API is
# 403-blocked, GACC 412-blocked, and PBoC/SAFE/MOF portals answer but their
# series endpoints are not yet isolated — all parked on the SOURCES.yaml
# pending list, none scraped around.
slug: china
flag_emoji: "🇨🇳"
wordmark: 中国
name:
  en: "China"
  fr: "Chine"
  pt: "China"
  es: "China"
  ko: "중국"
  zh-Hans: "中国"
  zh-Hant: "中國"
  de: "China"
  it: "Cina"
  he: "סין"
  ja: "中国"
  vi: "Trung Quốc"
  uk: "Китай"
  pl: "Chiny"
  ru: "Китай"

# zh-Hans is the ISO-15899 language+script tag COUNTRIES.md assigns China;
# south-korea's ko shows the pattern for a non-Latin script (language code,
# not country code; html_lang + og_locale carry the region). zh-Hans needs
# the zh-CN region forms. Official-first, English default per precedent.
locales:
  - {code: zh-Hans, html_lang: zh-CN, og_locale: zh_CN, endonym: 简体中文}
  - {code: en,      html_lang: en,    og_locale: en_US, endonym: English}
  - {code: pt,      html_lang: pt-BR, og_locale: pt_BR, endonym: Português}
default_locale: en

# On the plate spine (PLATE_SPINE.md): every plate declares its topic and
# claims its panels by slot, on the shared frame and reference scales.
spine: true

# The x-axis span every plate shares, and the last year whose annual totals
# are complete.
years: {from: 2006, to: 2026}
last_full_year: 2025
tick_every: 2

# Bands use the two-consecutive-quarters rule (see Canada/South Korea). The
# staged IMF and World Bank annual series show no annual contraction in the
# window; their 2020 trough is still about +2.3%. Annual data cannot establish
# whether two consecutive negative quarters occurred. The required quarterly
# NBS series is unavailable because its machine endpoint returns 403, so the
# recession-band decision is pending and unsupported rather than a finding of
# "no recession." bands: [] means that no evidence-backed band is published.
# The 2020 shock and the 2022 / 2024-25 slowdowns remain plate events; those
# annotations do not settle the quarterly recession rule.
bands: []

currency:
  code: CNY
  # CROSS-PHASE (not this lane's change; same class as UK's GBP finding):
  #   * CNY has no CURRENCY_AFFIX entry in core/sitebuild.py yet, and zh-Hans
  #     has no AFFIX form — test_the_currency_is_one_the_site_can_write[china]
  #     and test_every_locale_can_be_formatted[china] fail until those additive
  #     core columns exist (Canada's CAD entry is the template).
  #   * zh-Hans is a NEW atlas locale: it joins the locale union, so
  #     test_the_comparison_names_every_country_in_every_language now wants a
  #     name.zh-Hans (and a zh-Hans AFFIX column) on EVERY country. That belongs
  #     to the "site for all" phase, not here. core/numstyle.py already carries
  #     a zh-Hans style (STYLES + 万/亿/万亿 ladder) — see DISCOVERY.md.

# The flag is a red field with four small stars and one large one in gold.
# That is not a chart palette: one hue cannot carry four panels and there is
# no second flag colour to lean on. The red is darkened off the flag's
# #DE2910 to a maroon that holds on newsprint, and the gold is darkened off
# the stars' #FFDE00 to an amber. Chosen deliberately distinct from Canada's
# brighter brick-red (#B5272F) and from Vietnam's planned red/gold sibling.
palette:
  RED:     "#9C1F2E"
  RED_D:   "#75151F"
  GOLD:    "#C8961E"
  GOLD_D:  "#A07814"
  NAVY:    "#1B3A5B"
  BLUE:    "#2E6DA4"
  BLUE_D:  "#1F4E75"
  GREEN:   "#2E7D4F"
  GREEN_D: "#1F5F3A"
  PURPLE:  "#6E5BA6"
  TEAL:    "#13807A"
  primary: "#9C1F2E"
  alert:   "#9C1F2E"
  ink:     "#1F2430"
  muted:   "#5A6072"
  faint:   "#9AA0AE"
  paper:   "#FBFAF7"
  card:    "#FFFFFF"
  grid:    "#E7E4DD"
  spine:   "#C9C6BE"
  band:    "#EFECE5"
  series:  ["#9C1F2E", "#2E6DA4", "#2E7D4F", "#C8961E", "#6E5BA6", "#13807A", "#1F2430"]
  # Red field, the paper, star gold. The middle band is the page colour, so it
  # is drawn with an outline; unstroked it reads as a gap.
  flag_bands: ["#9C1F2E", "#FBFAF7", "#C8961E"]
  # Warm near-black, NOT a saturated red: the money family accent is a coral
  # and a coral accent on a red ground is the one pair that cannot coexist.
  web:
    # 中国 are CJK glyphs centred in a fixed em box, like Hangul — nudging one
    # would pull the wordmark off the margin, not onto it.
    mark_bearing: "0"
    ground:   "#160E10"
    raised:   "#201417"
    raised_2: "#2A181C"
    rule:     "#3A2025"
    ink:      "#F1E7E7"
    muted:    "#B49A9B"
    faint:    "#806668"
    money:    "#E0796F"
    world:    "#2FA8A0"
    people:   "#D7A33F"

seo:
  title:
    zh-Hans: "中国 — 注明来源的数据图版，2006–2026"
    en: "China — sourced data plates, 2006–2026"
    pt: "China — pranchas de dados com fontes identificadas, 2006–2026"
  description:
    zh-Hans: "中国经济、财政、贸易、市场、就业、人口、移民、死亡率与信贷数据图版；世界银行、IMF、BIS、联合国系统及其他明确标注的可比来源分开呈现，受阻的国家序列不以代理值填补。"
    en: "Data plates on China's economy, public finances, trade, markets, work, demography, migration, mortality and credit, using separately labelled comparable series from the World Bank, IMF, BIS, UN system and other documented sources. Blocked national series are disclosed rather than replaced with proxies."
    pt: "Pranchas sobre economia, contas públicas, comércio, mercados, trabalho, demografia, imigração, mortalidade e crédito da China, com séries comparáveis identificadas separadamente do Banco Mundial, FMI, BIS, sistema ONU e outras fontes documentadas. Séries nacionais bloqueadas são declaradas, não substituídas por aproximações."
  keywords:
    - China
    - National Bureau of Statistics
    - NBS
    - People's Bank of China
    - World Bank
    - official statistics
  spatial: "China"

# Named in the dek, and the institutions SOURCES.yaml must agree with.
sources:
  zh-Hans: "国家统计局、中国人民银行、国家外汇管理局、海关总署、财政部，以及世界银行与国际货币基金组织"
  en: "the National Bureau of Statistics, the People's Bank of China, the State Administration of Foreign Exchange, the General Administration of Customs and the Ministry of Finance, with the World Bank and IMF"
  pt: "o Escritório Nacional de Estatísticas, o Banco Popular da China, a Administração Estatal de Câmbio, a Administração Geral de Alfândega e o Ministério das Finanças, com o Banco Mundial e o FMI"
