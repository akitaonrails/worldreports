# Spain. The seventh country in the atlas, and the second eurozone one:
# like France, the money it uses and the rate it pays are set in Frankfurt,
# so the ECB series appear here exactly as they do there. Unlike France it
# is the first country whose migration chapter is built from the start on
# the Eurostat harmonised suite (see COUNTRIES.md and SOURCING_A_COUNTRY
# §4a).
slug: spain
flag_emoji: "🇪🇸"
wordmark: España
name:
  en: "Spain"
  fr: "Espagne"
  pt: "Espanha"
  es: "España"
  ko: "스페인"
  it: "Spagna"
  he: "ספרד"
  ja: "スペイン"
  zh-Hans: "西班牙"
  zh-Hant: "西班牙"
  vi: "Tây Ban Nha"
  de: "Spanien"
  uk: "Іспанія"
  pl: "Hiszpania"
  ru: "Испания"

locales:
  - {code: es, html_lang: es-ES, og_locale: es_ES, endonym: Español}
  - {code: en, html_lang: en,    og_locale: en_GB, endonym: English}
  - {code: pt, html_lang: pt-BR, og_locale: pt_BR, endonym: Português}
default_locale: en

# The x-axis span every plate shares, and the last year whose annual totals
# are complete. A flow for a year still running is not comparable with the
# ones before it, so plates dash or hatch anything past it.
years: {from: 2006, to: 2026}
last_full_year: 2025
tick_every: 2
# On the plate spine (PLATE_SPINE.md): every plate declares its topic and
# claims its panels by slot, on the shared frame and reference scales.
spine: true

# Bands drawn behind the data. Spain's window holds a slump in three
# movements, and the dating is genuinely argued about, so the bands follow
# the quarter-on-quarter sign of seasonally adjusted real GDP (Eurostat
# namq_10_gdp), not the headlines:
#   2008 Q3 to 2009 Q1: three consecutive negative quarters. The decline
#     then sputtered — negative quarters again in 2010 Q1 and Q3 — without
#     ever two in a row, so 2010 is left outside the band.
#   2011 Q1 to 2013 Q3: eleven consecutive negative quarters. Some dating
#     starts it in 2011 Q2 (the "double-dip" after the 2010 flirtation with
#     recovery) and ends it in 2013 Q2; the band follows the sign rule and
#     runs a quarter longer on both sides. Whether 2008–2013 is one slump
#     or two recessions separated by a pause is a debate the band does not
#     settle; what is not contested is that the trough-to-trough fall was
#     about 9% of GDP.
#   2020 Q1–Q2: the COVID contraction, deeper here than anywhere else in
#     the G20 (−17.8% in Q2 alone) because the economy leans on tourism.
bands:
  - {from: 2008.5, to: 2009.25, label: "2008–09 crisis"}
  - {from: 2011.0, to: 2013.5, label: "2011–13 euro crisis"}
  - {from: 2020.0, to: 2020.5, label: "COVID-19"}

currency:
  code: EUR

# The rojigualda is two reds and a yellow, which is not a chart palette:
# flag red #AA151B against flag yellow #F1BF00 vibrates on paper and the
# yellow is nearly the paper's own value. These are darkened, desaturated
# siblings — the red pulled down and cooled, the gualda pulled toward
# ochre — chosen to stay apart from each other in greyscale.
palette:
  ROJO:    "#A32630"
  ROJO_D:  "#7B1B24"
  GUALDA:  "#C79412"
  NAVY:    "#1C3A55"
  BLUE:    "#2F6E9B"
  GREEN:   "#2E7D4F"
  GREEN_D: "#1F5F3A"
  PURPLE:  "#6E5BA6"
  TEAL:    "#13807A"
  primary: "#A32630"
  alert:   "#A32630"
  ink:     "#1F2430"
  muted:   "#5A6072"
  faint:   "#9AA0AE"
  paper:   "#FBFAF7"
  card:    "#FFFFFF"
  grid:    "#E7E4DD"
  spine:   "#C9C6BE"
  band:    "#EFECE5"
  series:  ["#A32630", "#C79412", "#2F6E9B", "#2E7D4F", "#6E5BA6", "#13807A", "#1F2430"]
  # Red, gualda, red — the flag's 1:2:1 laid flat. The middle band is dark
  # enough to carry itself on the paper, unlike France's white, so it needs
  # no outline.
  flag_bands: ["#A32630", "#C79412", "#A32630"]
  # A warm near-black rather than a dark red: the family accents have to
  # stay apart from each other and from the page, and a red accent on a
  # red ground is the one pair that cannot.
  web:
    # E has a flat stem with three arms — a little less bearing than F.
    mark_bearing: "0.053em"
    ground:   "#1E1210"
    raised:   "#291815"
    raised_2: "#331E1A"
    rule:     "#452924"
    ink:      "#F3EAE3"
    muted:    "#BCA69C"
    faint:    "#866B60"
    money:    "#E8736B"
    world:    "#3FA8A0"
    people:   "#E0A93C"

seo:
  title:
    es: "España — planchas de datos oficiales, 2006–2026"
    en: "Spain — plates of official data, 2006–2026"
    pt: "Espanha — pranchas de dados oficiais, 2006–2026"
  description:
    es: "Planchas de datos sobre la economía, las cuentas públicas, el comercio, los mercados, el trabajo, la demografía, la migración, la mortalidad, el crédito y la delincuencia en España, construidas solo a partir de fuentes oficiales y regeneradas desde CSV versionados."
    en: "Data plates on Spain's economy, public finances, trade, markets, work, demography, migration, mortality, credit and crime, built only from official sources and regenerated from committed CSVs."
    pt: "Pranchas de dados sobre a economia, as contas públicas, o comércio, os mercados, o trabalho, a demografia, a migração, a mortalidade, o crédito e o crime da Espanha, construídas apenas a partir de fontes oficiais."
  keywords: [España, Spain, INE, Eurostat, Banco de España, migración, finanzas públicas, official statistics]
  spatial: "Spain"

