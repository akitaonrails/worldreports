    refreshed_by: human review of fetch/fetch_lpc.py sidecar
    notes: >-
      Reviewed 2026-10-23. Calendar-year average of the highest statutory
      adult hourly rate in force, weighted by days. The monthly amount is a
      transparent plate convention, not a legal UK monthly wage: 40 hours a
      week times 52 divided by 12 (173.333 hours), converted at the staged
      Bank of England annual-average USD per GBP. The 2026 exchange rate is
      year-to-date.
  minimum_wage_from_lpc.csv:
    source: "Low Pay Commission — 2025 Report data tables, Historic rates sheet"
    url: https://www.gov.uk/government/publications/low-pay-commission-report-2025
    refreshed_by: fetch/fetch_lpc.py
    notes: >-
      The official workbook carries every effective date and age-specific
      statutory rate from 1999 through April 2026. This file uses the highest
      adult rate, whose eligibility age changed over time (22+, then 21+,
      25+, 23+, and 21+); it is not a youth or apprentice rate. Calendar-year
      averages are day-weighted before the full-time monthly conversion.
  gini_from_ons.csv:
    source: ONS — Household disposable income and inequality, FYE 2025 edition (hdiifye2025.xlsx, Table 10)
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/incomeandwealth/datasets/householddisposableincomeandinequality
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      Gini of equivalised disposable household income (%, 0–100 scale),
      UK scope, with the S80/S20, P90/P10 and Palma ratios and the top
      1% share. Incomes from 2001/02 are adjusted for top-earner
      under-coverage (release note 11).
      FINANCIAL years (April–March): keyed fiscal_year = starting
      year, so 2024 = 2024/25 = FYE 2025. The beta-API dataset `tax-benefits-statistics` is the same
      release family but STALE (latest version dated 2022-09, verified)
      — the bulletin dataset xlsx is the live route; the bulletin exists
      to FYE2025. The World Bank's harmonised Gini (international/) is
      derived from the same survey family through the Bank's own
      definition and lands elsewhere; not two readings of one quantity.
  poverty_from_dwp.csv:
    source: DWP — Households Below Average Income (HBAI), latest release
    url: https://www.gov.uk/government/collections/households-below-average-income-hbai--2
    refreshed_by: fetch/fetch_dwp.py
    notes: >-
      Release to FYE 2025 (hbai data tables zip). % of INDIVIDUALS in
      relative low income, below 60% of that year's median equivalised
      household income, BEFORE and AFTER housing costs — two columns,
      never one; the AHC/BHC gap is itself the finding (housing costs).
      fiscal_year = starting year (2024 = FYE 2025). UK scope from
      2002/03; earlier years are Great Britain only and are not staged.
      Breaks: 2020/21 was collected under COVID restrictions on a much
      reduced sample (read the release's caveat before reading that
      year's dip); from 2021/22 the survey is integrated with
      DWP/HMRC administrative records — not comparable across that seam.
      A relative threshold: it does not fall in a recession where
      everyone's income falls together.

