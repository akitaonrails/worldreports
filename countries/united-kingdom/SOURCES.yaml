security:
  homicide_police.csv:
    source: "Home Office — curated publication copy of homicide_police_from_homeoffice.csv"
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/crimeandjustice/datasets/appendixtableshomicideinenglandandwales
    refreshed_by: human review of fetch/fetch_homeoffice.py sidecar
    notes: "Reviewed 2026-10-23; England & Wales offences by financial year ending March, drawn at the financial-year midpoint and rated with same-year England & Wales population."
  homicide_deaths.csv:
    source: "ONS — curated publication copy of homicide_deaths_from_ons.csv"
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/datasets/the21stcenturymortalityfilesdeathsdataset
    refreshed_by: human review of fetch/fetch_ons.py sidecar
    notes: "Reviewed 2026-10-23; England & Wales calendar-year registrations. The ONS-definition line starts in 2007 after the Y33.9 to U50.9 coding break and is never joined to the police series."
  homicide_police_from_homeoffice.csv:
    source: Home Office Homicide Index, published in the ONS homicide appendix tables (Table 1)
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/crimeandjustice/datasets/appendixtableshomicideinenglandandwales
    refreshed_by: fetch/fetch_homeoffice.py
    notes: >-
      ENGLAND & WALES, YEAR ENDING MARCH — keyed fiscal_year = starting
      year (2024 = April 2024 to March 2025), not a calendar-year series.
      Counts of OFFENCES (one per victim): offences_initially_recorded
      and offences_currently_recorded are two columns, never one (the
      gap is cases later reclassified); table_note keeps the table's own
      note text on years carrying a multi-victim event (Derrick Bird
      2010-11, Hillsborough recorded in 2016-17, the 2017 attacks, the
      2019 Essex lorry deaths), so a spike is not read as a trend. The
      Homicide Index is the police-recorded count at the place of
      occurrence (SOURCING §4). Appendix-tables xlsx verified live
      (/current/ works for THIS dataset — the MYE one 404s; resolve per
      dataset). The police-recorded-crime open-data collection is
      enumerated too, but its recrime-geo-pfa.csv is only a
      force-area GEOGRAPHY LOOKUP (no counts): the fetcher uses it for
      one thing, asserting the 43 territorial forces of England & Wales
      that define this series' scope. No UK-wide police-recorded homicide count
      exists; Scotland and NI are meta.pending.
  homicide_deaths_from_ons.csv:
    source: ONS — 21st Century Mortality dataset (deaths registered by 4-character ICD-10 underlying cause), England & Wales
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/datasets/the21stcenturymortalityfilesdeathsdataset
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      Counts of deaths, 2006–2022 ONLY: the 21CM file ends at 2022 and
      Series DR publishes no all-ages assault total, so 2023–2025 are
      meta.pending, absent rather than estimated. Two columns:
      assault_x85_y09 (ICD-10 X85–Y09) and homicide_ons_definition
      (X85–Y09 + U50.9 + Y87.1, the ONS "homicide and probable homicide"
      grouping; U50.9 is homicide pending inquest, 250–570 deaths a year
      from 2007). CODING BREAK 2006/2007: before 2007 deaths pending
      inquest were coded Y33.9 (undetermined intent, ~435 in 2006), so
      homicide_ons_definition reads 342 in 2006 and 790 in 2007 — a code
      change, not a doubling. Start that column's line at 2007. Pending-
      inquest coding also explains why assault alone fell to 147 in 2020
      (inquests delayed). The death-certificate count, calendar years, E&W — the
      two-publishers-one-idea pair with the Homicide Index: they
      disagree in both directions and neither is wrong (certifier vs
      recording police force; registration year vs occurrence year).
      An ICD code follows whoever certifies the death; see SOURCING §4
      on what that misses. Two columns, two lines, never spliced.

mortality:
  causes_of_death.csv:
    source: "ONS — curated publication copy of causes_of_death_from_ons.csv"
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/datasets/deathsregisteredinenglandandwalesseriesdrreferencetables
    refreshed_by: human review of fetch/fetch_ons.py sidecar
    notes: "Reviewed 2026-10-23; England & Wales underlying-cause chapter totals excluding neonatal deaths. The lens keeps five unjoined regimes around the 2011 ICD-10 update, IRIS replacing MMDS/NCHS in 2014, MUSE replacing IRIS in 2020, and the 2022 MUSE update. Chapter 22 is never substituted for exact U07.1/U07.2 COVID deaths."
  causes_of_death_from_ons.csv:
    source: "ONS — Deaths registered in England and Wales, Series DR 2025 (Table 5, ICD-10 chapter, 2016–2025) and the 21st Century Mortality dataset (2006–2015, aggregated to the same chapters)"
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/datasets/deathsregisteredinenglandandwalesseriesdrreferencetables
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      Counts of deaths, long format (year, chapter, icd10_codes,
      chapter_name, deaths, source). Only TWO workbooks are read: DR
      2025's Table 5 carries 2016–2025, and 2006–2015 come from the 21st
      Century Mortality file aggregated to DR's chapters (U50.9 folded
      into chapter 20 as DR does). The fetcher asserts every chapter of
      the two sources matches to the death on the overlap 2016–2022, and
      the `source` column names which one each row came from. ALL AGES
      EXCLUDING NEONATAL DEATHS (DR's convention), so `all` runs ~1,700–
      2,400 below vital_from_ons.csv's deaths. ch22 (U00–U85) is a true
      0 before 2020: the only U-code in use, U50.9, sits in chapter 20.
      E&W scope, calendar years of registration, underlying cause. "Underlying cause"
      vs "deaths involving" differ enormously for an epidemic
      (SOURCING §4) — underlying only here, labelled. Pre-2010 files
      are legacy .xls. ONS production history has four relevant breaks:
      the 2011 ICD-10 update; IRIS replacing MMDS/NCHS in 2014; MUSE
      replacing IRIS in 2020; and the MUSE update in 2022. The boundary
      year belongs to the new regime. Each is annotated and the plotted
      lines are segmented at all four, never smoothed across them.

