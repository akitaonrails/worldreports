      pair NNRE/QWND runs ~3pt lower. Annual reading = Q4 (a stock over
      the year's income), labelled as such. NIWK counts ALL loans to
      households, student loans and non-bank lenders included: Q4 2025
      £2,194.9bn against the Bank of England's £1,941.4bn of MFI lending
      to individuals (lending_from_boe.csv) — two scopes, not a
