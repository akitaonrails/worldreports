      "Monthly interest rate of UK monetary financial institutions
      (excl. Central Bank) sterling 2 year (60% LTV) fixed rate
      mortgage to households (in percent) not seasonally adjusted"
      (4.48 in January 2025). The second column, IUMTLMV, is now
      verified too: "sterling revert-to-rate mortgage to households (in
