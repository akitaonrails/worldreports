      EU27_2020 aggregates are EMPTY for the UK); earlier blanks are real
      absences. 2019: immigration 680,906, emigration 368,385. The ONS's
      current admin-based series (flows_from_ons.csv) OVERLAPS this one
      for 2012–2019 and reads far higher: YE Dec 2019 immigration
      788,000 (+16%), emigration 605,000 (+64%); 2015 797,000 vs 631,452
      (+26%) and 494,000 vs 299,183 (+65%). Different methods, never
      joined. ENDPOINT TRAP,
      verified live: adding unit=PER (Spain's fix) makes the UK cube
      well-formed and EMPTY — the unit dimension collapses to size 0
      under HTTP 200; for the UK slices the unit filter must be
      DROPPED. The fetcher fails loudly on an empty result either way.
  stocks_from_estat.csv:
    source: Eurostat — migr_pop1ctz (by citizenship) and migr_pop3ctb (by country of birth), population on 1 January
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_pop1ctz?geo=UK&citizen=TOTAL&age=TOTAL&sex=T
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      PERSONS on 1 January, 1998–2019, by citizenship and by country of
      birth, each as total / national / EU28 / non-EU28 (EU28 splits
      from 2014; holes at 2000 and 2002 and scattered blanks before 2009
      are the publisher's). The TOTAL column is not the population of
      record: it equals demo_gind's 1 January population in 2009–2012
      but runs 227k BELOW it in 2006 (60,393,000 vs 60,620,361) and 190k
      ABOVE it in 2019 (66,647,112 vs 66,457,117), and 2003's total is
      below 2001's — draw the national/foreign split, not the total.
      Both cuts, both labelled: the citizenship stock can fall while
      arrivals rise because naturalisation moves people between
      columns (SOURCING §4a); the naturalisations series below is the
      explanation, drawn beside, not inside.
  asylum_from_estat.csv:
    source: Eurostat — migr_asyappctza (asylum applicants, total and first-time)
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_asyappctza?geo=UK&citizen=TOTAL&age=TOTAL&sex=T
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      PERSONS, 2008–2019 (applications blank in 2008 at source).
      Verified for 2019 (44,315 first-time / 46,130 total). Cross-check:
      the Home Office's applications_persons equals Eurostat's
      first-time count to within 2 people in every year 2008–2018; 2019
      differs (45,537 vs 44,315, +2.8%), the Home Office vintage having
      been revised since. The pre-2020 harmonised segment; the Home Office series below is the
      live one. Applications are not arrivals, grants or people
      present (SOURCING §4a) — the four stay as four series.
  permits_from_estat.csv:
    source: Eurostat — migr_resfirst (first residence permits)
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_resfirst?geo=UK&citizen=TOTAL&duration=TOTAL&reason=TOTAL
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      Count of permits. Verified coverage 2008–2018 ONLY (2018: 450,775) — a year
      shorter than the flows. This dataset has NO sex dimension:
      pinning sex=T is a 400 INVALID_QUERY_DIMENSION (verified). A
      first permit is an administrative event, not an arrival (a
      status change issues a new first permit) — labelled as such.
  naturalisation_from_estat.csv:
    source: Eurostat — migr_acq (acquisitions of citizenship)
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_acq?geo=UK&citizen=TOTAL&age=TOTAL&sex=T
    refreshed_by: fetch/fetch_eurostat.py
    notes: >-
      PERSONS, 1998–2019 (2019: 159,348 acquisitions). Cross-check: the
      Home Office grants in citizenship_from_homeoffice.csv run 3–600
      above these in every year 2006–2019 (2019: 159,380), a revision
      gap, not a definitional one. The series that makes the
      citizenship-cut stock fall while arrivals rise. The Home Office
      citizenship-datasets below are the post-Brexit continuation —
      a segment, not a splice.
  flows_from_ons.csv:
    source: ONS — Long-term international migration, provisional (admin-based estimates), latest publication spreadsheet
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/internationalmigration/datasets/longterminternationalimmigrationemigrationandnetmigrationflowsprovisional
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      PERSONS, ROUNDED TO THE NEAREST THOUSAND by the ONS; long format
      (period_end, period_label, status, flow, all_nationalities,
      british, eu_plus, non_eu_plus), immigration / emigration / net,
      55 rolling-year periods each from YE June 2012 to YE December 2025.
      Correction to the research pass: the current "new approach"
      edition (YE December 2025, published 21 May 2026, Table 1) is
      admin-based ALL THE WAY BACK TO YE JUNE 2012, not only from 2021 —
      but it is not one method throughout. Up to YE March 2021, EU+
      nationals come from DWP/HMRC RAPID, non-EU+ from Home Office
      borders data, and British nationals from the International
      Passenger Survey (adjusted to the 2021 census in November 2023);
      from YE June 2021 British come from RAPID, EU+ from Home Office
      visa and EU-settled-status data, and EU+ gains the EEA states and
      Switzerland. The ONS's own notes 16–17: British estimates before
      and after June 2021 are not comparable, and all comparisons across
      June 2021 need caution. The current edition also carries the
      November 2025 British-nationals method change across its whole
      history. status: P = provisional (YE Mar–Dec 2025), R = revised
      (YE Sep 2024–Jun 2025), "P,R" both. ONE VINTAGE throughout, per
      the re-basing rule. REFERENCE PERIODS ARE ROLLING YEARS ENDING
      (YE) the month in period_end: only YE December rows are calendar
      years; YE June 2023 is not 2023. The /current/ symlink
      404s for this dataset (verified): resolve the editioned path from
      the dataset page. Drawn as a separate line beside the Eurostat
      IPS-era line (they overlap 2012–2019 and disagree by 16–37% on
      immigration and 39–65% on emigration), with the June 2021 seam
      annotated on the ONS line, never joined into one line.
  asylum_from_homeoffice.csv:
    source: "Home Office — Immigration system statistics: asylum claims (Asy_D01, Asy_D02) and awaiting-decision (Asy_D03) datasets"
    url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    refreshed_by: fetch/fetch_homeoffice.py
    notes: >-
      The landing page is a STABLE slug; the fetcher enumerates the
      xlsx attachments through the gov.uk content API
      (/api/content/government/statistical-data-sets/immigration-
      system-statistics-data-tables, verified: 48 attachments, jun-2026
      editions) rather than hardcoding assets.publishing.service.gov.uk
      media URLs. PERSONS (main applicants + dependants, the Home Office
      headline convention), calendar years 2006–2025:
      applications_persons (Asy_D01); initial_decisions_persons = grants
      + refusals only (the headline definition); initial_grants_persons;
      withdrawn_or_admin_outcome_persons, kept OUT of decisions (Asy_D02's
      own Decisions column folds them in); and
      awaiting_initial_decision_31dec_persons, the year-end backlog
      (Asy_D03, from 2010 — blank before at source). Applications,
      decisions, grants and the backlog are four different things
      (SOURCING §4a) — never one line. REVISED SERIES: the YE December
      2024 edition headlined 108,138 people claiming in 2024; this
      vintage reads 104,764 (Atlas caseworking migration and data-quality
      work). The fetcher asserts the CURRENT edition's headlines.
  visas_from_homeoffice.csv:
    source: "Home Office — Immigration system statistics: entry-clearance visa outcomes dataset (Vis_D01 applications, Vis_D02 decisions)"
    url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    refreshed_by: fetch/fetch_homeoffice.py
    notes: >-
      Counts of entry-clearance visa applications and visas issued,
      calendar years 2006–2025 (entry-clearance-visa-outcomes dataset;
      the sponsorship dataset is not used). visas_issued splits into
      issued_work / study / visitor / family / other_excl_transit /
      issued_transit, which sum to it: transit sits inside "Other" in
      the dataset but the Home Office headline "Other" excludes it, so it
      is its own column. Applicant-type rows (All / Main Applicant /
      Dependant) are disjoint and are all summed, applications included.
      Visas granted are PERMISSIONS, not arrivals: a grant may never
      be used, and one person can hold several grants in a year. The
      post-Brexit work/study visa series are the demand side of the
      ONS net-migration story; drawn beside, never summed with flows.
  settlement_from_homeoffice.csv:
    source: "Home Office — Immigration system statistics: settlement summary tables (2010–) and detailed datasets (Se_D01/Se_D02, 2020–)"
    url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    refreshed_by: fetch/fetch_homeoffice.py
    notes: >-
      Counts of grants and refusals of settlement (indefinite leave to
      remain), calendar years 2010–2025 — the stock-building flow.
      Administrative events, labelled as grants, not people. Two regimes
      in one family: the detailed Se_D01/Se_D02 cover only 2020 onward
      (the CID → Atlas transition), so 2010–2025 come from the settlement
      SUMMARY tables (ods), asserted equal to the detailed set on every
      overlapping year; 2006–2009 are not in the current edition. Up to
      May 2019 the total includes settlement ON ARRIVAL (immediate-
      settlement visas); of_which_settlement_on_arrival carries that
      component (453 in 2019, blank after) so the break is visible.
  citizenship_from_homeoffice.csv:
    source: "Home Office — Immigration system statistics: citizenship datasets (Cit_D02, grants of British citizenship)"
    url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    refreshed_by: fetch/fetch_homeoffice.py
    notes: >-
      Count of grants of British citizenship, calendar years 2006–2025.
      The post-2019 continuation of Eurostat's migr_acq — a segment,
      never a splice (where they overlap they agree within 0.3%). Naturalisation is what moves people out of the
      foreign-citizen stock without anyone moving.
  irregular_from_homeoffice.csv:
    source: Home Office — Irregular migration to the UK statistics (illegal-entry-routes dataset)
    url: https://www.gov.uk/government/collections/irregular-migration-to-the-uk-statistics
    refreshed_by: fetch/fetch_homeoffice.py
    notes: >-
      Counts of DETECTED irregular arrivals, calendar years 2018–2025
      (the series starts in 2018): irregular_detections (all methods:
      small boats, inadequately documented air arrivals, port and
      in-country detections) and small_boat_detections. The Home Office
      warns that port and in-country detections read lower than in
      earlier releases while collection is reworked. DETECTIONS of arrivals: an
      event, not a person, and only the detected fraction (SOURCING
      §4a's Frontex caveat applies verbatim). Drawn as its own series
      with that label, never as "illegal immigration".

international:
  suicide.csv:
    source: "World Bank — curated publication copy of suicide_from_wb.csv (WHO Global Health Observatory estimate)"
    url: https://api.worldbank.org/v2/country/GBR/indicator/SH.STA.SUIC.P5
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
    notes: "Reviewed 2026-10-23; publisher-supplied age-standardised UK rate per 100,000 through 2021, used unchanged."
  road_deaths.csv:
    source: "World Bank — curated publication copy of road_deaths_from_wb.csv (WHO Global Health Observatory estimate)"
    url: https://api.worldbank.org/v2/country/GBR/indicator/SH.STA.TRAF.P5
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
    notes: "Reviewed 2026-10-23; publisher-supplied UK road-traffic death rate per 100,000 through 2019, used unchanged."
  cpi.csv:
    source: "Transparency International — CPI annual archives (2006–2011) and CPI 2025 results workbook (2012–2025)"
    url: https://www.transparency.org/en/cpi/2025
    refreshed_by: hand-curated from official publisher files
    official: false
    notes: >-
      Two columns and two unjoined segments. The official annual archive CSVs
      for 2006–2011 use the old 0–10 method; the official CPI 2025 workbook
      supplies the revised 0–100 series for 2012–2025. Transparency
      International states that only 2012-onward scores are comparable over
      time. The plate positions the old values times ten against the 0–100
      axis solely to share one panel and labels that display transform; the
      committed observations remain on their original 0–10 scale.
  gdp_usd.csv:
    source: "World Bank — curated publication copy of gdp_usd_from_wb.csv"
    url: https://api.worldbank.org/v2/country/GBR/indicator/NY.GDP.MKTP.CD
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
    notes: "Reviewed 2026-10-23; current US dollars, divided by 1 billion only at draw time."
  gini.csv:
    source: "World Bank — curated publication copy of gini_from_wb.csv"
    url: https://api.worldbank.org/v2/country/GBR/indicator/SI.POV.GINI
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
    notes: "Reviewed 2026-10-23; harmonised calendar-year Gini, ending in 2021, never spliced into the ONS financial-year series."
  poverty.csv:
    source: "World Bank — curated publication copy of poverty_from_wb.csv"
    url: https://api.worldbank.org/v2/country/GBR/indicator/SI.POV.UMIC
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
    notes: "Reviewed 2026-10-23; poverty headcount below US$8.30/day at 2021 PPP, % of population, ending in 2021. It remains separate from DWP's relative-income measures."
  hdi.csv:
    source: "UNDP — curated publication copy of hdi_from_undp.csv"
    url: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
    notes: "Reviewed 2026-10-23; one Human Development Report 2025 vintage throughout."
  reserves.csv:
    source: "World Bank — curated publication copy of reserves_from_wb.csv"
    url: https://api.worldbank.org/v2/country/GBR/indicator/FI.RES.TOTL.CD
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
    notes: "Reviewed 2026-10-23; total reserves including gold in current US dollars, divided by 1 billion only at draw time."
  gdp_pc.csv:
    source: "World Bank — curated publication copy of gdp_pc_from_wb.csv"
    url: https://api.worldbank.org/v2/country/GBR/indicator/NY.GDP.PCAP.CD
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
  fiscal_imf.csv:
    source: "IMF WEO and Fiscal Monitor — curated publication copy of fiscal_from_imf.csv"
    url: https://www.imf.org/external/datamapper/api/v1/GGR_G01_GDP_PT/GBR
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
  gfcf.csv:
    source: "World Bank — curated publication copy of gfcf_from_wb.csv"
    url: https://api.worldbank.org/v2/country/GBR/indicator/NE.GDI.FTOT.ZS
    refreshed_by: human review of fetch/fetch_comparables.py sidecar
    official: false
  gdp_usd_from_wb.csv:
    source: World Bank — World Development Indicators, NY.GDP.MKTP.CD
    url: https://api.worldbank.org/v2/country/GBR/indicator/NY.GDP.MKTP.CD
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Current US$ (raw dollars, not billions), 2006–2025. The
      comparables layer and a magnitude check on YBHA (2024:
      US$3,695.5bn, verified live). Sterling's exchange rate moves
      this series as much as the UK does. Never spliced into the
      national accounts.
  gdp_pc_from_wb.csv:
    source: World Bank — NY.GDP.PCAP.CD
    url: https://api.worldbank.org/v2/country/GBR/indicator/NY.GDP.PCAP.CD
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: "Current US$ per person, 2006–2025 (2024: 53,341, verified), harmonised across countries."
  population_from_wb.csv:
    source: World Bank — SP.POP.TOTL
    url: https://api.worldbank.org/v2/country/GBR/indicator/SP.POP.TOTL
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Persons, 2006–2025. Cross-check only (2024: 69,281,000, verified):
      the population of record is the ONS mid-year estimate, which it
      matches within 0.05% in every year.
  reserves_from_wb.csv:
    source: World Bank — FI.RES.TOTL.CD (IMF IFS)
    url: https://api.worldbank.org/v2/country/GBR/indicator/FI.RES.TOTL.CD
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Total reserves including gold, current US$ (raw dollars),
      2006–2025 (2024: US$174.6bn, verified). A reserve-currency issuer's own reserves are a small
      number by design; the plate says why rather than letting it read
      as fragility.
  openness_from_wb.csv:
    source: World Bank — NE.TRD.GNFS.ZS
    url: https://api.worldbank.org/v2/country/GBR/indicator/NE.TRD.GNFS.ZS
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Exports plus imports of goods and services as % of GDP,
      2006–2025 (2024: 62.8%, verified), national-accounts basis
      (the ONS IKBH+IKBI over YBHA gives 61.5% for 2024, within 1.3pt) — not the
      customs-value trade of the uktradeinfo series.
  gini_from_wb.csv:
    source: World Bank — SI.POV.GINI
    url: https://api.worldbank.org/v2/country/GBR/indicator/SI.POV.GINI
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Gini index 0–100, calendar years 2006–2021. The Bank's harmonised
      Gini; it runs 1–3 points BELOW the ONS FYE figure (2019: 32.8 vs
      35.4). For the UK the recent years are NULL
      (2023 and 2024 verified empty) — it lags, and the holes stay
      holes. Same survey family as the ONS series through a different
      income definition: two cuts of one survey, not two measurements.
  poverty_from_wb.csv:
    source: "World Bank — SI.POV.UMIC, Poverty and Inequality Platform"
    url: https://api.worldbank.org/v2/country/GBR/indicator/SI.POV.UMIC
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Poverty headcount ratio below US$8.30 a day at 2021 PPP, per cent of
      population, 2006–2021 (2021: 0.9, pinned in the fetcher). This is an
      absolute international threshold and is not comparable in concept with
      DWP HBAI's share below 60% of current median income.
  suicide_from_wb.csv:
    source: World Bank — SH.STA.SUIC.P5 (WHO Global Health Observatory estimate)
    url: https://api.worldbank.org/v2/country/GBR/indicator/SH.STA.SUIC.P5
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Suicide mortality rate, age-standardised, per 100,000, 2006–2021
      (2021: 9.55, verified). The only comparable suicide rate for the UK
      in the lane: the ONS publishes England & Wales registrations, not a
      UK age-standardised series, and the GHE's UK rows STOP at 2021 — the
      hole is asserted in the fetcher so a revived series fails the run.
      Age-standardised, so it is not comparable with a crude rate.
  road_deaths_from_wb.csv:
    source: World Bank — SH.STA.TRAF.P5 (WHO Global Health Observatory estimate)
    url: https://api.worldbank.org/v2/country/GBR/indicator/SH.STA.TRAF.P5
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Road-traffic death rate, per 100,000, 2006–2019 (2019: 3.2,
      verified), and the rows stop there. The UK's own count of reported
      road deaths (DfT/ONS, GB scope) was not staged in Phase A, so this
      WHO estimate is the only series in the slot; it is the publisher's
      own rate, not a conversion, and the plate says where it ends.
  gfcf_from_wb.csv:
    source: World Bank — NE.GDI.FTOT.ZS
    url: https://api.worldbank.org/v2/country/GBR/indicator/NE.GDI.FTOT.ZS
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Gross fixed capital formation, whole economy, % of GDP, 2006–2025
      (2025: 18.9%, verified). The harmonised reading of the UK's
      investment rate, which is low by G7 standards; the national
      equivalent would be the ONS national accounts GFCF, not staged.
  hdi_from_undp.csv:
    source: UNDP — Human Development Report 2025, composite indices complete time series
    url: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      Index 0–1, 2006–2023. One file, one vintage, every year (GBR
      2023: 0.946, verified).
      The HDR recomputes the whole back-series at each methodology
      change, so a trend assembled from successive reports is partly an
      artefact of the reports.
  fiscal_from_imf.csv:
    source: "IMF DataMapper — WEO gross debt/net lending plus Fiscal Monitor general-government revenue, expenditure, overall balance and primary balance"
    url: https://www.imf.org/external/datamapper/api/v1/GGXWDG_NGDP/GBR
    refreshed_by: fetch/fetch_comparables.py
    official: false
    notes: >-
      % of GDP. WEO debt/net lending run 1980–2031; Fiscal Monitor flows
      begin later. Verified live: GBR history and
      FORECASTS to 2031 — the forecast years sit in their own *_proj
      columns (2026–2031) and never share a row with the observed ones;
      never drawn as outturn. 2025 is in the observed column as the IMF
      serves it, though it may still be an IMF estimate. Against the
      ONS: IMF gross debt runs 5–8pt above PSND ex (2024: 99.4 vs 94.1;
      2025: 102.1 vs 94.2) and IMF net lending within ~1pt of calendar
      PSNB/GDP (2024: −6.0 vs −5.1) — general government vs public
      sector, gross vs net. This is the harmonised fiscal comparison the
      UK no longer gets from Eurostat (gov_10dd_edpt1 carries no UK
      rows at all): general government on the national-accounts basis,
      CALENDAR years — comparable across the G7, incomparable with the
      ONS PSF fiscal-year series, and never spliced with them. The fiscal
      plate's canonical revenue/expenditure and overall/primary slots use
      Fiscal Monitor indicators GGR_G01_GDP_PT, G_X_G01_GDP_PT,
      GGXCNL_G01_GDP_PT and GGXONLB_G01_GDP_PT. Spot checks: 2020
      36.27/49.14/−12.87/−11.75; 2024 37.44/43.44/−6.00/−3.98; 2025
      38.19/43.46/−5.27/−2.67.
