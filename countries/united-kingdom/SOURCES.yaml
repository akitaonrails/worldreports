    source: "Bank of England — IADB: IUMZICQ (2-year fixed, 60% LTV, quoted mortgage rate to households, monthly)"
    url: https://www.bankofengland.co.uk/boeapps/iadb/fromshowcolumns.asp?csv.x=yes&Datefrom=01/Jan/2006&Dateto=31/Dec/2026&SeriesCodes=IUMZICQ&UsingCodes=Y&VPD=Y&VFD=N
