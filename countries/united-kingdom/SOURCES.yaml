# Data provenance — every planned series for the United Kingdom.
#
# Written 2026-10-22 BEFORE any CSV existed, as the research pass
# prescribes (SOURCING_A_COUNTRY.md §3 step 2), then corrected the same
# day against what the nine fetchers named in `refreshed_by` actually
# pull (the consolidation pass: CDIDs, file names, scopes and columns
# below are the fetchers', not the discovery report's first guesses).
# Reviewed publication copies sit beside their `*_from_<source>.csv`
# sidecars; plates read only the stable filenames. Sidecars whose fetcher writes
# no '#' header (Home Office, Eurostat, comparables, uktradeinfo) have
# their units stated in the notes here. The pending block under `meta` is
# for publishers that exist but could not be staged (walled or
# unreachable) — the page's sources table ignores `meta`.

meta:
  pending:
    - name: OBR forecasts (Economic and fiscal outlook databanks)
      publisher: Office for Budget Responsibility
      url: https://obr.uk/data/
      official: true
      notes: >-
        Every obr.uk route tried on 2026-10-22 — /data/, the historical
        forecasts database, direct xlsx paths — answered 403
        (Cloudflare-class wall) to plain and browser User-Agents alike.
        The atlas draws outturns, not forecasts, so nothing is blocked:
        the fiscal plates are the ONS public sector finances below, which
        is the outturn of record. If the wall lifts, add OBR forecasts
        BESIDE the outturn, labelled as projections.
    - name: gilt issuance and gilt stock by instrument
      publisher: UK Debt Management Office
      url: https://www.dmo.gov.uk/data/
      official: true
      notes: >-
        The page loads (200) but every data link on it is assembled by
        JavaScript/AJAX; no static machine endpoint was found from this
        machine on 2026-10-22. Not needed for v1: the debt stock is the
        ONS's PSND series. Revisit only if a gilt-issuance panel is
        wanted.
    - name: FTSE 100 daily closes from stooq
      publisher: stooq.com (redistributor)
      url: https://stooq.com/q/d/l/?s=%5Eftse&i=d
      official: false
      notes: >-
        stooq is behind a JavaScript proof-of-work wall from this
        machine — the same wall that blocked ^TSX (Canada) and ^IBEX
        (Spain) in their sessions. Yahoo Finance is used instead
        (markets/ftse_from_yahoo.csv); stooq stays here as the fallback.
    - name: trade in goods, country by commodity, via the ONS beta API
      publisher: ONS — dataset `trade` (api.beta.ons.gov.uk)
      url: https://api.beta.ons.gov.uk/v1/datasets/trade/editions/time-series/versions/65/observations
      official: true
      notes: >-
        The dataset exists and is current (version 65, released
        2026-02), dimensions time/geography/standardindustrialtrade-
        classification/countriesandterritories/direction, but the
        /observations endpoint did not answer within 60 s even for a
        single month filtered on one SITC section and one country, and
        returns a 400 listing valid dimensions on a typo'd filter (that
        part is good behaviour). HMRC's uktradeinfo OData API answered
        the same query class in under a second and is the planned route
        (trade/goods_by_partner_from_uktradeinfo.csv).
    - name: Scotland and Northern Ireland crime and mortality
      publisher: NRS / Scottish Government / PSNI / NISRA
      url: https://www.nrscotland.gov.uk/statistics-and-data
      official: true
      notes: >-
        The UK has no UK-wide crime or cause-of-death series: the Home
        Office and ONS homicide counts are England & Wales, and Series
        DR causes of death are England & Wales. v1 declares the E&W
        scope on those plates and names it. A UK-wide assembly (summing
        three publishers with different recording practices) is a later
        editorial decision, not a fetch.
    - name: homicide by death certificate, England & Wales, 2023 onward
      publisher: ONS — 21st Century Mortality dataset / Series DR
      url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/datasets/the21stcenturymortalityfilesdeathsdataset
      official: true
      notes: >-
        security/homicide_deaths_from_ons.csv ends at 2022 because the
        21st Century Mortality file (4-character ICD-10 codes) ends there,
        and Series DR's Table 4 shows homicide only where it ranks in an
        age band, never as an all-ages total. The 2023–2025 deaths are
        counted inside DR's chapter-20 totals (mortality/), but no
        all-ages assault row is published. Wait for the next 21CM
        edition, or find an ONS homicide-by-registration table; do not
        estimate.
    - name: Eurostat HICP and Maastricht 10-year yield for the UK
      publisher: Eurostat — prc_hicp_aind (frozen 1996–2019) and irt_lt_mcby_a (1984–2024)
      url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/irt_lt_mcby_a?geo=UK
      official: true
      notes: >-
        Both verified live in the research pass and named as harmonised
        twins in the prices and gilt notes, but fetch_eurostat.py does not
        stage them. Add them only if a plate draws them, beside (never
        spliced into) CPIH/CPI and the BoE zero-coupon yield; until then
        the gilt yield has no second source in the lane.

macro:
  gdp.csv:
    source: "ONS — curated publication copy of gdp_from_ons.csv"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/grossdomesticproductgdp/timeseries/ybha/ukea
    refreshed_by: human review of fetch/fetch_ons.py sidecar
    notes: "Reviewed 2026-10-23; the plates read this file, never the fetch sidecar."
  prices.csv:
    source: "ONS — curated publication copy of prices_from_ons.csv"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/inflationandpriceindices/timeseries/l55o/mm23
    refreshed_by: human review of fetch/fetch_ons.py sidecar
    notes: "Reviewed 2026-10-23; CPIH and CPI remain separate columns."
  labour.csv:
    source: "ONS — curated publication copy of labour_from_ons.csv"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms
    refreshed_by: human review of fetch/fetch_ons.py sidecar
    notes: "Reviewed 2026-10-23; the 2023-24 survey break is annotated on the plate."
  gdp_from_ons.csv:
    source: "ONS — UK Economic Accounts timeseries: YBHA (nominal GDP, £m), ABMI (real GDP, CVM £m), IHXW (GDP per head, CVM £)"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/grossdomesticproductgdp/timeseries/ybha/ukea
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      The generator endpoint serves a header block (title, CDID, source
      dataset, release date) followed by one row per year. Read the
      ANNUAL frequency; never sum or mean the quarters yourself (UK
      quarterly national accounts are quarterly levels, and annual CVM
      is its own chain-linked figure). £ million throughout; IHXW is £
      per head, CVM at 2024 reference prices. Magnitude check, re-run in
      consolidation: YBHA × the BoE's annual-mean USD/GBP (XUDLUSS)
      lands within 0.5% of the World Bank's current-US$ GDP in every
      year checked (2024: US$3,713bn vs US$3,695.5bn, +0.5%; 2006
      −0.2%) — different vintages and conversion conventions. The same
      series' quarterly JSON (ons.gov.uk .../timeseries/abmi/ukea/data)
      is what dated the recession bands in country.yaml.
  prices_from_ons.csv:
    source: ONS — CPIH annual rate (L55O) and CPI annual rate (D7G7), dataset MM23
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/inflationandpriceindices/timeseries/l55o/mm23
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      TWO COLUMNS, NEVER ONE. CPIH (includes owner-occupiers' housing
      costs) has been the headline since March 2017; CPI is the older
      series and the one the inflation target used until 2003's switch
      from RPIX. They differ by tenths of a point most years. The
      harmonised HICP twin stops at 2019 (Eurostat prc_hicp_aind,
      verified: 1996–2019) — usable only as a pre-Brexit harmonised
      segment, never spliced onto CPIH, and not staged (meta.pending).
  labour_from_ons.csv:
    source: "ONS — Labour Force Survey timeseries: MGSX (unemployment rate 16+, SA) and LF24 (employment rate 16-64, SA), dataset LMS"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      Annual figure = mean of the year. THE LFS QUALITY CRISIS IS A
      BREAK, ANNOTATE IT: response rates collapsed through 2023-24, ONS
      suspended and reweighted outputs (May 2024), and the survey is in
      transition to the Transformed Labour Force Survey. The Eurostat
      harmonised twin (une_rt_a) no longer carries the UK at all —
      verified EMPTY on 2026-10-22 — so there is no harmonised segment
      to draw beside it.
  earnings_from_ons.csv:
    source: ONS — Average Weekly Earnings, whole-economy total pay (KAB9), dataset LMS
    url: https://www.ons.gov.uk/generator?format=csv&uri=/employmentandlabourmarket/peopleinwork/earningsandworkinghours/timeseries/kab9/lms
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      Nominal £/week, SA. awe_real_2025prices_gbp_week is COMPUTED in
      the fetcher (KAB9 × CPIH index L522 for 2025 ÷ L522 for the year),
      labelled as computed on the plate. Same LFS-adjacent
      quality caveats as labour_from_ons.csv for the 2023-24 stretch.

fiscal:
  psnb.csv:
    source: "ONS — curated publication copy of psnb_from_ons.csv"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries/j5ii/pusf
    refreshed_by: human review of fetch/fetch_ons.py sidecar
  psnd.csv:
    source: "ONS — curated publication copy of psnd_from_ons.csv"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries/hf6x/pusf
    refreshed_by: human review of fetch/fetch_ons.py sidecar
  revenue_spending.csv:
    source: "ONS — curated publication copy of revenue_spending_from_ons.csv"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries/jw2o/pusf
    refreshed_by: human review of fetch/fetch_ons.py sidecar
  spending_by_function.csv:
    source: "HM Treasury — curated publication copy of spending_by_function_from_hmt.csv"
    url: https://www.gov.uk/government/statistics/public-expenditure-statistical-analyses-2026
    refreshed_by: human review of fetch/fetch_hmt.py sidecar
  gfs_operations.csv:
    source: "IMF GFS — curated publication copy of gfs_operations_from_imf.csv"
    url: https://api.imf.org/external/sdmx/2.1/data/IMF.STA,GFS_SOO/GBR.S13....A?startPeriod=2005
    refreshed_by: human review of fetch/fetch_imf_gfs.py sidecar
  psnb_from_ons.csv:
    source: "ONS — Public sector finances: public sector net borrowing ex public sector banks (J5II), dataset PUSF"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries/j5ii/pusf
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      £m, not seasonally adjusted, SIGN CONVENTION NEGATIVE = BORROWING
      (2020 calendar year reads −269,927). The generator's annual rows
      are CALENDAR years; the UK budget is made in FINANCIAL years
      (April–March), so one row carries both:
      psnb_ex_calendar_gbp_mn for `year`, and psnb_ex_fiscal_gbp_mn for
      the financial year STARTING in April of `year` (2020 = FY
      2020-21), summed by the fetcher from the twelve PUSF monthly rows
      and blank until all twelve are published. Plates must say which
      they draw. Magnitude check: FY 2020-21 reads −£310.8bn in this
      vintage (the ~£322bn quoted at the time has been revised down);
      calendar 2020 is −£269.9bn — different windows, both correct.
  psnd_from_ons.csv:
    source: "ONS — Public sector finances: PSND ex public sector banks, £bn (HF6W) and % of GDP (HF6X), dataset PUSF"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries/hf6x/pusf
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      HF6W is published in £ BILLION (not £m, as the research pass
      assumed). Month-end STOCKS, never summed: *_dec columns are the
      December reading of `year` (= the generator's annual row);
      *_fy_end columns are the end-March reading that closes the
      financial year starting in `year` (2024 = March 2025).
      PSND ex is the UK's headline debt measure and it is NOT the
      Maastricht general-government gross debt: it nets some liquid
      assets and is not consolidated the EDP way, and the UK no longer
      makes an EDP transmission (Eurostat gov_10dd_edpt1 carries NO UK
      rows at all — verified EMPTY 2026-10-22). The harmonised
      comparison is the IMF WEO series in international/, drawn beside,
      never spliced.
  revenue_spending_from_ons.csv:
    source: "ONS — Public sector finances: total current receipts (JW2O) and total managed expenditure (KX5Q), both ex public sector banks, dataset PUSF"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries/jw2o/pusf
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      £m, current prices, NSA. Correction to the research pass: JW2V is
      the current budget deficit as % of GDP, NOT receipts; receipts are
      JW2O and TME is published as KX5Q, so nothing is derived — the
      fetcher asserts the identity J5II = JW2O − KX5Q on every month.
      *_calendar columns are calendar years; *_fiscal columns are the
      financial year starting in April of `year`, summed from monthly
      rows. *_pct_gdp columns are COMPUTED against YBHA (for fiscal
      years, YBHA Q2–Q4 of `year` plus Q1 of year+1), labelled as
      computed. Cross-check: fiscal TME agrees with HM Treasury's PESA
      to within 0.1% for every year to FY 2024-25 (FY 2024-25:
      £1,290.3bn vs £1,290.0bn); FY 2025-26 differs by 0.4% (£1,365.6bn
      vs £1,360.1bn), PESA's July vintage against PSF's October one.
  spending_by_function_from_hmt.csv:
    source: HM Treasury — Public Expenditure Statistical Analyses (PESA) 2026, Table 4.2 (expenditure on services by function, outturn)
    url: https://www.gov.uk/government/statistics/public-expenditure-statistical-analyses-2026
    refreshed_by: fetch/fetch_hmt.py
    notes: >-
      £ billion, nominal, OUTTURN for every year 2003-04 to 2025-26.
      The fetcher enumerates the release's xlsx attachments via the
      gov.uk content API, not a hardcoded media URL. Functions are UN
      COFOG level 1 as the Treasury assigns them, not Eurostat's COFOG
      transmission (which the UK no longer makes). sub_* columns are
      "of which" detail inside their function — never additive across
      functions. The ten functions plus eu_transactions sum to
      expenditure_on_services within 0.2bn of rounding in every year,
      and expenditure_on_services + accounting_adjustments = tme
      exactly — so a ten-function stack omits EU transactions (a net
      receipt in most years, published sign kept). Published breaks to annotate: EU transactions'
      VAT-based payments (2010-11), student-loan grant element removed
      from education (2011-12), Network Rail in transport from 2015-16.
      FINANCIAL years: fiscal_year is the starting year, never plotted
      against a calendar series without saying so.
  gfs_operations_from_imf.csv:
    source: "IMF Government Finance Statistics — general government S13, interest payable G24_T, % of GDP"
    url: https://api.imf.org/external/sdmx/2.1/data/IMF.STA,GFS_SOO/GBR.S13....A?startPeriod=2005
    refreshed_by: fetch/fetch_imf_gfs.py
    official: false
    notes: >-
      Calendar-year interest payable by general government, % of GDP,
      selected by the exact dimensions COUNTRY=GBR, SECTOR=S13,
      INDICATOR=G24_T, TYPE_OF_TRANSFORMATION=POGDP_PT, FREQUENCY=A.
      This is the canonical fiscal-interest slot. PESA's whole-public-sector
      debt-interest subfunction is shown separately on its April–March key.
      Verified 2006 2.081%, 2022 4.363%, 2024 2.970%.

trade:
  totals.csv:
    source: "ONS — curated publication copy of trade_totals_from_ons.csv"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/nationalaccounts/balanceofpayments/timeseries/ikbh/mret
    refreshed_by: human review of fetch/fetch_ons.py sidecar
  goods_by_partner.csv:
    source: "HMRC — curated publication copy of goods_by_partner_from_uktradeinfo.csv"
    url: https://api.uktradeinfo.com/OTS
    refreshed_by: human review of fetch/fetch_uktradeinfo.py sidecar
  trade_totals_from_ons.csv:
    source: "ONS — UK Trade / Balance of Payments: exports (IKBH) and imports (IKBI) of goods AND services, BoP basis, CP SA £m, dataset MRET; current account balance (HBOP), dataset PNBP"
    url: https://www.ons.gov.uk/generator?format=csv&uri=/economy/nationalaccounts/balanceofpayments/timeseries/ikbh/mret
    refreshed_by: fetch/fetch_ons.py
    notes: >-
      Balance-of-payments basis, goods plus services — the number that
      answers "what does the country sell", and NOT the customs-value
      goods number below (SOURCING §4: the USA pair differed by
      ~$300bn). Current account from PNBP, verified live.
  goods_by_partner_from_uktradeinfo.csv:
    source: HMRC — uktradeinfo Overseas Trade Statistics OData API (api.uktradeinfo.com/OTS)
    url: https://api.uktradeinfo.com/OTS
    refreshed_by: fetch/fetch_uktradeinfo.py
    notes: >-
      OData v4, verified live 2026-10-22: $metadata, Country codelist
      (CountryId 400 = United States), $filter on MonthId (yyyymm),
      FlowTypeId, CountryId, CommodityId all answer in under a second;
      $count for one month at full granularity is ~505,000 rows
      (commodity × country × port), so the fetcher aggregates server-side
      ($apply groupby) per partner per month. Long format, ten fixed
      partners, 2006–2026: imports, exports and balance in £ BILLION;
      import_share / export_share = % of the corresponding customs WORLD
      import / export total (special
      buckets 951/952/958/959/962/977 included in the world total, in no
      partner); months = months summed (the running year is partial —
      2026 is 8 of 12). Pinned by the fetcher: the -990-class sentinels
      are not totals (they are unallocated below-threshold estimate
      rows; the 2.0 probe cell was a genuine tiny shipment); the United
      States is TWO CountryIds (902 to 2008-12, 400 from 2009-01),
      summed; every year before the running one must have 12 months.
      Asserted: world Dec-2025 within 5% of HMRC's commentary (exports
      £29.45bn vs £29.8bn), US 2024 exports within 8% of the ONS BoP
      headline (£57.5bn customs vs £59.3bn BoP), US import share within
      0.5pp. Reviewed all-world export denominators are £413.1901bn in
      2024, £426.2590bn in 2025 and £284.4747bn in the first eight months
      of 2026. The resulting 2025 shares include US 15.78%, Germany 7.74%,
      China 6.53%, Netherlands 5.93%, Switzerland 5.59% and Ireland 5.46%.
      Two traps for the build: EU trade before 2021 is Intrastat
      survey data, after Brexit customs declarations (GB) — a source
      break at 2021; and Switzerland jumps from £17.0bn of imports in
      2024 to £43.2bn in 2025 (£46.9bn in 8 months of 2026), which is
      almost certainly non-monetary gold that the ONS headline excludes
      (unverified — check by commodity before drawing it as trade).
      CUSTOMS VALUE, GOODS ONLY: never spliced with the BoP series.

markets:
  bank_rate.csv:
    source: "Bank of England — curated publication copy of bank_rate_from_boe.csv"
    url: https://www.bankofengland.co.uk/boeapps/database/Bank-Rate.asp
    refreshed_by: human review of fetch/fetch_boe.py sidecar
  gilt_yield.csv:
    source: "Bank of England — curated publication copy of gilt_yield_from_boe.csv"
    url: https://www.bankofengland.co.uk/statistics/yield-curves
    refreshed_by: human review of fetch/fetch_boe.py sidecar
  sterling.csv:
    source: "Bank of England — curated publication copy of sterling_from_boe.csv"
    url: https://www.bankofengland.co.uk/boeapps/database
    refreshed_by: human review of fetch/fetch_boe.py sidecar
  ftse.csv:
    source: "Yahoo Finance — curated publication copy of ftse_from_yahoo.csv"
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5EFTSE
    refreshed_by: human review of fetch/fetch_markets.py sidecar
    official: false
  sp500.csv:
    source: "Yahoo Finance — curated publication copy of sp500_from_yahoo.csv"
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC
    refreshed_by: human review of fetch/fetch_markets.py sidecar
    official: false
  bank_rate_from_boe.csv:
    source: Bank of England — Interactive Database (IADB), series IUDBEDR (Bank Rate, daily)
    url: https://www.bankofengland.co.uk/boeapps/iadb/fromshowcolumns.asp?csv.x=yes&Datefrom=01/Jan/2006&Dateto=31/Dec/2026&SeriesCodes=IUDBEDR&UsingCodes=Y&VPD=Y&VFD=N
    refreshed_by: fetch/fetch_boe.py
    notes: >-
      Verified live: 302-redirects to /boeapps/database/_iadb-
      FromShowColumns.asp (the fetcher must follow redirects), then
      application/csv with dd-Mmm-yyyy dates. Annual mean and year-end
      computed from the daily series. A BOGUS series code returns an
      HTML page under HTTP 200 — the endpoint's own version of the
      lying-endpoint trap; the fetcher asserts the CSV header row.
  sterling_from_boe.csv:
    source: "Bank of England — IADB: XUDLUSS (sterling spot vs US$, daily) and XUDLBK67 (sterling effective exchange rate index, daily)"
    url: https://www.bankofengland.co.uk/boeapps/iadb/fromshowcolumns.asp?csv.x=yes&Datefrom=01/Jan/2006&Dateto=31/Dec/2026&SeriesCodes=XUDLUSS&UsingCodes=Y&VPD=Y&VFD=N
    refreshed_by: fetch/fetch_boe.py
    notes: >-
      XUDLUSS is USD PER GBP (1.31 in January 2020, verified) — a
      FALLING line is a weaker pound, the opposite direction from
      Canada's USDCAD; the plate must say so. XUDLBK67 is the effective
      index (80.6 January 2020, verified). Two columns, both labelled.
  gilt_yield_from_boe.csv:
    source: "Bank of England — IADB: IUDMNPY (10-year nominal zero-coupon gilt yield, daily)"
    url: https://www.bankofengland.co.uk/boeapps/iadb/fromshowcolumns.asp?csv.x=yes&Datefrom=01/Jan/2006&Dateto=31/Dec/2026&SeriesCodes=IUDMNPY&UsingCodes=Y&VPD=Y&VFD=N
    refreshed_by: fetch/fetch_boe.py
    notes: >-
      Verified live (0.85% January 2020). Zero-coupon spot from the
      Bank's estimated yield curve, not a benchmark-bond quote — say
      which on the plate. The Eurostat Maastricht-criterion twin
      (irt_lt_mcby_a) STILL carries the UK (verified 1984–2024) and is
      the harmonised comparison, but it is NOT staged (meta.pending), so
      this series has no second source in the lane yet. Per cent;
      annual mean and year-end of the daily curve; 2026 is partial.
  ftse_from_yahoo.csv:
    source: Yahoo Finance (redistributor) — ^FTSE, monthly closes
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5EFTSE
    refreshed_by: fetch/fetch_markets.py
    official: false
    notes: >-
      Nobody official publishes an index close. PRICE index: the FTSE
      100's dividend yield is among the highest of the major indices,
      so a price-only chart understates London against total-return
      indices; the plate must say so. Monthly close = last trading day
      of the month, so December is the year-end value; the current year
      is a live reading, labelled as such. Verified year-ends: 2007
      6,456.9 · 2024 8,173.0 · 2025 9,931.4. stooq is the fallback and
      is JS-walled (meta.pending).
  sp500_from_yahoo.csv:
    source: Yahoo Finance (redistributor) — ^GSPC, monthly closes
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC
    refreshed_by: fetch/fetch_markets.py
    official: false
    notes: >-
      The S&P 500 in US dollars, drawn ONLY as the spine's dashed
      comparison line on markets slot 4 (PLATE_SPINE.md: "Main equity
      index in US$, with the S&P 500 in US$ dashed"). PRICE index, like
      the FTSE. Same monthly-bar channel and the same year-end rule;
      verified year-ends 2007 1,468.36 · 2024 5,881.63. No currency
      conversion is applied because the index is already in dollars,
      while the FTSE line is converted at
      markets/sterling_from_boe.csv's year-end rate.

social:
  gini.csv:
    source: "ONS — curated publication copy of gini_from_ons.csv"
    url: https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/incomeandwealth/datasets/householddisposableincomeandinequality
