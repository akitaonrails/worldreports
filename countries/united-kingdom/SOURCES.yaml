    source: "Bank of England — IADB: LPMBZ2A (lending to individuals), LPMVTXK (secured on dwellings), LPMBI2O (consumer credit), monthly, SA; codes pinned against the Money and credit Tables A–K workbook"
    url: https://www.bankofengland.co.uk/boeapps/iadb/fromshowcolumns.asp?csv.x=yes&Datefrom=01/Jan/2006&Dateto=31/Dec/2026&SeriesCodes=LPMBZ2A,LPMVTXK,LPMBI2O&UsingCodes=Y&VPD=Y&VFD=N
