# Named in the dek, and the institutions SOURCES.yaml must agree with.
# The State Customs Service is deliberately not named: customs.gov.ua is
# unreachable from the build network (pending in SOURCES.yaml) and no
# plate draws from it — goods trade by partner is the IMF's IMTS and UN
# Comtrade. Open Budget is likewise pending (Akamai-blocked); the budget
# execution shown is the NBU's republication of the Treasury's accounts.
sources:
  uk: "Державна служба статистики України, Національний банк України, Міністерство фінансів України, Офіс Генерального прокурора, а також Світовий банк, МВФ і ПРООН для порівнянь"
  en: "the State Statistics Service of Ukraine, the National Bank of Ukraine, the Ministry of Finance and the Office of the Prosecutor General, plus the World Bank, IMF and UNDP for comparisons"
  pt: "o Serviço Estatal de Estatística da Ucrânia, o Banco Nacional da Ucrânia, o Ministério das Finanças e a Procuradoria-Geral, além de Banco Mundial, FMI e PNUD para comparações"
