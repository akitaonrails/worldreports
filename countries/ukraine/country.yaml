    pt: "Pranchas de dados sobre a economia, a população, a desigualdade e a posição da Ucrânia no mundo, a partir de CSVs versionados, com as lacunas da guerra mostradas como lacunas e o registro nacional desenhado em linha própria ao lado da estimativa internacional."
  keywords: [Ukraine, Україна, State Statistics Service of Ukraine, World Bank, IMF, UNDP, official statistics, war economy]
  spatial: "Ukraine"

# Named in the dek, and the institutions SOURCES.yaml must agree with.
# Only publishers whose numbers are drawn are named: the SSSU population
# register, and the World Bank, IMF and UNDP for the harmonised layer.
# The publishers that are blocked from the build network (the SSSU API,
# the Ministry of Finance, the customs service, Open Budget) are
# recorded in SOURCES.yaml meta.pending and disclosed on the page.
sources:
  uk: "Державна служба статистики України, а також Світовий банк, МВФ і ПРООН для порівнянь"
  en: "the State Statistics Service of Ukraine, plus the World Bank, IMF and UNDP for comparisons"
  pt: "o Serviço Estatal de Estatística da Ucrânia, além de Banco Mundial, FMI e PNUD para comparações"
