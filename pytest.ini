[pytest]
# Five countries each keep a tests/ directory, and the file that asks "do
# this country's plates mean what they say" is called test_plates.py in all
# five. Under the default import mode pytest inserts each test directory on
# sys.path and imports by basename, so the second test_plates.py collides
# with the first. importlib mode imports each file by its own path instead,
# which is what lets the five countries keep parallel names — and a sixth
# country is then a directory, not an edit here.
addopts = --import-mode=importlib
testpaths = tests countries
python_files = test_*.py
filterwarnings =
    error::SyntaxWarning
